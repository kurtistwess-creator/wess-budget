/* ---------- Yearly overview ---------- */
let curYear=new Date().getFullYear();
function yearData(y){
  const now=new Date(),thisY=now.getFullYear();
  const lastM=y<thisY?12:y>thisY?0:now.getMonth()+1;
  const plannedSpend=totalPlanned()-lineAmt(fundLine());
  const rows=[],byLine={};let inc=0,out=0;
  for(let m=1;m<=12;m++){
    const ym=`${y}-${pad(m)}`,tx=(months[ym]&&months[ym].tx)||[];
    let mi=0,mo=0;
    for(const t of tx){const a=num(t.amount);if(t.kind==='income')mi+=a;else{mo+=a;byLine[t.cat]=(byLine[t.cat]||0)+a}}
    inc+=mi;out+=mo;
    rows.push({m,ym,inc:mi,out:mo,has:tx.length>0});
  }
  // count from the first month with anything recorded, so a late start isn't held to a full year of plan
  const first=(rows.find(r=>r.has)||{m:lastM}).m,elapsed=lastM>=first?lastM-first+1:0;
  rows.forEach(r=>{r.past=r.m>=first&&r.m<=lastM});
  return {rows,byLine,inc,out,net:inc-out,elapsed,plannedSpend};
}
function viewYear(){
  const y=curYear,d=yearData(y),active=d.rows.filter(r=>r.has||r.past);
  const avg=d.elapsed?d.out/d.elapsed:0,rate=d.inc>0?d.net/d.inc:0;
  const best=d.rows.filter(r=>r.has).sort((a,b)=>(b.inc-b.out)-(a.inc-a.out))[0];
  const title=d.elapsed===0?`${y} hasn’t started yet`:'Spending each month';
  // monthly spending bars against the planned line; the current month is the blue one
  const W=1000,L=64,R=16,T=12,B=34,H=250,max=Math.max(d.plannedSpend*1.15,...d.rows.map(r=>r.out),1);
  const step=niceStep(max/4),top=Math.ceil(max/step)*step,yy=v=>T+(H-T-B)*(1-v/top),bw=(W-L-R)/12;
  const nowYM=todayISO().slice(0,7);
  let g='';
  for(let v=0;v<=top+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-10}" y="${yy(v)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${fmt0.format(v)}</text>`}
  d.rows.forEach((r,i)=>{
    const x=L+i*bw+bw*.2,w=bw*.6,cur=r.ym===nowYM;
    if(r.out>0)g+=`<rect class="gbar" style="--i:${i}" x="${x}" y="${yy(r.out)}" width="${w}" height="${yy(0)-yy(r.out)}" rx="6" fill="${cur?'var(--accent-soft)':'var(--track)'}" stroke="${cur?'var(--warn)':'var(--warm)'}" stroke-width="${cur?2:1.25}"/>`;
    g+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?600:400}">${MONTHS[i].slice(0,3)}</text>`;
  });
  if(d.plannedSpend>0){const py=yy(d.plannedSpend);g+=`<line x1="${L}" x2="${W-R}" y1="${py}" y2="${py}" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="5 5"/><text x="${W-R}" y="${py-7}" text-anchor="end" font-size="11.5" fill="var(--muted)">Planned ${fmt0.format(d.plannedSpend)}/mo</text>`}
  // where the money went: each line's spending against what was planned for the months so far
  const lines=plan.lines.filter(l=>!['bsfund','jars'].includes(l.id)).map(l=>({l,spent:d.byLine[l.id]||0,planned:lineAmt(l)*d.elapsed})).filter(x=>x.spent>0||x.planned>0).sort((a,b)=>b.spent-a.spent);
  const lineRows=lines.map(({l,spent,planned})=>{const pct=planned?spent/planned:(spent?2:0),cls=pct>1.001?'over':pct>=.9?'warn':'';
    return `<div class="bud"><div class="bud-top"><span>${esc(l.name)}</span><span class="amt"><b>${fmt0.format(spent)}</b> / ${fmt0.format(planned)}</span></div><div class="bar ${cls}"><span style="width:${Math.min(pct,1)*100}%"></span></div></div>`}).join('');
  const table=active.map(r=>{const net=r.inc-r.out;return `<tr${r.ym===nowYM?' class="cur"':''}><td>${MONTHS[r.m-1]}</td><td class="num good">${r.inc?fmt0.format(r.inc):'—'}</td><td class="num">${r.out?fmt0.format(r.out):'—'}</td><td class="num ${net<0?'bad':''}">${r.has?fmt0.format(net):'—'}</td><td class="num ${r.out>d.plannedSpend?'bad':''}">${r.ym===nowYM&&r.out<=d.plannedSpend?'In progress':r.has?(r.out<=d.plannedSpend?'Under by ':'Over by ')+fmt0.format(Math.abs(d.plannedSpend-r.out)):'—'}</td></tr>`}).join('');
  return `<div class="col">
    <section class="summary" aria-label="Year summary">
      <div class="stat"><span class="k">Money in</span><span class="v good">${fmt0.format(d.inc)}</span><span class="s">${d.elapsed?`about ${fmt0.format(d.inc/d.elapsed)} a month`:'&nbsp;'}</span></div>
      <div class="stat"><span class="k">Spent</span><span class="v">${fmt0.format(d.out)}</span><span class="s">${d.elapsed?`about ${fmt0.format(avg)} a month`:'&nbsp;'}</span></div>
      <div class="stat"><span class="k">Kept</span><span class="v ${d.net<0?'bad':''}">${fmt0.format(d.net)}</span><span class="s">${best?`Best month: ${MONTHS[best.m-1]}`:'&nbsp;'}</span></div>
      <div class="stat key"><span class="k">Savings rate</span><span class="v">${d.inc?Math.round(rate*100)+'%':'—'}</span><span class="s">of money in that you kept</span></div>
    </section>
    <section class="panel"><div class="panel-head"><h2>${esc(title)}</h2><span class="sub">Dashed line is your plan</span></div>
      <div class="timeline bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by month in ${y}">${g}</svg></div></section>
    <div class="row">
      <section class="panel"><div class="panel-head"><h2>Where the money went</h2><span class="sub">Spent vs. planned for ${d.elapsed?plural(d.elapsed,'month'):'the year'}</span></div>${lineRows||'<p class="empty">No spending recorded this year yet.</p>'}</section>
      <section class="panel"><h2>Month by month</h2>
        ${table?`<div class="ytable"><table><thead><tr><th>Month</th><th class="num">In</th><th class="num">Spent</th><th class="num">Kept</th><th class="num">vs. plan</th></tr></thead><tbody>${table}</tbody></table></div>`:'<p class="empty">Nothing recorded for this year yet.</p>'}
      </section>
    </div>
  </div>`;
}
function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

/* ---------- Debt-free countdown ---------- */
function debtCountdown(){
  const active=plan.debts.filter(d=>num(d.balance)>0);
  if(!active.length)return '';
  const fund=lineAmt(fundLine()),sb=snowball(fund);
  const start=plan.debts.reduce((x,d)=>x+Math.max(num(d.start),num(d.balance)),0),owed=active.reduce((x,d)=>x+num(d.balance),0),paid=Math.max(0,start-owed);
  if(sb.stuck)return `<section class="panel countdown"><h2>Your debts aren’t shrinking yet</h2><p class="sub">The payments don’t cover the interest. Raise the Baby Step fund or the minimums in your plan.</p></section>`;
  const order=active.slice().sort((a,b)=>(sb.payoff[a.id]||0)-(sb.payoff[b.id]||0)),total=sb.months;
  // One rounded bar per debt, from today to its payoff month. The debt the snowball is on now is the blue one.
  const W=1000,L=170,R=96,T=8,rowH=44,H=T+order.length*rowH+30,x=m=>L+(W-L-R)*m/Math.max(1,total);
  let g='';
  const n0=new Date();
  for(let m=1;m<=total;m++){const d=new Date(n0.getFullYear(),n0.getMonth()+m,1);if(d.getMonth()===0){
    if(x(m)-x(0)<70)continue; // too close to the "Today" label
    g+=`<line x1="${x(m)}" x2="${x(m)}" y1="${T}" y2="${H-26}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>`;
    g+=`<text x="${x(m)}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${d.getFullYear()}</text>`}}
  g+=`<text x="${x(0)}" y="${H-10}" text-anchor="start" font-size="11.5" fill="var(--muted)">Today</text>`;
  order.forEach((d,i)=>{
    const y=T+i*rowH+8,end=sb.payoff[d.id]||total,cur=i===0;
    g+=`<text x="0" y="${y+11}" font-size="13" fill="var(--ink)" font-weight="${cur?600:400}">${esc(d.name.length>18?d.name.slice(0,17)+'…':d.name)}</text>`;
    g+=`<text x="0" y="${y+26}" font-size="11.5" fill="var(--muted)">${fmt0.format(num(d.balance))} left</text>`;
    g+=`<rect x="${x(0)}" y="${y}" width="${Math.max(6,x(end)-x(0))}" height="20" rx="6" fill="${cur?'var(--accent-soft)':'var(--track)'}" stroke="${cur?'var(--accent)':'var(--warm)'}" stroke-width="${cur?2:1.25}"/>`;
    g+=`<text x="${x(end)+8}" y="${y+14}" font-size="11.5" fill="${cur?'var(--accent)':'var(--muted)'}">${monthsFromNow(end)}</text>`;
  });
  return `<section class="panel countdown" aria-label="Debt-free countdown">
    <h2>Debt-free by ${monthsFromNow(total)}</h2>
    <div class="cd-row"><div class="cd-big">${total}<small>months</small></div>
      <div class="field" style="flex:1;min-width:220px"><span class="sub">${fmt0.format(paid)} paid off of ${fmt0.format(start)}</span><div class="bar done" style="height:10px"><span style="width:${start?paid/start*100:0}%"></span></div>
      <span class="sub">The snowball is on <b>${esc(order[0].name)}</b> now: ${fmt0.format(debtMins())} in minimums plus ${fmt0.format(fund)} extra each month.</span></div></div>
    <div class="timeline"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payoff timeline: ${order.map(d=>esc(d.name)+' paid off '+monthsFromNow(sb.payoff[d.id]||total)).join(', ')}">${g}</svg></div>
  </section>`;
}

  if(stepSel==null||stepSel===''||(stepSel!=='__all'&&!(stepSel>=0&&stepSel<7)))stepSel=curI;

  const freeIn=m1!=null&&m2!=null?m1+m2:null,debtsL=plan.debts.filter(d=>num(d.balance)>0).sort((a,b)=>num(a.balance)-num(b.balance));
  const stepFact=i=>{const st=state(i);if(st==='done')return [`✓`,esc(summary[i]||'Done'),''];

    return ['','Build wealth and give generously',''];};

// a bill shows as paid when you tick it, or when a transaction on its budget line for about the same amount lands that month
function billPaid(b,ym){
  const m=months[ym]||{};if(m.paid&&m.paid[b.id])return true;
  if(!b.line)return false;const a=num(b.amount),tol=Math.max(5,a*.15);
  return (m.tx||[]).some(t=>t.kind!=='income'&&t.cat===b.line&&Math.abs(num(t.amount)-a)<=tol);
}
// the calendar date a bill is due inside a budget month
function billDue(b,ym){
  const [a,e]=periodRange(ym),day=Math.min(28,Math.max(1,Math.round(num(b.day))||1));
  for(let d=new Date(a);d<=e;d.setDate(d.getDate()+1))if(d.getDate()===day||(day>28&&d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))return new Date(d);
  return new Date(a);
}
const daysUntil=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(new Date().setHours(0,0,0,0)))/864e5);
function billState(b,ym){
  if(billPaid(b,ym))return {k:'paid',t:'Paid'};
  const n=daysUntil(billDue(b,ym));
  if(n<0)return {k:'late',t:`${-n} day${n===-1?'':'s'} late`};
  if(n===0)return {k:'soon',t:'Due today'};
  if(n<=7)return {k:'soon',t:`Due in ${n} day${n===1?'':'s'}`};
  return {k:'later',t:`Due ${shortDate(billDue(b,ym))}`};
}

  let sum=0;for(const b of plan.bills)for(const ym of [now,next]){const n=daysUntil(billDue(b,ym));if(n>=0&&n<=7&&!billPaid(b,ym))sum+=num(b.amount)}
  return sum;
}

// hovering (or focusing) a bill on the calendar shows its details in a small glass card
function billPop(chip){
  let pop=$('bill-pop');if(!pop){pop=document.createElement('div');pop.id='bill-pop';pop.className='bill-pop';pop.setAttribute('role','tooltip');document.body.appendChild(pop)}
  if(!chip){pop.classList.remove('show');return}
  const b=plan.bills.find(x=>x.id===chip.dataset.billpop);if(!b)return;
  const ym=curMonth,st=billState(b,ym),due=billDue(b,ym),l=plan.lines.find(x=>x.id===b.line),col=l?catColor(l.g):'var(--g2)';
  pop.innerHTML=`<div class="bp-name"><i style="background:${col}"></i>${esc(b.name)}</div><div class="bp-amt">${fmt.format(num(b.amount))}</div>
    <div class="bp-rows"><div>Due<b>${due.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</b></div>
    <div>Budget line<b>${l?esc(l.name):'None'}</b></div>${l?`<div>Category<b>${esc(l.g)}</b></div>`:''}
    <div>Every month on<b>the ${ordinal(Math.round(num(b.day))||1)}</b></div></div>
    <div class="bp-st"><span class="b2-st ${st.k}">${st.k==='paid'?'✓ Paid':st.t}</span></div>`;
  const r=chip.getBoundingClientRect(),w=250,h=pop.offsetHeight||180;
  const left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2)),below=r.top-h-10<($('globalnav').offsetHeight+8);
  pop.classList.toggle('below',below);
  pop.style.left=left+'px';pop.style.top=(below?r.bottom+10:r.top-h-10)+'px';
  pop.style.setProperty('--ox',(r.left+r.width/2-left)+'px');
  requestAnimationFrame(()=>pop.classList.add('show'));
}
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.cal-bill');if(c)billPop(c);else if(!e.target.closest||!e.target.closest('#bill-pop'))billPop(null)});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cal-bill'))billPop(e.target)});

// rebuild the Mac's bill reminders for the next two budget months
let remindTimer=null;
function scheduleReminders(){
  // no bills yet means nothing to remind about, so the Mac doesn't ask for notification permission early
  if(Store.mode!=='native'||!plan||(!plan.bills.length&&!scheduleReminders.had))return;
  scheduleReminders.had=true;
  clearTimeout(remindTimer);remindTimer=setTimeout(()=>{
    const on=plan.settings.notify!==false,days=num(plan.settings.remindDays)||2,items=[];
    if(on){const now=thisPeriod();for(let k=0;k<3;k++){const [y,m]=now.split('-').map(Number),d=new Date(y,m-1+k,1),ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      for(const b of plan.bills){if(billPaid(b,ym))continue;const due=billDue(b,ym),r=new Date(due);r.setDate(r.getDate()-days);if(daysUntil(r)<0)continue;
        items.push({id:`${b.id}-${ym}`,date:isoOf(r),title:`${b.name} is due ${days===1?'tomorrow':'in '+days+' days'}`,body:`${fmt.format(num(b.amount))} due ${shortDate(due)}.`})}}}
    Store.native.postMessage({op:'scheduleBills',items}).catch(()=>{});
  },600);
}

function netWorth(){
  const home=homeValue(),ef=num(plan.ef.balance),jars=(plan.jars||[]).reduce((x,j)=>x+num(j.balance),0),ret=num(plan.nw.retirement),college=num(plan.college&&plan.college.saved);
  const accts=plan.nw.accounts.reduce((x,a)=>x+num(a.amount),0),own=home+ef+jars+ret+college+accts;
  const mort=mortBalance(),debts=plan.debts.reduce((x,d)=>x+Math.max(0,num(d.balance)),0);
  let uAssets=0,uLiab=0;for(const a of (Array.isArray(plan.accounts)?plan.accounts:[])){const b=acctBalance(a);if(isLiab(a))uLiab+=b;else uAssets+=b}
  const owe=mort+debts+uLiab,own2=own+uAssets;
  return {home,ef,jars,ret,college,accts,own:own2,mort,debts,owe,uAssets,uLiab,net:own2-owe,equity:home-mort};
}

const prevPeriod=ym=>{const [y,m]=ym.split('-').map(Number),d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function reviewFacts(ym){
  const tx=(months[ym]?.tx)||[];let inc=0,spent=0;const by={};
  for(const t of tx){const a=num(t.amount);if(t.kind==='income')inc+=a;else{spent+=a;by[t.cat]=(by[t.cat]||0)+a}}
  const planned=totalPlanned()-lineAmt(fundLine());
  const lines=plan.lines.filter(l=>l.id!=='bsfund').map(l=>({n:l.name,d:(by[l.id]||0)-lineAmt(l)}));
  const over=lines.filter(x=>x.d>1).sort((a,b)=>b.d-a.d).slice(0,2),under=lines.filter(x=>x.d<-1&&(by[plan.lines.find(l=>l.name===x.n)?.id]||0)>0).sort((a,b)=>a.d-b.d).slice(0,2);
  return {ym,name:MONTHS[+ym.slice(5)-1],inc,spent,planned,under:planned-spent,over,under2:under,count:tx.length};
}
function reviewTemplate(f){

  if(f.under2.length)parts.push(`${f.under2.map(o=>`${o.n} came in ${fmt0.format(-o.d)} under`).join(' and ')}.`);

}

/* ---------- math inside number boxes: type 1,000*4 (or 250+40, 1200/12, 4k, 3000*15%) and it becomes the answer ---------- */
function calcEval(src){
  let s=String(src||'').replace(/[$,\s]/g,'').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[−–—]/g,'-');
  if(!/[-+*/^()%k]/i.test(s.replace(/^-/,'')))return null;            // just a number: nothing to work out
  let i=0;const peek=()=>s[i],eat=c=>s[i]===c?(i++,true):false;
  const atom=()=>{
    if(eat('-'))return -atom();if(eat('+'))return atom();
    let v;if(eat('(')){v=expr();if(!eat(')'))throw 0}
    else{const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;v=parseFloat(m[0])}
    for(;;){if(eat('k')||eat('K'))v*=1e3;else if(eat('m')||eat('M'))v*=1e6;else if(eat('%'))v/=100;else break}
    if(eat('^'))v=Math.pow(v,atom());return v};
  const term=()=>{let v=atom();for(;;){if(eat('*'))v*=atom();else if(eat('/')){const d=atom();if(!d)throw 0;v/=d}else if(peek()==='(')v*=atom();else return v}};
  const expr=()=>{let v=term();for(;;){if(eat('+')){const t=term();v+=/%$/.test(s.slice(0,i))?v*t:t}else if(eat('-')){const t=term();v-=/%$/.test(s.slice(0,i))?v*t:t}else return v}};
  try{const v=expr();if(i<s.length||!isFinite(v))return undefined;return Math.round(v*100)/100}catch(e){return undefined}
}

// the answer shows in a small pill under the box while you type

function calcTip(el){
  if(!calcPill){calcPill=document.createElement('div');calcPill.className='calc-pill';calcPill.setAttribute('role','status');document.body.appendChild(calcPill)}

  if(el&&typeof v==='number')el.classList.add('calc-on');
  if(el)el.classList.toggle('calc-bad',v===undefined&&el.classList.contains('calc-on'));
  if(v===undefined&&!(el&&el.classList.contains('calc-on'))){calcPill.classList.remove('on');return}
  if(v==null){calcPill.classList.remove('on');return}
  const r=el.getBoundingClientRect();

  if(d.addinc!=null)return 'Income added';
  if(d.set||d.pref)return 'Setting saved';

  if(t&&t.id==='gn-line'){const ym=curMonth,by={};for(const x of (months[ym]||{}).tx||[])if(x.kind!=='income')by[x.cat]=(by[x.cat]||0)+num(x.amount);
    pillMenu(t,plan.lines.filter(l=>l.id!=='bsfund'&&(lineAmt(l)>0||by[l.id])).sort((a,b)=>(by[b.id]||0)-(by[a.id]||0)).map(l=>({label:l.name,hint:by[l.id]?fmt0.format(by[l.id]):'',on:l.id===detailLine,act:()=>openLine(l.id)})));return}

  if(t&&t.dataset.del){const id=t.dataset.del;if(pendingDelete!==id){pendingDelete=id;render();return}

  if(t&&t.dataset.delline){plan.lines=plan.lines.filter(l=>l.id!==t.dataset.delline);savePlan(0);render();return}

  if(t&&t.id==='add-debt'){if(plan.stepsDone)plan.stepsDone[1]=false;const d={id:uid('d'),name:'New debt',balance:0,apr:0,min:0,start:0};plan.debts.push(d);savePlan(0);render();const n=$(`d-${d.id}-name`);n&&n.focus();n&&n.select();return}
  if(t&&(t.id==='assign-rest'||t.dataset.assignrest!=null)){const f=fundLine();setLineAmt(f,viewYM(),lineAmt(f)+plan.takeHome-totalPlanned());savePlan(0);render();return}

    if(pendingDelete!=='group:'+g){pendingDelete='group:'+g;render();return}

  if(t&&t.dataset.jarundo){const j=plan.jars.find(x=>x.id===t.dataset.jarundo);if(j){j.balance=Math.max(0,r2(num(j.balance)-num(j.lastAddedAmt)));delete j.lastAdded;delete j.lastAddedAmt;savePlan(0);render()}return}

function migrate(p){
  const d=defaultPlan();
  const out={...d,...p,mortgage:{...d.mortgage,...(p.mortgage||{})},ef:{...d.ef,...(p.ef||{})},retire:{...d.retire,...(p.retire||{})},college:{...d.college,...(p.college||{})}};
  if(!Array.isArray(p.lines))out.lines=d.lines;
  if(!Array.isArray(p.debts))out.debts=d.debts;
  if(!Array.isArray(p.jars))out.jars=defaultJars();
  if(!out.lines.some(l=>l.id==='jars')){const i=out.lines.findIndex(l=>l.id==='bsfund');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='jars'))}
  for(const db of out.debts)if(db.start==null||num(db.balance)>num(db.start))db.start=num(db.balance);
  if(!Array.isArray(p.stepsDone))out.stepsDone=[num(out.ef.balance)>=1000];
  if(!p.mortV2){
    out.mortV2=true;
    if(out.mortgage.home==null)out.mortgage.home=(out.nw&&out.nw.homeValue!=null)?out.nw.homeValue:out.mortgage.price;
    if(out.mortgageBalance!=null&&num(out.mortgageBalance)<=0)out.mortgageBalance=null;
    if(out.mortgageBalance!=null&&!out.mortgageAsOf)out.mortgageAsOf=todayISO().slice(0,7);
  }
  if(!Array.isArray(out.mortgagePayments))out.mortgagePayments=[];
  if(!out.mortgage.start)out.mortgage.start=out.mortgageAsOf||todayISO().slice(0,7);
  if(!out.lines.some(l=>l.id==='mortextra')){const i=out.lines.findIndex(l=>l.id==='house');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='mortextra'))}
  out.settings={...d.settings,...(p.settings||{})};out.people={...d.people,...(p.people||{})};
  out.nw={...d.nw,...(p.nw||{})};if(!Array.isArray(out.nw.accounts))out.nw.accounts=[];
  if(!Array.isArray(out.bills))out.bills=[];if(!out.nwHistory||typeof out.nwHistory!=='object')out.nwHistory={};
  // older plans carried notes tied to one city; swap those for the general ones
  const fresh=Object.fromEntries(defaultLines().map(l=>[l.id,l.note]));
  for(const l of out.lines)if(l.note&&/Duke|Piedmont|Greenville|ReWa|Upstate|\bSC\b/.test(l.note)&&l.id in fresh)l.note=fresh[l.id];
  out.groups=p.groups;normalizeGroups(out);
  return out;
}
async function boot(){
  applyAppearance();
  try{await Store.init();
    if(Store.mode==='native'){try{await Store.load()}catch(e){}}
    if(Store.mode==='native'){try{scanReady=!!(await Store.native.postMessage({op:'canScan'}))}catch(e){scanReady=false}}
    else{try{sampler=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampler=null}scanReady=!!sampler}const d=await Store.load();months=d.months||{};
    if(d.plan){plan=migrate(d.plan);if(colorsAdded)savePlan(0)}
    else{plan=defaultPlan();const ym=todayISO().slice(0,7);months[ym]={tx:exampleTx(ym)};savePlan(0);saveMonth(ym)}
    cleanOldPayments();
    if(Store.mode==='native'){try{Store.caps=await Store.native.postMessage({op:'capabilities'})||{}}catch(e){Store.caps={}}}
    await Cloud.init();
    if(Cloud.on){try{if(Cloud.wasLinked)await startSync(false);else{const d=await Cloud.loadAll();if(d.plan&&!sameBudget(d))Cloud.choice=d;else if(d.plan)Cloud.subscribe();else{await Cloud.uploadAll();Cloud.subscribe()}}}catch(e){showError('Couldn’t reach your shared budget, so this shows the copy saved on this device.')}}
  }catch(e){
    Store.mode='local';const d=await Store.load();months=d.months||{};plan=d.plan?migrate(d.plan):defaultPlan();
    showError('Couldn’t reach your saved budget, so this session saves in this browser only.');
  }
  curMonth=thisPeriod();lastPeriod=curMonth;bootDone=true;
  if(Store.mode==='native'&&device.sideMini)Store.native.postMessage({op:'sideMini',on:true,animate:false}).catch(()=>{});
  scheduleReminders();
  dropLeftovers();
  runRecurring();
  // the Windows app's jump list (right-click the app): Add a purchase, Bills, Money date
  const qp=new URLSearchParams(location.search);
  if(qp.get('tab')&&['home','tx','cats','plan','cash','accounts','bills','steps'].includes(qp.get('tab')))tab=qp.get('tab');
  if(qp.get('do')==='add')tab='tx';
  render(true);
  if(qp.get('do')==='add')setTimeout(openSheet,300);
  if(qp.get('do')==='md')setTimeout(openMD,300);
  if(canPush()&&device.pushOn)pushReg().catch(()=>{});
  maybeWelcome();
  // arriving from the confirmation email: say so plainly
  if(/type=signup|type=email/.test(location.hash)){history.replaceState(null,'',location.pathname);cloudMsg='✓ Email confirmed. You can sign in now (on the Mac app, click Sign in).';try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,600)}
  if(Cloud.choice)setTimeout(openCloud,700);
  // the first time on a device that can share, offer to sign in
  if(Cloud.ready&&!Cloud.on){let seen=false;try{seen=localStorage.getItem(LS+'-cloud-offered')}catch(e){}if(!seen){try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,900)}}
}
boot();
// the Windows app (the website): if a newer version has been published, switch to it right away instead of waiting on the browser's cache
function checkForUpdate(){const cur=document.querySelector('meta[name="wfb-build"]');if(!cur||!/^https?:/.test(location.protocol))return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/name="wfb-build" content="(\d+)"/);
    if(m&&m[1]!==cur.content&&!sessionStorage.getItem('wfb-upd-'+m[1])){sessionStorage.setItem('wfb-upd-'+m[1],'1');location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
checkForUpdate();
let lastPeriod=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden||!plan)return;checkForUpdate();
  const now=thisPeriod();lastPeriod=lastPeriod||now;
  if(now!==lastPeriod){if(curMonth===lastPeriod)curMonth=now;lastPeriod=now;runRecurring();render()}});
</script>
