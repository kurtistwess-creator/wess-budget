<meta charset="utf-8">
<title>Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--warm:#a39a91;--brand:"Didot","Bodoni 72","Playfair Display",Georgia,serif;--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--baby:#9ecff5;--warm:#7d756d;color-scheme:dark}
}
:root[data-theme="dark"]{--baby:#9ecff5;--warm:#7d756d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
.app{max-width:1120px;margin:0 auto;display:grid}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-family:var(--brand);font-size:31px;font-weight:700;letter-spacing:.005em}
h3{font-family:var(--body)}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.brand{display:flex;align-items:center}
.mark{width:40px;height:40px;flex:none;display:block}
.badge{font-size:12px;color:var(--muted);border-radius:999px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{font-weight:600}
.iconbtn{display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.textbtn:hover{border-color:var(--accent)}
.textbtn.primary{border-color:var(--accent)}
.textbtn:disabled{cursor:default}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.notice.err{border-color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);display:grid;min-width:0;align-content:start}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{color:var(--muted)}
.stat.key .v{font-family:var(--display);font-weight:700}
.good{color:var(--good)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}
.muted{color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted)}
.monthnav{display:flex;align-items:center}
.monthnav .label{font-family:var(--display);min-width:9em;text-align:center}
.group{display:grid;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:12px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* ===================== Helm · pill navigation and bordered cards ===================== */
:root[data-theme="light"]{--bg:#f6f7f9;--card-line:#eceef2}
:root[data-theme="dark"]{--card-line:rgba(255,255,255,.06)}
.sm,.panel,.summary .stat{border:1px solid var(--card-line)!important;border-radius:18px!important}
.sm{box-shadow:none}
.gn-crumb,.nav-inner .gn-fold{display:none;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--card-line);background:var(--surface)!important;box-shadow:none!important;color:var(--ink);font:500 13px/1 var(--body);cursor:pointer;white-space:nowrap;transition:transform .4s var(--spring),background-color .2s}
.gn-crumb b{font-weight:600}
.gn-crumb:hover,.nav-inner .gn-fold:hover{transform:scale(1.03)}
.gn-caret,.nav-inner .gn-fold svg{width:8px;height:8px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-2px) rotate(45deg);flex:none}
.nav-inner .gn-fold svg{width:9px;height:9px;border:0;transform:rotate(90deg);color:var(--muted)}
.gn-sep{display:none;color:var(--muted);opacity:.6;font-size:15px;margin:0 2px}
.nav-inner .gn-fold .lg-gloss,.gn-crumb .lg-gloss{display:none}
.pmenu{position:fixed;z-index:400;min-width:200px;max-height:60vh;overflow:auto;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--card-line);box-shadow:0 18px 50px -12px rgba(0,0,0,.28);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .18s ease,transform .35s var(--spring)}
.pmenu.open{opacity:1;transform:none}
.pmenu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;height:34px;padding:0 10px;border-radius:9px;font:500 13.5px/1 var(--body);color:var(--ink);cursor:pointer}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--fill)}
.pmenu button.on{color:var(--accent);font-weight:600}
.pmenu kbd{margin-left:auto;font:500 12px/1 var(--body);color:var(--muted)}
.pm-note{padding:8px 10px 6px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.pmenu{transition:none}}
/* the line page */
.ln-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px}
.ln-back{all:unset;cursor:pointer;color:var(--accent);font-size:14px;font-weight:500;padding:6px 8px;margin-left:-8px;border-radius:8px}
.ln-back:hover{background:var(--fill)}
.ln-filters{margin-left:auto}
.seg-pills{display:inline-flex;gap:6px}
.seg-pills button{all:unset;cursor:pointer;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--card-line);background:var(--surface);font-size:13px;color:var(--ink);display:inline-flex;align-items:center;transition:transform .35s var(--spring)}
.seg-pills button.on{background:#12224a;border-color:#12224a;color:#fff}
:root[data-theme="dark"] .seg-pills button.on{background:#9ecff5;border-color:#9ecff5;color:#12224a}
.ln-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.ln-hero{grid-row:span 2;cursor:default;padding:20px 22px}
.ln-hero:hover{transform:none;box-shadow:none}
.ln-wide{grid-column:span 2;cursor:default}
.ln-wide:hover,.ln-grid .sm:hover,.ln-tx:hover{transform:none;box-shadow:none}
.ln-grid .sm,.ln-tx{cursor:default}
.ln-ic{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent);flex:none;margin-top:-4px;display:grid;place-items:center}
.ln-ic::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.ln-big{font-size:76px;font-weight:200;letter-spacing:-.045em;line-height:.95;color:var(--ink);margin-top:2px}
.ln-big.bad{color:var(--bad)}
.ln-pct{align-self:flex-end;font-size:13px;color:var(--muted);margin-top:14px}.ln-pct b{font-size:22px;font-weight:400;color:var(--ink);margin-left:4px}
.ln-bar{position:relative;display:block;height:10px;border-radius:5px;background:var(--fill);margin-top:4px}
.ln-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#7db8ec,#9ecff5);box-shadow:0 0 12px rgba(158,207,245,.85)}
.ln-bar.at i{background:linear-gradient(90deg,#2f6fb6,#5a9be0);box-shadow:0 0 12px rgba(47,111,182,.55)}
.ln-bar.over i{background:linear-gradient(90deg,#d70015,#ff5a5f);box-shadow:0 0 12px rgba(215,0,21,.45)}
.ln-bar s{position:absolute;top:-6px;bottom:-14px;border-left:1.5px dashed var(--muted);opacity:.6}
.ln-mark{font-size:11.5px;color:var(--muted);margin-top:10px;white-space:nowrap}
.ln-row{display:flex;align-items:flex-end;gap:22px;margin-top:18px}
.ln-row>span{display:flex;flex-direction:column;gap:2px}
.ln-row em{font-style:normal;font-size:12px;color:var(--muted)}
.ln-row b{font-size:22px;font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums}
.ln-who{padding-top:14px;margin-top:16px;border-top:1px solid var(--line)}
.ln-who b{font-size:16px}
.ln-btn{all:unset;cursor:pointer;margin-left:auto;height:36px;padding:0 16px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;transition:transform .35s var(--spring)}
.ln-btn:hover{transform:scale(1.04)}
.ln-avg{font-size:20px;font-weight:300;color:var(--ink)}.ln-avg em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.ln-curve{width:100%;height:96px;margin-top:6px;overflow:visible}
.ln-path{fill:none;stroke:#9ecff5;stroke-width:2.6;vector-effect:non-scaling-stroke}
.ln-guide{stroke:var(--muted);stroke-dasharray:2 3;opacity:.5;vector-effect:non-scaling-stroke}
.ln-dot{fill:var(--navy-ink)}
.ln-ticks{width:100%;height:12px;stroke:var(--fill-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.ln-ticks line{vector-effect:non-scaling-stroke}
.ln-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ln-cols{position:relative;display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px;padding-bottom:18px}
.ln-cols>s{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fill-strong);margin-bottom:18px}
.ln-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.ln-col i{width:100%;max-width:28px;border-radius:8px;background:color-mix(in srgb,#9ecff5 45%,var(--fill))}
.ln-col.now i{background:#2f6fb6}
:root[data-theme="dark"] .ln-col.now i{background:#9ecff5}
.ln-col em{position:absolute;bottom:-18px;font-style:normal;font-size:11px;color:var(--muted)}
.ln-tx{margin-top:14px;cursor:default}
.ln-li{grid-template-columns:50px 22px minmax(0,1fr) auto 90px!important}
.ln-li i{font-style:normal;color:var(--muted)}
.who-s{background:var(--fill);color:var(--muted)}
[data-line]{cursor:pointer}
.bud[data-line]{border-radius:10px;transition:background-color .2s}
.bud[data-line]:hover{background:var(--fill)}
.sm-cat[data-line]:hover .sm-nm{color:var(--accent)}
@media (max-width:600px){.ln-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ln-hero{grid-row:auto;grid-column:span 2}}
@media (max-width:600px){.ln-grid{grid-template-columns:minmax(0,1fr)}.ln-hero,.ln-wide{grid-column:auto}.ln-big{font-size:64px}.ln-filters{margin-left:0}.ln-li{grid-template-columns:44px 22px minmax(0,1fr) 76px!important}.ln-li>.sm-mu:nth-of-type(2){display:none}}
.mark-img{border-radius:24%;display:block;object-fit:cover}
/* no logo in the corner; the account button wears the logo, in a circle */
.gn-logo,.native .gn-logo{display:none!important}
.gn-me,.native .gn-gear.gn-me{background:none!important;padding:0;overflow:hidden;box-shadow:0 0 0 1px var(--card-line)!important}
:root[data-theme="dark"] .gn-me{background:none!important}
/* the account button: hover and the ship sails up out of its circle, bobbing straight on rolling waves */
html body .gn-me{position:relative;overflow:visible!important;box-shadow:none!important;z-index:5}
.me-tile{position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,#1d2e52,#09132c);box-shadow:0 0 0 1px var(--card-line);transition:box-shadow .4s ease}
.me-sea{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.me-clip{position:absolute;inset:0;clip-path:inset(0 round 50%);transition:clip-path .55s var(--spring)}
.me-ship{position:absolute;left:50%;bottom:22%;height:66%;transform:translateX(-50%);transform-origin:50% 100%;transition:transform .6s var(--spring),filter .4s ease}
html body .gn-me .me-waves{position:absolute;left:0;top:auto;bottom:16%;width:200%;height:14%;max-width:none;margin:0;overflow:visible;color:#9ecff5}
.gn-me .me-waves path{fill:none;stroke:#9ecff5;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.me-ship{z-index:1}
.gn-me:hover .me-clip,.gn-me:focus-visible .me-clip{clip-path:inset(-140% -60% 0 -60% round 0 0 16px 16px)}
.gn-me:hover .me-ship,.gn-me:focus-visible .me-ship{transform:translateX(-50%) translateY(-4%) scale(1.5);filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));animation:me-bob 2.4s ease-in-out .55s infinite}
.gn-me:hover .me-waves,.gn-me:focus-visible .me-waves{animation:me-roll 1.8s linear infinite}
.gn-me:hover .me-tile{box-shadow:0 0 0 1px var(--card-line),0 6px 16px -6px rgba(9,19,44,.6)}
@keyframes me-bob{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
@keyframes me-roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.gn-me:hover .me-ship,.gn-me:hover .me-waves{animation:none}}
html.reduce-motion .gn-me:hover .me-ship,html.reduce-motion .gn-me:hover .me-waves{animation:none}
html body .gn-me,html body .gn-me:hover,html body .gn-me:active{transform:none!important;rotate:none!important}
/* the add button: a pill like the others in the bar, not a second circle beside the logo */
html body .nav-inner .gw-plus{width:auto!important;height:32px!important;padding:0 14px 0 11px!important;border-radius:999px!important;background:var(--surface)!important;color:var(--navy-ink)!important;border:1px solid var(--card-line)!important;box-shadow:none!important;font:600 17px/1 var(--body)!important;display:inline-flex!important;align-items:center;gap:5px}
html body .nav-inner .gw-plus::after{content:"Add";font-size:13px;font-weight:600;letter-spacing:-.005em}
html body .nav-inner .gw-plus .lg-gloss{display:none}
html body .nav-inner .gw-plus:hover{transform:scale(1.04)}
html body .gn-me,html body .native .gn-gear.gn-me{width:32px!important;height:32px!important;margin-left:8px!important}
@media (max-width:600px){html body .nav-inner .gw-plus{padding:0 12px 0 10px!important}}
/* ===================== Helm · Copilot-style layout ===================== */
:root{--side-w:236px;--chart-up:#1b9e46;--chart-down:#d70015}
:root[data-theme="dark"]{--chart-up:#30d158;--chart-down:#ff453a}
.side{display:none}
.mob-only{display:none!important}
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:16px;padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.card-h b{font:600 14.5px/1.2 var(--display);color:var(--ink);display:flex;align-items:center;gap:8px}
.card-a{all:unset;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);transition:color .2s}
.card-a:hover{color:var(--accent)}
.cnt{font-style:normal;font-size:11px;font-weight:700;background:var(--t-blue);color:var(--t-blue-ink);border-radius:999px;padding:2px 8px}
.big{font:700 24px/1.15 var(--display);letter-spacing:-.02em;color:var(--ink)}
.big.xs{font-size:19px}.big.bad,.bad{color:var(--bad)}.good{color:var(--good)}
.mu{color:var(--muted)}.xs{font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0;margin:0}
/* the dashboard */
.dgrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.dgrid .tall{grid-row:span 3}
.dc-head{display:flex;flex-direction:column;align-items:center;gap:3px;margin:2px 0 8px;text-align:center}
.dc-head.left{align-items:flex-start;text-align:left}
.dc-head .mu{font-size:12.5px}
.dc{position:relative;height:132px}.dc svg{width:100%;height:100%;overflow:visible}
.dc-plan{stroke:var(--fill-strong);stroke-width:1.4;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.dc-dot,.lc-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c);transform:translate(-50%,-50%);box-sizing:border-box;pointer-events:none;transition:left .08s linear,top .08s linear}
.dc-tag{position:absolute;transform:translate(10px,-135%);background:var(--chart-up);color:#fff;font:700 11px/1 var(--body);padding:5px 8px;border-radius:7px;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(27,158,70,.5)}
.dc-tag.bad{background:var(--chart-down);box-shadow:0 4px 12px -4px rgba(215,0,21,.45)}
.lc{position:relative;cursor:crosshair}.lc svg{display:block;width:100%;overflow:visible}
.lc-x{stroke:var(--muted);stroke-dasharray:2 3;opacity:0;vector-effect:non-scaling-stroke}
.lc.hover .lc-x{opacity:.6}
.lc-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--surface);font:600 11px/1 var(--body);padding:5px 8px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.lc.hover .lc-tip{opacity:1}
.rpills{display:flex;justify-content:center;gap:4px;margin-top:10px}
.rpills button{all:unset;cursor:pointer;font:600 11.5px/1 var(--body);color:var(--muted);padding:6px 11px;border-radius:999px;transition:background-color .2s,color .2s,transform .35s var(--spring)}
.rpills button:hover{color:var(--ink)}.rpills button.on{background:var(--fill);color:var(--ink)}
.pchip{display:inline-flex;align-items:center;gap:3px;font:700 11px/1 var(--body);padding:4px 7px;border-radius:7px;white-space:nowrap}
.pchip.good{background:var(--t-green);color:var(--t-green-ink)}.pchip.bad{background:var(--t-red);color:var(--t-red-ink)}.pchip.flat{background:var(--fill);color:var(--muted)}
.tcat{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) 64px minmax(60px,110px) 56px;gap:10px;align-items:center;width:100%;padding:7px 4px;border-radius:9px;font-size:13.5px;color:var(--ink)}
.tcat:hover{background:var(--fill)}
.tcat>i{width:8px;height:8px;border-radius:50%}
.tcat b{text-align:right;font-weight:600}.tcat .mu{text-align:right;font-size:12.5px}
.tbar{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.tbar i{display:block;height:100%;border-radius:3px}
.nrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto 84px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}.nrow b{text-align:right;font-weight:600}.nrow .mu{font-size:12.5px;white-space:nowrap}
.gbar2{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:10px 0 12px}.gbar2 i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#12224a,#2f6fb6)}
:root[data-theme="dark"] .gbar2 i{background:linear-gradient(90deg,#5d7ab8,#9ecff5)}
.mdrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#12224a,#1e3466);color:#fff;transition:transform .4s var(--spring)}
.mdrow:hover{transform:translateY(-1px)}
.mdrow>span{display:flex;flex-direction:column;gap:2px;min-width:0}.mdrow b{font-size:13.5px}.mdrow .mu{color:#c9ddf0;font-size:12px}
.mdrow em{margin-left:auto;font-style:normal;font-weight:600;color:#9ecff5;font-size:13px}
/* transaction rows */
.tlist{display:flex;flex-direction:column}
.day{font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.day:first-child{padding-top:4px}
.trow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(120px,1fr) auto 92px;gap:12px;align-items:center;width:100%;min-height:38px;padding:5px 10px;border-radius:10px;font-size:13.5px;color:var(--ink);transition:background-color .15s}
.trow:hover{background:var(--fill)}
.trow.on{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.trow b{text-align:right;font-weight:600}
.tr-n{display:flex;align-items:center;gap:8px;min-width:0}
.tr-n .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tr-n .nm{flex:0 1 auto}.tr-n .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;flex:1 1 0;min-width:0}
.ask-dot,.note-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent)}.note-dot{background:var(--muted);opacity:.6}
.cchip2{display:inline-flex;align-items:center;gap:5px;max-width:132px;font:700 10px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px;color:color-mix(in srgb,var(--c) 80%,#000);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
:root[data-theme="dark"] .cchip2{color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 22%,transparent)}
.rvlist{margin:0 0 6px}
.rvcard{margin-bottom:14px}
/* list + detail, side by side */
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.split>.list{min-width:0}
.pane{position:sticky;top:76px;background:var(--surface);border:1px solid var(--card-line);border-radius:16px;padding:18px 20px;max-height:calc(100vh - 96px);overflow:auto;min-width:0}
.pane-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:300px;color:var(--muted);font-size:13.5px;padding:20px}
.pane-empty svg{width:34px;height:34px;fill:none;stroke:var(--fill-strong);stroke-width:1.6;stroke-linecap:round}
.pane-empty p{max-width:300px;margin:0}
.pane-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.pane-top .del{margin-left:auto}
.pane-back{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:14px;display:none}
.pane-title{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.pane-title h2{font:700 21px/1.2 var(--display);letter-spacing:-.015em;margin:0;flex:1;min-width:0}
.pane-title>b{font:700 21px/1.2 var(--display)}
.pane-title .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto;text-align:right}
.pane-title .rt b{font:700 20px/1.1 var(--display)}
.pfields{display:grid;gap:10px;margin-bottom:12px}
.pf{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:10px;font-size:13px}
.pf>span:first-child{color:var(--muted);font-weight:500}
.pf.col{grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.pf textarea{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid var(--field-line);background:var(--field);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;resize:vertical}
.pill-sel{height:34px;border-radius:999px;border:1px solid var(--card-line);background:var(--surface);color:var(--ink);font:500 13px/1 var(--body);padding:0 30px 0 12px;max-width:100%;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.pane-link{all:unset;cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:500;margin-top:12px;display:inline-block}
.ltools{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.ltools .sd-search{flex:1}
.ln-btn.xs{height:30px;padding:0 12px;font-size:12px}
/* categories */
.ctop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ctop>div{display:flex;flex-direction:column;gap:2px}.ctop .rt{align-items:flex-end;text-align:right}
.cring{width:84px;height:84px}

.cal-empty .cal-g{opacity:.45}
/* 15 · money date: small cards, done button pinned */
html body .md-sec{background:var(--surface);border:1px solid var(--card-line);border-radius:14px;padding:12px 14px;margin:0}
html body .md-ok{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:13.5px;color:var(--ink)}
html body .md-ok::first-letter{color:var(--good)}
html body .sheet.md{gap:10px}
html body .md-done{position:sticky;bottom:-24px;width:100%;margin-top:6px}
/* 17 · inline add links match "+ Add item" */
html body .pg-add[data-addinc]{margin-left:0}
/* 19 · one empty-state pattern */
html body .empty,html body .gempty,html body .nw-note{font-size:13px;color:var(--muted);line-height:1.45}
html body .card .empty,html body .panel .empty,html body .pane .empty{text-align:center;padding:18px 12px}

html body .step.locked{background:var(--surface)!important;border-width:0 1px 1px!important;border-style:solid!important;border-color:var(--card-line)!important}
html body .steps .step.locked:last-child{border-bottom-width:1px!important;border-bottom-left-radius:14px!important;border-bottom-right-radius:14px!important}
html body .steps .step.current+.step.locked,html body .steps .step.done+.step.locked{border-top-width:1px!important}

/* budget line detail: same type and controls as the rest of Helm */
html body .ln-filters .seg-pills{display:inline-flex;gap:0;background:var(--fill);border-radius:var(--ctl-r);padding:3px}
html body .ln-filters .seg-pills button:not(#_){height:28px;border:0!important;background:transparent!important;color:var(--muted)!important;border-radius:8px!important;padding:0 12px;font-weight:500}
html body .ln-filters .seg-pills button.on:not(#_),html body .ln-filters .seg-pills button[aria-checked="true"]:not(#_){background:var(--surface)!important;color:var(--ink)!important;box-shadow:0 0 0 1px var(--card-line)!important;font-weight:600}
html body .ln-back{font-size:13.5px;font-weight:500}
html body .sm{background:var(--surface);border:1px solid var(--card-line)!important;border-radius:16px;padding:16px 18px}
html body .sm-h{font:700 10.5px/1.2 var(--body)!important;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)!important;display:flex;justify-content:space-between;align-items:center;gap:8px}
html body .ln-ic{width:10px;height:10px;border-radius:50%;background:var(--c)!important;box-shadow:none!important;padding:0}
html body .ln-ic::before,html body .ln-ic::after{display:none}
html body .ln-big{font:700 40px/1.05 var(--display)!important;letter-spacing:-.025em;color:var(--ink);margin-top:10px;display:block}
html body .ln-big.bad{color:var(--bad)}
html body .sm-sub{font-size:13px;color:var(--muted)}
html body .ln-pct{font-size:12.5px;color:var(--muted)}
html body .ln-pct b{font:650 15px/1 var(--display);color:var(--ink)}
html body .ln-bar{height:8px;border-radius:4px}
html body .ln-row em{display:block;font:700 10.5px/1.2 var(--body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
html body .ln-row b{font:650 17px/1.1 var(--display);color:var(--ink)}
html body .ln-row.ln-who b{font-size:14.5px}
html body .ln-avg{font:650 15px/1 var(--display);letter-spacing:0;text-transform:none;color:var(--ink)}
html body .ln-avg em{font:500 12px var(--body);font-style:normal;color:var(--muted);text-transform:none;letter-spacing:0}
html body .sm-empty{font-size:13px;color:var(--muted)}

/* budget-line picker */
.lp-native{display:none!important}
.lp-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;width:100%;height:var(--control);padding:0 12px;border-radius:var(--ctl-r);background:var(--surface);border:1px solid var(--card-line);font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.lp-btn:hover{border-color:var(--fill-strong)}
.lp-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.lp-btn>i,.lp-h>i{width:9px;height:9px;border-radius:50%;flex:none}
.lp-v{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-g{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.lp-btn svg{width:12px;height:12px;color:var(--muted);flex:none}
.lp-btn .lp-v:last-of-type{margin-right:auto}
.lp-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:80;background:var(--surface);border:1px solid var(--card-line);border-radius:14px;box-shadow:0 18px 44px -14px rgba(10,20,40,.3);overflow:hidden;animation:lp-in .18s var(--ease)}
.lp-pop.up{top:auto;bottom:calc(100% + 6px)}
@keyframes lp-in{from{opacity:0;transform:translateY(-4px)}}
.lp-search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lp-search svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.lp-search input{all:unset;flex:1;font-size:14px;color:var(--ink)}
.lp-list{max-height:280px;overflow:auto;padding:6px}
.lp-h{display:flex;align-items:center;gap:7px;padding:10px 8px 4px;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lp-h:first-child{padding-top:4px}
.lp-o{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px 8px 24px;border-radius:8px;font-size:14px;color:var(--ink)}
.lp-o:hover{background:var(--fill)}
.lp-o.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.lp-o b{color:var(--accent)}
.lp-none{margin:0;padding:14px;text-align:center;font-size:13px;color:var(--muted)}
.pane .lp-btn{border-color:transparent;padding-left:0}.pane .lp-btn:hover{border-color:var(--card-line);padding-left:12px}

/* ---- app-wide control polish ---- */
.lp-btn.lp-inline{width:auto}
.lp-o.flat{padding-left:10px}
.lp-o span{display:flex;align-items:center;gap:8px}
.lp-o span>i{width:9px;height:9px;border-radius:50%;flex:none}
.lp-pop{min-width:200px}
/* $ in front of the amount */
.amt-wrap{position:relative;display:block}
.amt-wrap>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500;pointer-events:none}
.amt-wrap input{width:100%;box-sizing:border-box;padding-left:24px!important}
/* Today / Yesterday */
.dchips{display:flex;gap:6px;margin-top:6px}
.dchips button{all:unset;cursor:pointer;font:500 12px/1 var(--body);color:var(--accent);padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 9%,transparent)}
.dchips button:hover,.dchips button.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
/* empty month/date fields */
input.de-empty{color:var(--muted)}
/* Helm checkboxes */
html body input[type=checkbox]:not(.switch){appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0 8px 0 0;flex:none;border-radius:6px;border:1.5px solid var(--fill-strong);background:var(--surface);display:inline-grid;place-items:center;vertical-align:-5px;cursor:pointer;transition:background-color .15s,border-color .15s}
html body input[type=checkbox]:not(.switch)::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .2s var(--spring)}
html body input[type=checkbox]:not(.switch):checked{background:var(--accent);border-color:var(--accent)}
html body input[type=checkbox]:not(.switch):checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.f-repeat,.md-goal{display:flex;align-items:center;font-size:13.5px;cursor:pointer}
/* one focus ring everywhere */
html body :focus{outline:none}
html body :is(input,select,textarea):focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)!important}
html body :is(button,a,[tabindex]):focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)!important;border-radius:var(--ctl-r)}
/* selection and scrollbars */
::selection{background:color-mix(in srgb,#9ecff5 55%,transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 35%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--muted) 55%,transparent)}
/* tooltips */
.htip{position:fixed;left:0;top:0;z-index:999;max-width:260px;padding:6px 9px;border-radius:8px;background:var(--ink);color:var(--surface);font:500 12px/1.35 var(--body);pointer-events:none;opacity:0;transition:opacity .15s}
.htip.on{opacity:1}
/* notes box */
html body textarea{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--ctl-r);padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:72px}

.field:has(>.dchips){position:relative}
.field>.dchips{position:absolute;top:-3px;right:0;margin:0;gap:4px}
.field>.dchips button{padding:4px 8px;font-size:11.5px}

.lp-btn{max-width:100%;min-width:0;overflow:hidden}
.lp-v{min-width:0;flex-shrink:1}
.lp-g{min-width:0;flex-shrink:3;overflow:hidden;text-overflow:ellipsis}
.jar .lp-g,.lp-btn.lp-inline .lp-g{display:none}
.jar .lp-btn svg{margin-left:auto}

.set-row .lp-btn,.pc-head .lp-btn,.pc-bill .lp-btn{width:auto!important;flex:0 1 auto;max-width:220px;margin-left:auto}
.set-row .lp-pop{left:auto;right:0;width:240px}

<script>
/* ================= constants ================= */
const LOCKED_GROUPS=['Giving','Saving','Housing','Utilities','Food','Transportation','Health','Insurance','Personal','Lifestyle','Childcare','Miscellaneous','Debt'];
const groupNames=()=>(plan&&plan.groups?plan.groups.map(g=>g.name):LOCKED_GROUPS);
// where existing items belong in the locked categories
const LINE_HOME={health:'Insurance',life:'Insurance',autoins:'Insurance',medical:'Health',subs:'Lifestyle',fun:'Lifestyle',dates:'Lifestyle'};
// category colors: distinct mid-tones that read in light and dark mode (no orange; red stays for "over budget")
const CAT_COLORS=['#007aff','#34c759','#ffcc00','#af52de','#30b0c7','#ff2d55','#5856d6','#a2845e','#00c7be','#9ecff5','#8e8e93','#2e7d32','#e87ba4','#c9a227','#5e7c99','#32ade6','#7e57c2','#8bc34a','#b0436e','#64748b'];
let colorsAdded=false;
// a new category gets a random color that no other category is using
function pickColor(used){
  const free=CAT_COLORS.filter(c=>!used.includes(c));
  if(free.length)return free[Math.floor(Math.random()*free.length)];
  return `hsl(${Math.floor(Math.random()*360)} 55% 55%)`;
}
function normalizeGroups(p){
  const kept=Object.fromEntries((p.groups||[]).filter(g=>g.color).map(g=>[g.name,g.color]));
  const custom=(p.groups||[]).filter(g=>!g.locked&&!LOCKED_GROUPS.includes(g.name)).map(g=>({name:g.name,locked:false}));
  for(const l of p.lines){
    if(!p.groups&&LINE_HOME[l.id])l.g=LINE_HOME[l.id];
    if(l.g==='Insurance & health')l.g='Insurance';
    if(!LOCKED_GROUPS.includes(l.g)&&!custom.some(c=>c.name===l.g))custom.push({name:l.g,locked:false});
  }
  const locked=LOCKED_GROUPS.map(n=>({name:n,locked:true})),debt=locked.pop();
  p.groups=[...locked,...custom,debt];
  // colors stay with their category; built-in categories start from the fixed list, any others get a random free color once
  for(const g of p.groups){
    if(kept[g.name]){g.color=kept[g.name];continue}
    const i=LOCKED_GROUPS.indexOf(g.name);
    g.color=i>=0?CAT_COLORS[i]:pickColor(p.groups.map(x=>x.color).filter(Boolean));
    colorsAdded=true;
  }
  return p;
}
// take-home pay can come from more than one paycheck; the budget uses their total
function syncIncome(){if(plan.incomes&&plan.incomes.length>1)plan.takeHome=r2(plan.incomes.reduce((a,s)=>a+num(s.amt),0))}
/* settings that belong to this computer only (never shared): who uses it, appearance, motion, and the page it opens to */
const DEV_KEY='homestead-budget-v1-device';
let device=(()=>{try{return JSON.parse(localStorage.getItem(DEV_KEY)||'{}')||{}}catch(e){return {}}})();
function saveDevice(){try{localStorage.setItem(DEV_KEY,JSON.stringify(device))}catch(e){}}
const meKey=()=>device.who==='b'?'b':'a',partnerKey=()=>meKey()==='a'?'b':'a';
const meName=()=>personName(meKey()),partnerName=()=>personName(partnerKey());
const reduceMotion=()=>device.motion==='reduced'||matchMedia('(prefers-reduced-motion: reduce)').matches;
// Light / Dark / System: switch the app's dark-mode styles on or off directly, so it works the same in the Mac app and in Edge
function applyAppearance(){
  const t=device.theme||'system';
  for(const sh of document.styleSheets){let rules;try{rules=sh.cssRules}catch(e){continue}
    for(const r of rules){if(!r.media||!/prefers-color-scheme:\s*dark/.test(r.media.mediaText))continue;
      // each dark-mode block keeps its "dark" test, so it can always be found again: always on, never on, or follow the system
      const want=t==='dark'?'all, (prefers-color-scheme: dark)':t==='light'?'(prefers-color-scheme: dark) and (max-width: 0px)':'(prefers-color-scheme: dark)';
      if(r.media.mediaText!==want)r.media.mediaText=want}}
  document.documentElement.classList.toggle('reduce-motion',device.motion==='reduced');
  // styles written for dark mode by name (the glass bar's edges and shine) follow the look actually on screen
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyAppearance());
const personName=k=>k==='a'?(plan.people&&plan.people.a)||'You':k==='b'?(plan.people&&plan.people.b)||'Spouse':'Shared';
const INCOME_CATS=[{id:'paycheck',name:'Paycheck'},{id:'otherin',name:'Other income'}];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const LS='homestead-budget-v1';
const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const fmt0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round(n*100)/100;
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,%\s]/g,''));return isFinite(n)?n:0};
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// budget months can start on payday (Settings): with a start day of 15, "October" runs Oct 15 – Nov 14
const startDay=()=>Math.min(28,Math.max(1,Math.round(num(plan&&plan.settings&&plan.settings.startDay))||1));
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function periodOf(iso){const [y,m,d]=iso.split('-').map(Number);if(d>=startDay())return `${y}-${pad(m)}`;const p=new Date(y,m-2,1);return `${p.getFullYear()}-${pad(p.getMonth()+1)}`}
function periodRange(ym){const [y,m]=ym.split('-').map(Number),sd=startDay();return [new Date(y,m-1,sd),new Date(y,m,sd-1)]}
const shortDate=d=>!d||isNaN(d)?'—':`${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
function periodLabel(ym){if(startDay()===1)return '';const [a,b]=periodRange(ym);return `${shortDate(a)} – ${shortDate(b)}`}
const thisPeriod=()=>periodOf(todayISO());
function monthName(ym){const [y,m]=ym.split('-').map(Number);return `${MONTHS[m-1]} ${y}`}
function monthsFromNow(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`}
function duration(n){if(n<=0)return 'now';const y=Math.floor(n/12),m=n%12;return [y?`${y} yr`:'',m?`${m} mo`:''].filter(Boolean).join(' ')}

const Store={mode:'local',chains:{},timers:{},
  async init(){
    const native=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.store;
    if(native){this.mode='native';this.native=native;return}
    let db=null;try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
    if(db){this.mode='db';this.db=db;return}
    this.mode='local';
  },
  async load(){
    if(this.mode==='native'){const s=await this.native.postMessage({op:'load'});const o=s?JSON.parse(s):{};this.prefs=o.prefs||{};return {plan:o.plan||null,months:o.months||{}}}
    if(this.mode==='db'){
      const p=await this.db.doc('app/plan').get();
      const ms=await this.db.collection('months').get();
      const out={};ms.docs.forEach(d=>{out[d.id]=d.data()});
      return {plan:p.exists?p.data().plan:null,months:out};
    }
    try{const o=JSON.parse(localStorage.getItem(LS)||'{}');return {plan:o.plan||null,months:o.months||{}}}catch(e){return {plan:null,months:{}}}
  },
  write(key,value){
    const base=this.writeLocal(key,value);
    return Cloud.on?Promise.all([base,Cloud.put(key,value)]):base;
  },
  writeLocal(key,value){
    if(this.mode==='native')return this.native.postMessage({op:'save',key,value:JSON.stringify(value)});
    if(this.mode==='db')return key==='plan'?this.db.doc('app/plan').set({plan:value}):this.db.doc('months/'+key.slice(6)).set(value);
    try{const o=JSON.parse(localStorage.getItem(LS)||'{}');o.months=o.months||{};
      if(key==='plan')o.plan=value;else o.months[key.slice(6)]=value;
      localStorage.setItem(LS,JSON.stringify(o))}catch(e){}
    return Promise.resolve();
  },
  save(key,value,delay=0){
    snapCache=null;
    clearTimeout(this.timers[key]);
    return new Promise(res=>{this.timers[key]=setTimeout(()=>{
      const snap=JSON.parse(JSON.stringify(value));
      this.chains[key]=(this.chains[key]||Promise.resolve()).then(()=>this.write(key,snap)).then(()=>{showError('')},e=>{
        showError(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old entries, then try again.':'Your last change didn’t save. Check your connection and try again.')});
      this.chains[key].then(res);
    },delay)});
  }
};

  async init(){

    addEventListener('online',()=>this.resync());

    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.resync()});addEventListener('focus',()=>this.resync());setInterval(()=>{if(!document.hidden&&(!this.live||Date.now()-(this.last||0)>15000))this.resync()},4000);setInterval(()=>{if(Object.keys(this.pending).length)this.resync()},30000);
  },
  async findHousehold(){
    const {data}=await this.sb.from('household_members').select('household_id, households(invite_code,name)').eq('user_id',this.user.id).limit(1);
    if(data&&data[0]){this.hid=data[0].household_id;this.code=data[0].households&&data[0].households.invite_code}
  },
  async loadAll(){
    const {data,error}=await this.sb.from('budget_kv').select('key,value,updated_at').eq('household_id',this.hid);if(error)throw error;this.last=Date.now();this.seen={};for(const r of data)this.seen[r.key]=r.updated_at;
    const out={plan:null,months:{}};for(const r of data){if(r.key==='plan')out.plan=r.value;else if(/^month[:-]/.test(r.key))out.months[r.key.slice(6)]=r.value;else if(r.key==='inbox')setInbox(r.value,true)}
    return out;
  },
  async put(key,value){this.dirty=this.dirty||{};this.dirty[key]=Date.now();
    const at=new Date().toISOString();let error;try{({error}=await this.sb.from('budget_kv').upsert({household_id:this.hid,key,value,updated_at:at,updated_by:this.user.id}))}catch(e){error=e}
    if(!error&&this.seen)this.seen[key]=at;
    if(error){this.pending[key]=value;this.savePending();throw error}this.last=Date.now();if(key in this.pending){delete this.pending[key];this.savePending()}
  },
  // changes that haven't reached the shared budget yet survive quitting the app
  savePending(){try{localStorage.setItem('wfb-pending',JSON.stringify(this.pending))}catch(e){}},
  async flush(){if(!this.on)return false;for(const [k,v] of Object.entries(this.pending)){try{await this.put(k,v)}catch(e){return false}}showError('');return true},
  // a light check: just each row's last-saved time, so a quiet poll costs almost nothing
  async changed(){
    const {data,error}=await this.sb.from('budget_kv').select('key,updated_at').eq('household_id',this.hid);if(error)throw error;
    this.seen=this.seen||{};const keys=data.filter(r=>this.seen[r.key]!==r.updated_at).map(r=>r.key);this.last=Date.now();return keys;
  },
  async resync(){
    if(!this.on||this.syncing)return;this.syncing=true;
    try{if(await this.flush()){if(this.seen&&!(await this.changed()).length){if(!this.ch)this.subscribe();return}
      const d=await this.loadAll();const same=JSON.stringify(d.plan)===JSON.stringify(plan)&&Object.entries(d.months||{}).every(([k,v])=>JSON.stringify(v)===JSON.stringify(months[k]));if(same){if(!this.ch)this.subscribe();return}
      snapCache=null;if(d.plan){plan=migrate(d.plan);Store.writeLocal('plan',plan)}
      for(const [ym,m] of Object.entries(d.months||{})){months[ym]=m;Store.writeLocal('month:'+ym,m)}
      dropLeftovers();
      if(!this.ch)this.subscribe();
      const a=document.activeElement;if(a&&a.matches&&a.matches('input,select,textarea'))this.redraw=true;else render()}}
    catch(e){}finally{this.syncing=false}
  },
  async uploadAll(){await this.put('plan',plan);for(const [ym,m] of Object.entries(months))await this.put('month:'+ym,m)},
  subscribe(){
    // syncing is on: from now on this device is linked to the shared budget
    try{localStorage.setItem('wfb-hid',JSON.stringify({u:this.user.id,hid:this.hid,code:this.code}))}catch(e){}this.wasLinked=true;
    if(this.ch)this.sb.removeChannel(this.ch);
    this.ch=this.sb.channel('kv-'+this.hid).on('postgres_changes',{event:'*',schema:'public',table:'budget_kv',filter:'household_id=eq.'+this.hid},p=>this.remote(p)).subscribe(st=>{this.live=st==='SUBSCRIBED';if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){clearTimeout(this.retry);this.retry=setTimeout(()=>{if(this.on)this.subscribe()},3000)}});
  },
  // the other person saved something: take it, keep this device's copy in step, and redraw unless you're mid-typing
  remote(p){
    snapCache=null;
    const r=p.new;if(!r||!r.key)return;if(this.seen&&r.updated_at)this.seen[r.key]=r.updated_at;
    if(r.key==='inbox'){setInbox(r.value);return}
    const cur=r.key==='plan'?plan:months[r.key.slice(6)];if(cur&&JSON.stringify(cur)===JSON.stringify(r.value))return;
    if(/^month[:-]/.test(r.key))partnerNews(cur,r.value);
    // a change still waiting to be sent from here wins over an older copy coming back
    if(Store.timers&&Store.timers[r.key]&&this.dirty&&this.dirty[r.key]>Date.now()-1500)return;
    if(r.key==='plan')plan=migrate(r.value);else if(/^month[:-]/.test(r.key))months[r.key.slice(6)]=r.value;else return;
    Store.writeLocal(r.key,r.value);dropLeftovers();
    const a=document.activeElement;if(a&&a.matches&&a.matches('input,select,textarea')&&!a.closest('#settings-sheet')){this.redraw=true;return}
    render();
  }
};

function mortgage(){
  const m=plan.mortgage,loan=Math.max(0,m.price*(1-m.downPct/100)),r=m.rate/1200,n=Math.round(m.years*12);

  const pi=pay(loan,n),tax=m.price*m.taxRate/100/12,ins=m.insYear/12,pmi=m.downPct<20?loan*m.pmiRate/100/12:0;

}

function monthsUntil(ym){if(!ym)return 0;const [y,m]=ym.split('-').map(Number),n=new Date();return Math.max(1,(y-n.getFullYear())*12+(m-1-n.getMonth()))}

// The mortgage balance you enter is saved with the month you entered it. From then on it goes down by itself each month:
// interest is added, then the principal-and-interest payment and any monthly extra come off.
// was the mortgage paid in this budget month? the Mortgage bill ticked off, or a payment logged to the mortgage line
function mortPaidIn(ym){const m=months[ym];if(!m)return false;
  if((plan.bills||[]).some(b=>b.line==='house'&&m.paid&&m.paid[b.id]))return true;
  return (m.tx||[]).some(t=>t.kind!=='income'&&t.cat==='house'&&num(t.amount)>0)}
const mortPaidCount=()=>Object.keys(months).filter(ym=>mortPaidIn(ym)).length;
const mortStart=()=>(plan.mortgage&&plan.mortgage.start)||thisPeriod();
function mortBalance(){
  // Balance today = what you borrowed (home price − down payment), minus the payments you've actually made:
  // each month the mortgage is marked paid (the Mortgage bill on Bills, or a payment logged to the mortgage line),
  // plus "Extra every month" in those months, plus one-time payments
  const mo=mortgage(),r=plan.mortgage.rate/1200,pay=mo.pi+num(plan.extraMortgage),start=mortStart();
  const once={};for(const p of plan.mortgagePayments||[]){const ym=String(p.date||'').slice(0,7)||thisPeriod();once[ym]=(once[ym]||0)+num(p.amount)}
  const yms=[...new Set([...Object.keys(months),...Object.keys(once)])].sort();
  let bal=mo.loan;
  for(const ym of yms){if(bal<=0)break;if(mortPaidIn(ym))bal=Math.max(0,bal+bal*r-pay);bal=Math.max(0,bal-(once[ym]||0))}
  return r2(bal); // (older budgets stored a typed-in balance; it isn't used any more)
}

function payoffCurve(extra){const r=plan.mortgage.rate/1200,pay=mortgage().pi+extra;let b=mortBalance();const out=[b];
  if(pay<=b*r)return null;while(b>0.005&&out.length<600){b=Math.max(0,b+b*r-pay);out.push(b)}return out}
function lineName(id){if(id==='paycheck'||id==='otherin')return INCOME_CATS.find(c=>c.id===id).name;if(id==='bsfund')return fundName();const l=plan.lines.find(x=>x.id===id);return l?l.name:'Uncategorized'}

function snowball(extra){
  const all=plan.debts.filter(d=>num(d.balance)>0).map(d=>({id:d.id,bal:num(d.balance),apr:num(d.apr),min:num(d.min)})).sort((a,b)=>a.bal-b.bal);
  const budget=extra+all.reduce((s,d)=>s+d.min,0),payoff={};let m=0;
  while(all.some(d=>d.bal>0.005)&&m<600){
    m++;let avail=budget;
    for(const d of all)if(d.bal>0)d.bal+=d.bal*d.apr/1200;
    for(const d of all)if(d.bal>0){const p=Math.min(d.min,d.bal);d.bal-=p;avail-=p}
    for(const d of all){if(avail<=0)break;if(d.bal>0){const p=Math.min(avail,d.bal);d.bal-=p;avail-=p}}
    for(const d of all)if(d.bal<=0.005&&!payoff[d.id])payoff[d.id]=m;
  }
  return {months:m,payoff,stuck:m>=600};
}
function amortize(bal,extra){
  const r=plan.mortgage.rate/1200,pay=mortgage().pi+extra;let m=0,interest=0;
  if(bal<=0)return {months:0,interest:0};
  if(pay<=bal*r)return {months:Infinity,interest:Infinity};
  while(bal>0.005&&m<1200){const i=bal*r;interest+=i;bal=bal+i-pay;m++}
  return {months:m,interest};
}

function applyStepMoney(tx){

  if(g.type==='ef'){plan.ef.balance=r2(num(plan.ef.balance)+a);const s=stepInfo(),goal=s.current===0?1000:s.efTarget,left=Math.max(0,goal-num(plan.ef.balance));note=`${fmt0.format(a)} added to your emergency fund${left>0?` · ${fmt0.format(left)} to go`:' · goal reached'}`}

function stepProgress(){

function viewCash(){

  const gOf={};for(const l of plan.lines)gOf[l.id]=l.g;

  const ytd=r=>r.slice(0,nowM+1).reduce((x,o)=>x+o,0);
  const curNet=cur.rows.map(r=>r.inc-r.out),prevNet=prev.rows.map(r=>r.inc-r.out);
  const card=(title,total,cmp,good,chart)=>`<section class="card"><div class="card-h"><b>${title}</b></div><div class="mu xs">Jan 1 – ${y===new Date().getFullYear()?shortDate(new Date()):'Dec 31'}, ${y}</div><div class="dc-head left"><span class="big ${good==='bad'?'bad':good==='good'?'good':''}">${fmt.format(total)}</span><span class="mu xs">${cmp}</span></div>${chart}</section>`;
  const bars=(vals,prevVals,{stackData,color}={})=>{const all=[...vals,...prevVals,0],hi=Math.max(...all,1),lo=Math.min(...all,0),H=150,Wd=600,bw=Wd/12,Y=v=>8+(hi-v)/(hi-lo||1)*(H-26),z=Y(0);
    let g=`<line x1="0" x2="${Wd}" y1="${z}" y2="${z}" class="axis"/>`;
    vals.forEach((v,i)=>{if(i>nowM)return;const x=i*bw+bw*.3,w=bw*.4;
      if(stackData){let base=0;const order=Object.entries(stackData[i]).sort((a,b)=>b[1]-a[1]);for(const [k,amt] of order){const G=plan.groups.find(x=>x.name===k),y1=Y(base+amt),y0=Y(base);g+=`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1,y0-y1-1)}" rx="2" fill="${(G&&G.color)||'#8e8e93'}"><title>${MONTHS[i]} · ${esc(k)}: ${fmt0.format(amt)}</title></rect>`;base+=amt}}
      else{const top=Math.min(Y(v),z),h=Math.max(2,Math.abs(Y(v)-z));g+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${color||(v>=0?'var(--chart-up)':'var(--chart-down)')}"><title>${MONTHS[i]}: ${fmt0.format(v)}</title></rect>`}});
    g+=`<polyline points="${prevVals.map((v,i)=>`${(i*bw+bw/2).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" class="prevline"/>`;

  const cmp=(a,b,goodUp)=>`${pctChip(b,a,{good:goodUp?'up':'down'})} vs ${fmt0.format(b)} last year`;
  const nc=ytd(curNet),np=ytd(prevNet),so=ytd(cur.rows.map(r=>r.out)),sp=ytd(prev.rows.map(r=>r.out)),ic=ytd(cur.rows.map(r=>r.inc)),ip=ytd(prev.rows.map(r=>r.inc));

// what's left before a step can be marked done
function stepToGo(i){const s=stepInfo();
  if(i===0)return `${fmt0.format(Math.max(0,1000-s.ef))} more to save`;
  if(i===1)return `${fmt0.format(s.debtTotal)} of debt left`;
  if(i===2)return `${fmt0.format(Math.max(0,s.efTarget-s.ef))} more to save`;
  if(i===3)return `${fmt0.format(Math.max(0,s.retireTarget-num(plan.retire.monthly)))}/mo more to invest`;
  if(i===4)return 'Choose a college plan, or skip it';
  if(i===5)return `${fmt0.format(mortBalance())} left on the house`;
  return ''}
function stepInfo(){
  const ef=num(plan.ef.balance),debtTotal=plan.debts.reduce((s,d)=>s+Math.max(0,num(d.balance)),0);
  const monthlyExp=totalPlanned()-lineAmt(fundLine());
  const efTarget=monthlyExp*plan.ef.months,retireTarget=plan.grossAnnual*0.15/12;
  const met=[ef>=1000,debtTotal<=0,ef>=efTarget&&efTarget>0,num(plan.retire.monthly)>=retireTarget-0.5,
    plan.college.status==='skip'||num(plan.college.monthly)>0,mortBalance()<=0,false];
  // a step only counts as done once you mark it done, so nothing gets skipped
  const done=met.map((_,i)=>i<6&&!!(plan.stepsDone||[])[i]);
  let current=done.slice(0,3).findIndex(x=>!x);
  let parallel=false;
  if(current===-1){const i=[3,4,5].find(i=>!done[i]);if(i!==undefined){current=i;parallel=true}else current=6}
  return {ef,debtTotal,monthlyExp,efTarget,retireTarget,met,done,current,parallel};
}
// What the Baby Step fund is paying for right now, in plain words
function stepGoal(){
  const s=stepInfo();
  if(s.current===0)return 'your $1,000 starter emergency fund';
  if(s.current===1){const next=plan.debts.filter(d=>num(d.balance)>0).sort((a,b)=>num(a.balance)-num(b.balance))[0];return next?`paying off ${next.name}`:'paying off your debts'}
  if(s.current===2)return 'your full emergency fund';
  if(s.parallel){if(!s.done[3])return 'investing for retirement';if(!s.done[4])return 'college savings';return 'paying off your home early'}
  return 'building wealth and giving';
}

function fundName(){

  if(s.current===0)return 'Starter emergency fund';
  if(s.current===1)return 'Debt snowball';

}

/* Your paycheck: one rounded bar showing how each month's take-home divides up, shaped like the income card beside it */
// whole-number percentages that always add up to 100 (largest remainder); a sliver shows as "<1"
function sharePcts(vals,total){
  if(!total)return vals.map(()=>0);
  const raw=vals.map(v=>v/total*100),fl=raw.map(Math.floor),target=Math.round(raw.reduce((a,b)=>a+b,0));
  let left=target-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){fl[i]++;left--}});
  return fl.map((p,i)=>p===0&&vals[i]>0?'<1':p);
}

const PAY_DAYS=()=>[...Array.from({length:28},(_,i)=>[String(i+1),`the ${ordinal(i+1)}`]),['1,15','the 1st and 15th'],['5,20','the 5th and 20th'],['15,31','the 15th and last day']];

    days.forEach((d,i)=>out.push({key:`${s.id}:${i}`,id:s.id,name:s.name,day:d,amt:num(s.amt)/days.length,days:String(s.days||'1')}))}

/* ---------- Yearly overview ---------- */
let curYear=new Date().getFullYear();
function yearData(y){
  const now=new Date(),thisY=now.getFullYear();
  const lastM=y<thisY?12:y>thisY?0:now.getMonth()+1;
  const plannedSpend=totalPlanned()-lineAmt(fundLine());
  const rows=[],byLine={};let inc=0,out=0;
  for(let m=1;m<=12;m++){
    const ym=`${y}-${pad(m)}`,tx=(months[ym]&&months[ym].tx)||[];
    let mi=0,mo=0;
    for(const t of tx){const a=num(t.amount);if(t.kind==='income')mi+=a;else{mo+=a;byLine[t.cat]=(byLine[t.cat]||0)+a}}
    inc+=mi;out+=mo;
    rows.push({m,ym,inc:mi,out:mo,has:tx.length>0});
  }
  // count from the first month with anything recorded, so a late start isn't held to a full year of plan
  const first=(rows.find(r=>r.has)||{m:lastM}).m,elapsed=lastM>=first?lastM-first+1:0;
  rows.forEach(r=>{r.past=r.m>=first&&r.m<=lastM});
  return {rows,byLine,inc,out,net:inc-out,elapsed,plannedSpend};
}

  for(let v=0;v<=top+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-10}" y="${yy(v)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)">${fmt0.format(v)}</text>`}

    g+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="${cur?'var(--ink)':'var(--muted)'}" font-weight="${cur?600:400}">${MONTHS[i].slice(0,3)}</text>`;
  });
  if(d.plannedSpend>0){const py=yy(d.plannedSpend);g+=`<line x1="${L}" x2="${W-R}" y1="${py}" y2="${py}" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="5 5"/><text x="${W-R}" y="${py-7}" text-anchor="end" font-size="11.5" fill="var(--muted)">Planned ${fmt0.format(d.plannedSpend)}/mo</text>`}

    return `<div class="bud"><div class="bud-top"><span>${esc(l.name)}</span><span class="amt"><b>${fmt0.format(spent)}</b> / ${fmt0.format(planned)}</span></div><div class="bar ${cls}"><span style="width:${Math.min(pct,1)*100}%"></span></div></div>`}).join('');
  const table=active.map(r=>{const net=r.inc-r.out;return `<tr${r.ym===nowYM?' class="cur"':''}><td>${MONTHS[r.m-1]}</td><td class="num good">${r.inc?fmt0.format(r.inc):'—'}</td><td class="num">${r.out?fmt0.format(r.out):'—'}</td><td class="num ${net<0?'bad':''}">${r.has?fmt0.format(net):'—'}</td><td class="num ${r.out>d.plannedSpend?'bad':''}">${r.ym===nowYM&&r.out<=d.plannedSpend?'In progress':r.has?(r.out<=d.plannedSpend?'Under by ':'Over by ')+fmt0.format(Math.abs(d.plannedSpend-r.out)):'—'}</td></tr>`}).join('');

function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

/* ---------- Debt-free countdown ---------- */
function debtCountdown(){
  const active=plan.debts.filter(d=>num(d.balance)>0);
  if(!active.length)return '';
  const fund=lineAmt(fundLine()),sb=snowball(fund);
  const start=plan.debts.reduce((x,d)=>x+Math.max(num(d.start),num(d.balance)),0),owed=active.reduce((x,d)=>x+num(d.balance),0),paid=Math.max(0,start-owed);
  if(sb.stuck)return `<section class="panel countdown"><h2>Your debts aren’t shrinking yet</h2><p class="sub">The payments don’t cover the interest. Raise the Baby Step fund or the minimums in your plan.</p></section>`;
  const order=active.slice().sort((a,b)=>(sb.payoff[a.id]||0)-(sb.payoff[b.id]||0)),total=sb.months;
  // One rounded bar per debt, from today to its payoff month. The debt the snowball is on now is the blue one.
  const W=1000,L=170,R=96,T=8,rowH=44,H=T+order.length*rowH+30,x=m=>L+(W-L-R)*m/Math.max(1,total);
  let g='';

  for(let m=1;m<=total;m++){const d=new Date(n0.getFullYear(),n0.getMonth()+m,1);if(d.getMonth()===0){
    if(x(m)-x(0)<70)continue; // too close to the "Today" label
    g+=`<line x1="${x(m)}" x2="${x(m)}" y1="${T}" y2="${H-26}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>`;
    g+=`<text x="${x(m)}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${d.getFullYear()}</text>`}}
  g+=`<text x="${x(0)}" y="${H-10}" text-anchor="start" font-size="11.5" fill="var(--muted)">Today</text>`;
  order.forEach((d,i)=>{
    const y=T+i*rowH+8,end=sb.payoff[d.id]||total,cur=i===0;
    g+=`<text x="0" y="${y+11}" font-size="13" fill="var(--ink)" font-weight="${cur?600:400}">${esc(d.name.length>18?d.name.slice(0,17)+'…':d.name)}</text>`;
    g+=`<text x="0" y="${y+26}" font-size="11.5" fill="var(--muted)">${fmt0.format(num(d.balance))} left</text>`;
    g+=`<rect x="${x(0)}" y="${y}" width="${Math.max(6,x(end)-x(0))}" height="20" rx="6" fill="${cur?'var(--accent-soft)':'var(--track)'}" stroke="${cur?'var(--accent)':'var(--warm)'}" stroke-width="${cur?2:1.25}"/>`;
    g+=`<text x="${x(end)+8}" y="${y+14}" font-size="11.5" fill="${cur?'var(--accent)':'var(--muted)'}">${monthsFromNow(end)}</text>`;
  });
  return `<section class="panel countdown" aria-label="Debt-free countdown">
    <h2>Debt-free by ${monthsFromNow(total)}</h2>
    <div class="cd-row"><div class="cd-big">${total}<small>months</small></div>
      <div class="field" style="flex:1;min-width:220px"><span class="sub">${fmt0.format(paid)} paid off of ${fmt0.format(start)}</span><div class="bar done" style="height:10px"><span style="width:${start?paid/start*100:0}%"></span></div>
      <span class="sub">The snowball is on <b>${esc(order[0].name)}</b> now: ${fmt0.format(debtMins())} in minimums plus ${fmt0.format(fund)} extra each month.</span></div></div>
    <div class="timeline"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payoff timeline: ${order.map(d=>esc(d.name)+' paid off '+monthsFromNow(sb.payoff[d.id]||total)).join(', ')}">${g}</svg></div>
  </section>`;
}

    ${s.parallel?'<p class="sub" style="margin-top:12px">Steps 4, 5 and 6 run at the same time. Step 7 unlocks when all three are done.</p>':''}`;
}

// a bill shows as paid when you tick it, or when a transaction on its budget line for about the same amount lands that month
function billPaid(b,ym){
  const m=months[ym]||{};if(m.paid&&m.paid[b.id])return true;
  if(!b.line)return false;const a=num(b.amount),tol=Math.max(5,a*.15);
  return (m.tx||[]).some(t=>t.kind!=='income'&&t.cat===b.line&&Math.abs(num(t.amount)-a)<=tol);
}
// the calendar date a bill is due inside a budget month
function billDue(b,ym){
  const [a,e]=periodRange(ym),day=Math.min(28,Math.max(1,Math.round(num(b.day))||1));
  for(let d=new Date(a);d<=e;d.setDate(d.getDate()+1))if(d.getDate()===day||(day>28&&d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))return new Date(d);
  return new Date(a);
}
const daysUntil=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(new Date().setHours(0,0,0,0)))/864e5);
function billState(b,ym){
  if(billPaid(b,ym))return {k:'paid',t:'Paid'};
  const n=daysUntil(billDue(b,ym));
  if(n<0)return {k:'late',t:`${-n} day${n===-1?'':'s'} late`};
  if(n===0)return {k:'soon',t:'Due today'};
  if(n<=7)return {k:'soon',t:`Due in ${n} day${n===1?'':'s'}`};
  return {k:'later',t:`Due ${shortDate(billDue(b,ym))}`};
}
function nextWeekBills(){
  const now=thisPeriod(),next=(()=>{const [y,m]=now.split('-').map(Number),d=new Date(y,m,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`})();
  let sum=0;for(const b of plan.bills)for(const ym of [now,next]){const n=daysUntil(billDue(b,ym));if(n>=0&&n<=7&&!billPaid(b,ym))sum+=num(b.amount)}
  return sum;
}

function netWorth(){
  const home=homeValue(),ef=num(plan.ef.balance),jars=(plan.jars||[]).reduce((x,j)=>x+num(j.balance),0),ret=num(plan.nw.retirement),college=num(plan.college&&plan.college.saved);
  const accts=plan.nw.accounts.reduce((x,a)=>x+num(a.amount),0),own=home+ef+jars+ret+college+accts;
  const mort=mortBalance(),debts=plan.debts.reduce((x,d)=>x+Math.max(0,num(d.balance)),0);
  let uAssets=0,uLiab=0;for(const a of (Array.isArray(plan.accounts)?plan.accounts:[])){const b=acctBalance(a);if(isLiab(a))uLiab+=b;else uAssets+=b}
  const owe=mort+debts+uLiab,own2=own+uAssets;
  return {home,ef,jars,ret,college,accts,own:own2,mort,debts,owe,uAssets,uLiab,net:own2-owe,equity:home-mort};
}

const prevPeriod=ym=>{const [y,m]=ym.split('-').map(Number),d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function reviewFacts(ym){
  const tx=(months[ym]?.tx)||[];let inc=0,spent=0;const by={};
  for(const t of tx){const a=num(t.amount);if(t.kind==='income')inc+=a;else{spent+=a;by[t.cat]=(by[t.cat]||0)+a}}
  const planned=totalPlanned()-lineAmt(fundLine());
  const lines=plan.lines.filter(l=>l.id!=='bsfund').map(l=>({n:l.name,d:(by[l.id]||0)-lineAmt(l)}));
  const over=lines.filter(x=>x.d>1).sort((a,b)=>b.d-a.d).slice(0,2),under=lines.filter(x=>x.d<-1&&(by[plan.lines.find(l=>l.name===x.n)?.id]||0)>0).sort((a,b)=>a.d-b.d).slice(0,2);
  return {ym,name:MONTHS[+ym.slice(5)-1],inc,spent,planned,under:planned-spent,over,under2:under,count:tx.length};
}
function reviewTemplate(f){
  const parts=[`In ${f.name} you spent ${fmt0.format(f.spent)} of the ${fmt0.format(f.planned)} you planned, ${f.under>=0?`coming in ${fmt0.format(f.under)} under`:`running ${fmt0.format(-f.under)} over`}.`];
  if(f.over.length)parts.push(`${f.over.map(o=>`${o.n} ran ${fmt0.format(o.d)} over`).join(' and ')}.`);
  if(f.under2.length)parts.push(`${f.under2.map(o=>`${o.n} came in ${fmt0.format(-o.d)} under`).join(' and ')}.`);
  return parts.join(' ');
}
let reviewAsked={};
function fetchReview(f){
  if(reviewAsked[f.ym]||months[f.ym]?.reviewText)return;reviewAsked[f.ym]=true;
  const s=stepInfo();
  const prompt=`Month: ${f.name}. Money in: ${fmt0.format(f.inc)}. Spent: ${fmt0.format(f.spent)} of ${fmt0.format(f.planned)} planned (${f.under>=0?fmt0.format(f.under)+' under':fmt0.format(-f.under)+' over'}). Over budget: ${f.over.map(o=>o.n+' by '+fmt0.format(o.d)).join(', ')||'none'}. Under budget: ${f.under2.map(o=>o.n+' by '+fmt0.format(-o.d)).join(', ')||'none'}. They are on Baby Step ${s.current+1}: ${STEP_SHORT[s.current]}. Write the summary.`;
  const done=txt=>{txt=String(txt||'').trim();if(!txt)return;months[f.ym]=months[f.ym]||{tx:[]};months[f.ym].reviewText=txt;saveMonth(f.ym);const el=$('review-text');if(el){el.textContent=txt;el.classList.add('ai')}};
  if(Store.mode==='native'&&Store.caps&&Store.caps.ai)Store.native.postMessage({op:'summarize',prompt}).then(done).catch(()=>{});
  else if(sampler)sampler.json(prompt+'\nReply with only a JSON object: {"summary": "2 or 3 warm, plain sentences using only these numbers"}').then(r=>done(r&&r.summary)).catch(()=>{});
}

const ordinal=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');

function exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`,rows=[['Date','Description','Budget line','Type','Amount','Who'].map(q).join(',')];
  for(const [,m] of Object.entries(months).sort())for(const t of (m.tx||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)))rows.push([t.date,t.desc||'',lineName(t.cat),t.kind==='income'?'Income':'Expense',num(t.amount).toFixed(2),t.who?personName(t.who):'Shared'].map(q).join(','));
  return rows.join('\n');
}

function applyInput(el){
  const k=el.dataset.k,v=el.tagName==='SELECT'?el.value:el.value;
  if(k.startsWith('line:')){const l=plan.lines.find(x=>x.id===k.slice(5));if(l)l.amt=Math.max(0,r2(num(v)))}
  else if(k.startsWith('debt:')){const [,id,f]=k.split(':');const d=plan.debts.find(x=>x.id===id);if(d){const before=num(d.balance);d[f]=f==='name'?v.slice(0,50):Math.max(0,num(v));delete d.example;if(f==='balance'&&(d.start==null||d.balance>d.start))d.start=d.balance;
    if(f==='balance'&&before>0&&num(d.balance)<=0)setTimeout(()=>debtCelebration(d),200)}}
  else if(k.startsWith('bill:')){const [,id,f]=k.split(':');const b=plan.bills.find(x=>x.id===id);if(b){b[f]=f==='name'?v.slice(0,40):f==='day'?Math.min(31,Math.max(1,Math.round(num(v))||1)):Math.max(0,r2(num(v)))}scheduleReminders()}
  else if(k.startsWith('nw:')){plan.nw[k.slice(3)]=Math.max(0,r2(num(v)))}
  else if(k.startsWith('inc:')){const [,id,f]=k.split(':');const s=(plan.incomes||[]).find(x=>x.id===id);if(s){s[f]=f==='name'?v.slice(0,40):Math.max(0,r2(num(v)))}syncIncome()}
  else if(k.startsWith('acct:')){const [,id,f]=k.split(':');const a=plan.nw.accounts.find(x=>x.id===id);if(a)a[f]=f==='name'?v.slice(0,40):r2(num(v))}
  else if(k.startsWith('jar:')){const [,id,f]=k.split(':');const j=plan.jars.find(x=>x.id===id);if(j){
    if(f==='line'){
      if(v==='__new'){const left=Math.max(0,num(j.target)-num(j.balance)),need=j.due?Math.ceil(left/monthsUntil(j.due)):0;j.line=addJarLine(j.name,num(j.monthly)||need)}
      else{if(!v&&j.line){const l=jarLine(j);if(l)j.monthly=num(l.amt)}j.line=v}
    }else{const wasFull=num(j.target)>0&&num(j.balance)>=num(j.target);j[f]=f==='name'?v.slice(0,50):f==='due'?v:Math.max(0,r2(num(v)));
      if(!wasFull&&num(j.target)>0&&num(j.balance)>=num(j.target))setTimeout(()=>celebrate(`${j.name} is full`,`${fmt0.format(num(j.target))} saved. When the bill comes, the money’s already there.`),200)}
    delete j.example}}
  else if(k==='college.status')plan.college.status=v;
  else if(k==='mortgage.start'){const t=String(v).trim();if(/^\d{4}-\d{1,2}$/.test(t)){const [y,mm]=t.split('-');plan.mortgage.start=`${y}-${pad(+mm)}`}}
  else{const path=k.split('.');let o=plan;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path.at(-1)]=Math.max(0,num(v))}
}
// Number boxes empty when you click in (the old number shows as a gray hint) and put it back if you leave without typing
document.addEventListener('focusin',e=>{
  const el=e.target;if(!el.classList||!el.classList.contains('money')||el.value==='')return;
  el.dataset.prev=el.value;el.dataset.ph=el.placeholder||'';el.placeholder=el.value;el.value='';
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(!el.classList||!el.classList.contains('money')||el.dataset.prev==null)return;
  if(el.value.trim()==='')el.value=el.dataset.prev;
  el.placeholder=el.dataset.ph||'';delete el.dataset.prev;delete el.dataset.ph;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.classList&&el.classList.contains('money')&&el.value.trim()===''&&el.dataset.prev!=null){el.value=el.dataset.prev;return}
  if(el.id==='nj-line'){newJarFill=el.value;$('nj-hint').textContent=el.value==='__new'?'Adds a matching line to the Saving group of your budget, so the money is planned every month.':el.value?'Fills from that budget line’s monthly amount.':'Saves its own monthly amount, counted in your Savings jars budget line.';return}
  if(el.dataset&&el.dataset.pickday!=null&&billPick){billPick[+el.dataset.pickday].day=Math.min(31,Math.max(1,Math.round(num(el.value))||1));return}
  if(el.id==='tx-search'){return}
  if(el.dataset&&el.dataset.devsel){device[el.dataset.devsel]=el.value;saveDevice();toast(el.value==='month'?'Opens to This month':el.value==='home'?'Opens to Home':'Opens where you left off');return}
  if(el.dataset&&el.dataset.set){const k=el.dataset.set;
    if(k==='nameA'||k==='nameB'){plan.people[k==='nameA'?'a':'b']=el.value.trim().slice(0,20)||(k==='nameA'?'You':'Spouse')}
    else if(k==='startDay'){plan.settings.startDay=num(el.value);curMonth=thisPeriod()}
    else if(k==='remindDays'){plan.settings.remindDays=num(el.value)}
    savePlan(0);scheduleReminders();render();savedToast(el);return}
  if(!el.dataset||!el.dataset.k)return;
  applyInput(el);savePlan();setTimeout(rerenderKeepFocus,0);savedToast(el);
});
// every edit gets the little confirmation under the bar: "Saved · Electric $185.00"
function savedToast(el){
  const row=el.closest('.pline,.drow,.bill2,.inc-row,.field,.set-row,.fund-row,.jar');
  let name=(el.labels&&el.labels[0]&&el.labels[0].textContent)||el.getAttribute('aria-label')||(row&&(row.querySelector('label,.nm span,b,h3')||{}).textContent)||'';
  name=name.replace(/\s+/g,' ').trim().replace(/ value$/,'');
  if(el.tagName==='INPUT'&&!el.classList.contains('money')&&el.type!=='date'){toast(`Saved · ${el.value.trim()||name}`);return}
  const v=el.tagName==='SELECT'?(el.options[el.selectedIndex]||{}).text:el.classList.contains('money')&&/amount|amt|balance|take|gross|extra|payment|price|fund|monthly|insurance|\$|value|target|minimum|line:/i.test((el.dataset.k||'')+name)?fmt.format(num(el.value)):el.value;
  toast(`Saved · ${name}${name&&v?' ':''}${v||''}`.trim());
}
// buttons that change something: a note that says what happened (unless the action already said so itself)
function actionNote(t){
  const d=t.dataset,c=t.classList.contains('confirm');
  if(d.del&&c)return 'Transaction deleted';
  if(d.delline)return 'Line removed';
  if(d.delgroup&&c)return 'Category removed';
  if(d.delbill&&c)return 'Bill removed';
  if(d.delacct&&c)return 'Account removed';
  if(d.deljar&&c)return 'Jar removed';
  if(d.delinc&&c)return 'Income removed';
  if(d.deldebt)return 'Debt removed';
  if(d.paid)return t.getAttribute('aria-pressed')==='true'?'Marked not paid':'Marked paid';
  if(d.stepdone)return `Step ${+d.stepdone+1} marked done`;
  if(d.stepundo)return `Step ${+d.stepundo+1} reopened`;
  if(d.jaradd)return 'Added this month’s amount to the jar';
  if(d.jarundo)return 'Took this month’s amount back out';
  if(d.assignrest!=null||t.id==='assign-rest')return 'Assigned to your Baby Step';
  if(d.addinc!=null)return 'Income added';
  if(d.set||d.pref)return 'Setting saved';
  if(t.id==='add-debt')return 'Debt added';
  if(t.id==='gi-add'&&($('gi-name')||{}).value)return `Added ${($('gi-name')||{}).value.trim()}`;
  if(t.id==='ng-add'&&($('ng-name')||{}).value)return `Added the ${($('ng-name')||{}).value.trim()} category`;
  if(t.id==='clear-examples')return 'Examples cleared';
  if(d.showempty!=null||t.classList.contains('showempty'))return '';
  return '';
}
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('button');if(!t)return;const msg=actionNote(t);if(!msg)return;
  const before=toast.n||0;setTimeout(()=>{if((toast.n||0)===before)toast(msg)},0);
},true);
// on the Mac the bar's empty space moves the window like a title bar; the app needs to know where the buttons are
function sendBarRects(late){
  if(Store.mode!=='native')return;
  const nav=$('globalnav'),rects=[...nav.querySelectorAll('button,a,.gw,input,select,[role="tab"]')].map(el=>el.getBoundingClientRect()).filter(r=>r.width&&r.height).map(r=>[r.left,r.top,r.width,r.height]);
  Store.native.postMessage({op:'barRects',h:nav.getBoundingClientRect().bottom,rects}).catch(()=>{});
  // again once the bar's animations have settled
  if(!late){clearTimeout(sendBarRects.t);sendBarRects.t=setTimeout(()=>sendBarRects(true),650)}
}

    for(const [ym,m] of Object.entries(months)){if((m.tx||[]).some(x=>x.example)){m.tx=m.tx.filter(x=>!x.example);saveMonth(ym)}}
    render();return}
  if(pendingDelete&&!(t&&(t.dataset.del||t.dataset.deljar||t.dataset.delgroup||t.dataset.delbill||t.dataset.delacct||t.dataset.delpay))){pendingDelete=null;render()}
});

/* ================= boot ================= */
function migrate(p){
  const d=defaultPlan();
  const out={...d,...p,mortgage:{...d.mortgage,...(p.mortgage||{})},ef:{...d.ef,...(p.ef||{})},retire:{...d.retire,...(p.retire||{})},college:{...d.college,...(p.college||{})}};
  if(!Array.isArray(p.lines))out.lines=d.lines;
  if(!Array.isArray(p.debts))out.debts=d.debts;
  if(!Array.isArray(p.jars))out.jars=defaultJars();
  if(!out.lines.some(l=>l.id==='jars')){const i=out.lines.findIndex(l=>l.id==='bsfund');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='jars'))}
  for(const db of out.debts)if(db.start==null||num(db.balance)>num(db.start))db.start=num(db.balance);
  if(!Array.isArray(p.stepsDone))out.stepsDone=[num(out.ef.balance)>=1000];
  if(!p.mortV2){
    out.mortV2=true;
    if(out.mortgage.home==null)out.mortgage.home=(out.nw&&out.nw.homeValue!=null)?out.nw.homeValue:out.mortgage.price;
    if(out.mortgageBalance!=null&&num(out.mortgageBalance)<=0)out.mortgageBalance=null;
    if(out.mortgageBalance!=null&&!out.mortgageAsOf)out.mortgageAsOf=todayISO().slice(0,7);
  }
  if(!Array.isArray(out.mortgagePayments))out.mortgagePayments=[];
  if(!out.mortgage.start)out.mortgage.start=out.mortgageAsOf||todayISO().slice(0,7);
  if(!out.lines.some(l=>l.id==='mortextra')){const i=out.lines.findIndex(l=>l.id==='house');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='mortextra'))}
  out.settings={...d.settings,...(p.settings||{})};out.people={...d.people,...(p.people||{})};
  out.nw={...d.nw,...(p.nw||{})};if(!Array.isArray(out.nw.accounts))out.nw.accounts=[];
  if(!Array.isArray(out.bills))out.bills=[];if(!out.nwHistory||typeof out.nwHistory!=='object')out.nwHistory={};
  // older plans carried notes tied to one city; swap those for the general ones
  const fresh=Object.fromEntries(defaultLines().map(l=>[l.id,l.note]));
  for(const l of out.lines)if(l.note&&/Duke|Piedmont|Greenville|ReWa|Upstate|\bSC\b/.test(l.note)&&l.id in fresh)l.note=fresh[l.id];
  out.groups=p.groups;normalizeGroups(out);
  return out;
}
async function boot(){
  applyAppearance();
  try{await Store.init();
    if(Store.mode==='native'){try{await Store.load()}catch(e){}}
    if(Store.mode==='native'){try{scanReady=!!(await Store.native.postMessage({op:'canScan'}))}catch(e){scanReady=false}}
    else{try{sampler=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampler=null}scanReady=!!sampler}const d=await Store.load();months=d.months||{};
    if(d.plan){plan=migrate(d.plan);if(colorsAdded)savePlan(0)}
    else{plan=defaultPlan();const ym=todayISO().slice(0,7);months[ym]={tx:exampleTx(ym)};savePlan(0);saveMonth(ym)}
    cleanOldPayments();
    if(Store.mode==='native'){try{Store.caps=await Store.native.postMessage({op:'capabilities'})||{}}catch(e){Store.caps={}}}
    await Cloud.init();
    if(Cloud.on){try{if(Cloud.wasLinked)await startSync(false);else{const d=await Cloud.loadAll();if(d.plan&&!sameBudget(d))Cloud.choice=d;else if(d.plan)Cloud.subscribe();else{await Cloud.uploadAll();Cloud.subscribe()}}}catch(e){showError('Couldn’t reach your shared budget, so this shows the copy saved on this device.')}}
  }catch(e){
    Store.mode='local';const d=await Store.load();months=d.months||{};plan=d.plan?migrate(d.plan):defaultPlan();
    showError('Couldn’t reach your saved budget, so this session saves in this browser only.');
  }
  curMonth=thisPeriod();lastPeriod=curMonth;
  scheduleReminders();
  dropLeftovers();
  runRecurring();
  // the Windows app's jump list (right-click the app): Add a purchase, Bills, Money date
  const qp=new URLSearchParams(location.search);
  if(qp.get('tab')&&['home','tx','cats','plan','cash','accounts','bills','steps'].includes(qp.get('tab')))tab=qp.get('tab');
  if(qp.get('do')==='add')tab='tx';
  render(true);
  if(qp.get('do')==='add')setTimeout(openSheet,300);
  if(qp.get('do')==='md')setTimeout(openMD,300);
  if(canPush()&&device.pushOn)pushReg().catch(()=>{});
  maybeWelcome();
  // arriving from the confirmation email: say so plainly
  if(/type=signup|type=email/.test(location.hash)){history.replaceState(null,'',location.pathname);cloudMsg='✓ Email confirmed. You can sign in now (on the Mac app, click Sign in).';try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,600)}
  if(Cloud.choice)setTimeout(openCloud,700);
  // the first time on a device that can share, offer to sign in
  if(Cloud.ready&&!Cloud.on){let seen=false;try{seen=localStorage.getItem(LS+'-cloud-offered')}catch(e){}if(!seen){try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,900)}}
}
boot();
// the Windows app (the website): if a newer version has been published, switch to it right away instead of waiting on the browser's cache
function checkForUpdate(){const cur=document.querySelector('meta[name="wfb-build"]');if(!cur||!/^https?:/.test(location.protocol))return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/name="wfb-build" content="(\d+)"/);
    if(m&&m[1]!==cur.content&&!sessionStorage.getItem('wfb-upd-'+m[1])){sessionStorage.setItem('wfb-upd-'+m[1],'1');location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
checkForUpdate();
let lastPeriod=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden||!plan)return;checkForUpdate();
  const now=thisPeriod();lastPeriod=lastPeriod||now;
  if(now!==lastPeriod){if(curMonth===lastPeriod)curMonth=now;lastPeriod=now;runRecurring();render()}});
</script>
