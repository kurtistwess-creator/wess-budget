<meta charset="utf-8">
<title>Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--warm:#a39a91;--brand:"Didot","Bodoni 72","Playfair Display",Georgia,serif;--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--baby:#A9BEC6;--warm:#7d756d;color-scheme:dark}
}
:root[data-theme="dark"]{--baby:#A9BEC6;--warm:#7d756d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
.app{max-width:1120px;margin:0 auto;display:grid}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-family:var(--brand);font-size:31px;font-weight:700;letter-spacing:.005em}
h3{font-family:var(--body)}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.brand{display:flex;align-items:center}
.mark{width:40px;height:40px;flex:none;display:block}
.badge{font-size:12px;color:var(--muted);border-radius:999px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{font-weight:600}
.iconbtn{display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.textbtn:hover{border-color:var(--accent)}
.textbtn.primary{border-color:var(--accent)}
.textbtn:disabled{cursor:default}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.notice.err{border-color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);display:grid;min-width:0;align-content:start}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{color:var(--muted)}
.stat.key .v{font-family:var(--display);font-weight:700}
.good{color:var(--good)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}
.muted{color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted)}
.monthnav{display:flex;align-items:center}
.monthnav .label{font-family:var(--display);min-width:9em;text-align:center}
.group{display:grid;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:12px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group-head .mono{font-size:13px;color:var(--muted)}
.bud{display:grid;gap:4px}
.bud-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bud-top .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.bud-top .amt b{color:var(--ink);font-weight:500}
.bar{border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px}
.bar.prog span{background:var(--accent)}
.bar.warn span{background:var(--warn)}
form{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;font-weight:500;font-size:14px;cursor:pointer;color:var(--muted)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input:not([type]),select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.formmsg{font-size:13px;min-height:1.2em;color:var(--muted)}
.formmsg.err{color:var(--bad)}
.entries{list-style:none;margin:0;padding:0;display:grid}
.entry{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.entry .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .cat{font-size:12px;color:var(--muted)}
.entry .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.del:hover{border-color:var(--line)}
.del.confirm{border-color:var(--bad)}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
.assign{display:flex;flex-wrap:wrap;gap:18px;align-items:end;justify-content:space-between}
.assign .big{font-variant-numeric:tabular-nums}
.pline{display:grid;gap:10px;align-items:center;padding:6px 0}
.pline .nm{min-width:0}
.pline .note{font-size:12px;color:var(--muted)}
.pline .linked{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:10px;font-size:14px}
.checks{display:grid;margin:0;padding:0;list-style:none;font-size:14px}
.checks li{display:grid}
.checks .ic{font-weight:700}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:6px;column-gap:0;font-size:14px}
.kv>span:nth-child(odd){padding-right:12px}
.kv .mono{text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.step .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;border:1.5px solid var(--line);color:var(--muted)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.current .n{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step-body{display:grid;gap:10px;min-width:0}
.step-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chip{font-size:12px;font-weight:600;border-radius:999px;color:var(--muted);white-space:nowrap}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.current{border-color:var(--accent);color:var(--accent)}
.debts{display:grid;gap:6px;overflow-x:auto}
.drow{display:grid;gap:8px;align-items:center;min-width:560px}
.drow.head{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drow .pay{font-size:13px;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.jar{border:1px solid var(--line);border-radius:12px;align-content:start;min-width:0}

/* no logo in the corner; the account button wears the logo, in a circle */
.gn-logo,.native .gn-logo{display:none!important}

:root[data-theme="dark"] .gn-me{background:none!important}
/* the account button: hover and the ship sails up out of its circle, bobbing straight on rolling waves */
html body .gn-me{position:relative;overflow:visible!important;box-shadow:none!important;z-index:5}
.me-tile{position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,#1C2E45,#0B1622);box-shadow:0 0 0 1px var(--card-line);transition:box-shadow .4s ease}
.me-sea{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.me-clip{position:absolute;inset:0;clip-path:inset(0 round 50%);transition:clip-path .55s var(--spring)}
.me-ship{position:absolute;left:50%;bottom:22%;height:66%;transform:translateX(-50%);transform-origin:50% 100%;transition:transform .6s var(--spring),filter .4s ease}
html body .gn-me .me-waves{position:absolute;left:0;top:auto;bottom:16%;width:200%;height:14%;max-width:none;margin:0;overflow:visible;color:#A9BEC6}
.gn-me .me-waves path{fill:none;stroke:#A9BEC6;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.me-ship{z-index:1}
.gn-me:hover .me-clip,.gn-me:focus-visible .me-clip{clip-path:inset(-140% -60% 0 -60% round 0 0 16px 16px)}
.gn-me:hover .me-ship,.gn-me:focus-visible .me-ship{transform:translateX(-50%) translateY(-4%) scale(1.5);filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));animation:me-bob 2.4s ease-in-out .55s infinite}
.gn-me:hover .me-waves,.gn-me:focus-visible .me-waves{animation:me-roll 1.8s linear infinite}
.gn-me:hover .me-tile{box-shadow:0 0 0 1px var(--card-line),0 6px 16px -6px rgba(9,19,44,.6)}
@keyframes me-bob{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
@keyframes me-roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.gn-me:hover .me-ship,.gn-me:hover .me-waves{animation:none}}
html.reduce-motion .gn-me:hover .me-ship,html.reduce-motion .gn-me:hover .me-waves{animation:none}
html body .gn-me,html body .gn-me:hover,html body .gn-me:active{transform:none!important;rotate:none!important}

/* ===================== Helm · Copilot-style layout ===================== */
:root{--side-w:236px;--chart-up:#1b9e46;--chart-down:#d70015}

.card-a{all:unset;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);transition:color .2s}

.cnt{font-style:normal;font-size:11px;font-weight:700;background:var(--t-blue);color:var(--t-blue-ink);border-radius:999px;padding:2px 8px}
.big{font:700 24px/1.15 var(--display);letter-spacing:-.02em;color:var(--ink)}
.big.xs{font-size:19px}.big.bad,.bad{color:var(--bad)}.good{color:var(--good)}
.mu{color:var(--muted)}.xs{font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0;margin:0}
/* the dashboard */
.dgrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:10px}
.dgrid .tall{grid-row:span 3}
.dc-head{display:flex;flex-direction:column;align-items:center;gap:3px;margin:2px 0 8px;text-align:center}

.dc{position:relative;height:132px}.dc svg{width:100%;height:100%;overflow:visible}
.dc-plan{stroke:var(--fill-strong);stroke-width:1.4;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.dc-dot,.lc-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--c);transform:translate(-50%,-50%);box-sizing:border-box;pointer-events:none;transition:left .08s linear,top .08s linear}
.dc-tag{position:absolute;transform:translate(10px,-135%);background:var(--chart-up);color:#fff;font:700 11px/1 var(--body);padding:5px 8px;border-radius:7px;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(27,158,70,.5)}

.lc{position:relative;cursor:crosshair}.lc svg{display:block;width:100%;overflow:visible}

.lc.hover .lc-tip{opacity:1}
.rpills{display:flex;justify-content:center;gap:4px;margin-top:10px}
.rpills button{all:unset;cursor:pointer;font:600 11.5px/1 var(--body);color:var(--muted);padding:6px 11px;border-radius:999px;transition:background-color .2s,color .2s,transform .35s var(--spring)}

.tcat{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) 64px minmax(60px,110px) 56px;gap:10px;align-items:center;width:100%;padding:7px 4px;border-radius:9px;font-size:13.5px;color:var(--ink)}

.lp-search input{all:unset;flex:1;font-size:14px;color:var(--ink)}
.lp-list{max-height:280px;overflow:auto;padding:6px}
.lp-h{display:flex;align-items:center;gap:7px;padding:10px 8px 4px;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lp-h:first-child{padding-top:4px}
.lp-o{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 10px 8px 24px;border-radius:8px;font-size:14px;color:var(--ink)}
.lp-o:hover{background:var(--fill)}
.lp-o.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.lp-o b{color:var(--accent)}
.lp-none{margin:0;padding:14px;text-align:center;font-size:13px;color:var(--muted)}
.pane .pfields .lp-btn{border-color:transparent;padding-left:0}.pane .pfields .lp-btn:hover{border-color:var(--card-line);padding-left:12px}

/* ---- app-wide control polish ---- */
.lp-btn.lp-inline{width:auto}
.lp-o.flat{padding-left:10px}
.lp-o span{display:flex;align-items:center;gap:8px}
.lp-o span>i{width:9px;height:9px;border-radius:50%;flex:none}
.lp-pop{min-width:200px}
/* $ in front of the amount */
.amt-wrap{position:relative;display:block}
.amt-wrap>span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:500;pointer-events:none}
.amt-wrap input{width:100%;box-sizing:border-box;padding-left:24px!important}
/* Today / Yesterday */
.dchips{display:flex;gap:6px;margin-top:6px}
.dchips button{all:unset;cursor:pointer;font:500 12px/1 var(--body);color:var(--accent);padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 9%,transparent)}
.dchips button:hover,.dchips button.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
/* empty month/date fields */
input.de-empty{color:var(--muted)}
/* Helm checkboxes */
html body input[type=checkbox]:not(.switch){appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0 8px 0 0;flex:none;border-radius:6px;border:1.5px solid var(--fill-strong);background:var(--surface);display:inline-grid;place-items:center;vertical-align:-5px;cursor:pointer;transition:background-color .15s,border-color .15s}
html body input[type=checkbox]:not(.switch)::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .2s var(--spring)}
html body input[type=checkbox]:not(.switch):checked{background:var(--accent);border-color:var(--accent)}
html body input[type=checkbox]:not(.switch):checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.f-repeat,.md-goal{display:flex;align-items:center;font-size:13.5px;cursor:pointer}
/* one focus ring everywhere */
html body :focus{outline:none}
html body :is(input,select,textarea):focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)!important}
html body :is(button,a,[tabindex]):focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)!important;border-radius:var(--ctl-r)}
/* selection and scrollbars */
::selection{background:color-mix(in srgb,#A9BEC6 55%,transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 35%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--muted) 55%,transparent)}
/* tooltips */
.htip{position:fixed;left:0;top:0;z-index:999;max-width:260px;padding:6px 9px;border-radius:8px;background:var(--ink);color:var(--surface);font:500 12px/1.35 var(--body);pointer-events:none;opacity:0;transition:opacity .15s}
.htip.on{opacity:1}
/* notes box */
html body textarea{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--ctl-r);padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;min-height:72px}

.field:has(>.dchips){position:relative}
.field>.dchips{position:absolute;top:-3px;right:0;margin:0;gap:4px}
.field>.dchips button{padding:4px 8px;font-size:11.5px}

.lp-btn{max-width:100%;min-width:0;overflow:hidden}
.lp-v{min-width:0;flex-shrink:1}
.lp-g{min-width:0;flex-shrink:3;overflow:hidden;text-overflow:ellipsis}
.jar .lp-g,.lp-btn.lp-inline .lp-g{display:none}
.jar .lp-btn svg{margin-left:auto}

.set-row .lp-btn,.pc-head .lp-btn,.pc-bill .lp-btn{width:auto!important;flex:0 1 auto;max-width:220px;margin-left:auto}
.set-row .lp-pop{left:auto;right:0;width:240px}

/* Helm wheel logo in the account circle: a navy coin; on hover the wheel turns like you're steering */
html body .gn-me .me-sea{display:none!important}
html body .gn-me .me-tile{background:radial-gradient(circle at 50% 40%,#1C2E45,#0B1622)!important}
html body .gn-me .me-ship.me-wheel{left:50%;top:50%;bottom:auto;height:78%;width:auto;transform:translate(-50%,-50%) rotate(0deg)!important;transform-origin:50% 50%;filter:none!important;animation:none!important;transition:transform .9s cubic-bezier(.3,1.35,.5,1)}
html body .gn-me:hover .me-ship.me-wheel,html body .gn-me:focus-visible .me-ship.me-wheel{transform:translate(-50%,-50%) rotate(90deg) scale(1.06)!important}
html.reduce-motion .gn-me:hover .me-ship.me-wheel{transform:translate(-50%,-50%)!important}
@media (prefers-reduced-motion:reduce){html body .gn-me:hover .me-ship.me-wheel{transform:translate(-50%,-50%)!important}}

html body .gn-me:hover .me-clip,html body .gn-me:focus-visible .me-clip{clip-path:inset(0 round 50%)!important}
html body .adot.helm{background:radial-gradient(circle at 50% 40%,#1C2E45,#0B1622)}

/* ===== account cards (style A: each type has its own look) ===== */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.acard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;aspect-ratio:1.586;padding:12px 13px;border-radius:14px;overflow:hidden;color:#fff;box-shadow:0 1px 2px rgba(10,20,40,.08),0 6px 16px -10px rgba(10,20,40,.35);transition:transform .35s var(--spring),box-shadow .25s}
.acard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(10,20,40,.08),0 14px 26px -14px rgba(10,20,40,.45)}
.acard.on{outline:2.5px solid var(--accent);outline-offset:2px}
.acard::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%);pointer-events:none}
.ac-checking{background:linear-gradient(140deg,#1C2E45,#0B1622)}
.ac-savings{background:linear-gradient(140deg,#cfe6fb,#A9BEC6);color:#0b2547}
.ac-credit{background:linear-gradient(140deg,#fbfbfd,#e3e6ee);color:#1d1d1f;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 16px -10px rgba(10,20,40,.3)}
.ac-invest{background:linear-gradient(140deg,#1b9e6e,#0b5e43)}
.ac-loan{background:linear-gradient(140deg,#55555a,#2c2c30)}
.ac-cash{background:linear-gradient(140deg,#d8f3e6,#a8e2c6);color:#0b3d2a}
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:24px}
.ac-type{font:700 10px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;opacity:.85;padding-top:3px}
.ac-logo{width:26px;height:26px;border-radius:7px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.ac-logo img{width:20px;height:20px;object-fit:contain}
.ac-ic,.ac-nfc{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.ac-nfc{opacity:.55}
.ac-pay{display:inline-flex;align-items:center;gap:1px;height:18px;padding:0 5px 0 3px;border-radius:5px;background:#fff;color:#000;font:600 10.5px/1 -apple-system,var(--body);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.ac-pay img{width:12px;height:12px;object-fit:contain}
.ac-chip{width:24px;height:18px;border-radius:4px;margin-top:6px;background:linear-gradient(135deg,#D9C49C,#B99B68);box-shadow:inset 0 0 0 1px rgba(120,90,30,.25)}
.ac-bal{margin-top:auto;font:700 18px/1.1 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ac-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin-top:3px}
.ac-name{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ac-net{height:18px;max-width:34px;object-fit:contain;border-radius:3px;flex:none}
.ac-use{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.08)}
.ac-use i{display:block;height:100%;background:var(--accent)}
.ac-add{background:transparent;border:1.5px dashed var(--card-line);box-shadow:none;color:var(--muted);align-items:center;justify-content:center;font-size:26px}
.ac-add::after{display:none}.ac-add:hover{background:var(--fill);color:var(--accent);box-shadow:none}
:root[data-theme="dark"] .ac-credit{background:linear-gradient(140deg,#e9ebf1,#c9ced9)}
:root[data-theme="dark"] .acard{box-shadow:0 0 0 1px rgba(255,255,255,.06)}
/* logos in rows, sidebar and the form */
.adot.alogo{background:#fff;box-shadow:inset 0 0 0 1px var(--card-line);overflow:hidden}
.adot.alogo img{width:70%;height:70%;object-fit:contain}
.sd-acct .sd-logo{width:14px;height:14px;border-radius:4px;object-fit:contain;background:#fff;flex:none}
.af-logo{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center}
.af-prev{width:40px;height:40px;border-radius:10px;border:1px solid var(--card-line);background:#fff;display:grid;place-items:center;overflow:hidden}
.af-prev img{width:28px;height:28px;object-fit:contain}.af-prev em{font-size:10px;color:var(--muted);font-style:normal}
.af-logo .ln-btn{height:var(--control)}
.af-logo2{display:flex;gap:12px;margin-top:4px}.af-up{cursor:pointer}
.af-ap .f-repeat{height:var(--control)}

html body .aform input.set-in:not(#_){width:100%;max-width:none;box-sizing:border-box}
html body .aform .pf.col{margin-bottom:12px}

/* logos fill their shape instead of sitting in a white box */
html body .ac-logo{width:30px;height:30px;border-radius:8px;background:none;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
html body .ac-logo img{width:100%;height:100%;object-fit:cover}
html body .adot.alogo{background:none;box-shadow:0 0 0 .5px var(--card-line)}
html body .adot.alogo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
html body .sd-acct .sd-logo{width:16px;height:16px;border-radius:50%;object-fit:cover;background:none}
html body .af-prev{background:none;border:0;box-shadow:0 0 0 .5px var(--card-line)}
html body .af-prev img{width:100%;height:100%;object-fit:cover}
/* the account number takes the balance's place */
.ac-num{margin-top:auto;font:600 16px/1.1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ac-num span{letter-spacing:.12em;opacity:.7;margin-right:2px}
/* bigger, proportional network and Apple Pay marks */
html body .ac-net{height:26px;max-width:44px;border-radius:5px}
html body .ac-pay{height:24px;padding:0 7px 0 5px;border-radius:6px;font-size:13px;gap:2px}
html body .ac-pay img{width:15px;height:15px}
/* every account logo and account initial uses the same rounded square (about 27% corners) */
html body .adot:not(.helm),html body .adot.alogo img{border-radius:27%!important}
html body .sd-acct .sd-logo{border-radius:27%}
html body .af-prev,html body .af-prev img{border-radius:27%}
html body .ac-logo{border-radius:27%}

/* account form: every field the same box, logo row aligned */
html body .aform .lp-btn{border-color:var(--card-line)!important;padding-left:12px!important}
html body .aform .pf.col>span:first-child{font-size:12.5px;font-weight:500;color:var(--muted)}
html body .af-prev{width:var(--control);height:var(--control);box-sizing:border-box;border:1px solid var(--card-line);background:var(--fill);box-shadow:none}
html body .af-prev svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
html body .af-logo{grid-template-columns:var(--control) minmax(0,1fr) auto}
html body .af-logo2 .pg-add{margin:6px 0 0;padding:4px 0}
html body .af-logo2 .pg-add:hover{background:none;text-decoration:underline}
html body .aform [hidden]{display:none!important}

/* type-specific account fields: slide open smoothly */
.af-extras{display:flex;flex-direction:column}
.af-x{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-4px);transition:grid-template-rows .45s cubic-bezier(.32,.72,0,1),opacity .3s ease,transform .45s cubic-bezier(.32,.72,0,1)}
.af-x.on{grid-template-rows:1fr;opacity:1;transform:none}
.af-x>div{overflow:hidden;min-height:0}
.af-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding-bottom:2px}
.af-grid .af-ap{align-self:end}
.af-unit{position:relative;display:block}
.af-unit.pct::after{content:"%";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.af-unit.pct input{padding-right:28px!important}
.af-unit.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.af-unit.money input{padding-left:24px!important}
@media (prefers-reduced-motion:reduce){.af-x{transition:none}}
html.reduce-motion .af-x{transition:none}
/* details on the account panel */
.ap-facts{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
.ap-facts span{display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:var(--ctl-r);background:var(--fill);min-width:84px}
.ap-facts em{font:700 10px/1 var(--body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ap-facts b{font:650 14px/1.1 var(--display);color:var(--ink)}

html body .af-unit>input.set-in:not(#_){width:100%!important;max-width:none!important;box-sizing:border-box!important;display:block;margin:0!important}

/* network and Apple Pay badges: same size, crisp at any zoom */
.ac-net2{display:block;width:40px;height:26px;flex:none;border-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ac-net2 svg,.ac-pay2 svg{display:block;width:100%;height:100%}
.ac-pay2{display:block;width:44px;height:30px;flex:none}
.ac-pay2 svg{background:#fff;border-radius:6px}

/* checking: a soft navy-tinted card instead of the deep navy block */
html body .ac-checking{background:linear-gradient(140deg,#eef2fa,#d3dcee);color:#101F30;box-shadow:inset 0 0 0 1px rgba(18,34,74,.08),0 6px 16px -10px rgba(10,20,40,.3)}
:root[data-theme="dark"] .ac-checking{background:linear-gradient(140deg,#2a3a5e,#1c2a48);color:#dce6f7}

/* net worth card: one number, one quiet line, one soft chart */
.nw2-sub{display:flex;align-items:center;gap:8px;margin:6px 0 14px;font-size:13.5px;color:var(--ink);font-weight:600}
.nw2-sub em{font-style:normal;font-weight:400;color:var(--muted)}
.nw2-sub .dot{color:var(--muted);font-weight:400}
.nw-soft svg path[fill]:not([fill="none"]){opacity:.35}
.nw-soft svg path[fill="none"]{stroke-width:1.75}
.nwcard2 .rpills{margin-top:6px}

/* account panel: this month in and out, as two bars */
.af-flow{padding:14px 16px;border-radius:14px;background:var(--fill);margin:4px 0 6px;display:grid;gap:10px}
.af-h{display:flex;justify-content:space-between;align-items:baseline;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.af-h em{font:600 12.5px/1 var(--body);font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink)}.af-h em.mu{color:var(--muted);font-weight:500}
.af-row{display:grid;grid-template-columns:78px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px}
.af-row span:first-child{color:var(--muted)}
.af-row b{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.af-bar{height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.af-bar i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.32,.72,0,1)}

/* net worth: month-end columns */
.nwb{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:8px;padding-bottom:18px}
.nwb>span{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.nwb i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:color-mix(in srgb,#A9BEC6 70%,var(--surface));transition:height .6s cubic-bezier(.32,.72,0,1)}
.nwb .now i{background:var(--accent)}
.nwb i.neg{background:color-mix(in srgb,var(--chart-down) 55%,var(--surface))}
.nwb .now i.neg{background:var(--chart-down)}
.nwb em{position:absolute;bottom:-18px;font-style:normal;font-size:11px;color:var(--muted)}
.nwb .now em{color:var(--ink);font-weight:600}

/* Helm date picker */
.dp-native{display:none!important}
.dp-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:9px;width:100%;height:var(--control);padding:0 12px;border-radius:var(--ctl-r);background:var(--surface);border:1px solid var(--card-line);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.dp-btn:hover{border-color:var(--fill-strong)}
.dp-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.dp-btn svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
.dp-btn span{overflow:hidden;text-overflow:ellipsis}.dp-btn b{font-weight:600}
.dp-btn.empty{color:var(--muted)}
.dp-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:85;width:268px;padding:12px;box-sizing:border-box;background:var(--surface);border:1px solid var(--card-line);border-radius:16px;box-shadow:0 18px 44px -14px rgba(10,20,40,.3);animation:lp-in .18s var(--ease)}
.dp-pop.up{top:auto;bottom:calc(100% + 6px)}.dp-pop.right{left:auto;right:0}
.dp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-h b{font:650 15px/1 var(--display);color:var(--ink)}
.dp-nav{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--accent)}
.dp-nav:hover{background:var(--fill)}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-w span{text-align:center;font:700 10.5px/24px var(--body);color:var(--muted)}
.dp-d{all:unset;cursor:pointer;height:34px;border-radius:50%;display:grid;place-items:center;font:500 13.5px/1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums;transition:background-color .12s,transform .2s var(--spring)}
.dp-d:hover{background:var(--fill)}
.dp-d:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.dp-d.out{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.dp-d.today{color:var(--accent);font-weight:700}
.dp-d.on{background:var(--accent);color:#fff;font-weight:650}
:root[data-theme="dark"] .dp-d.on{color:#0B1622}
.dp-d:active{transform:scale(.92)}
.dp-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dp-f button{all:unset;cursor:pointer;font:500 12.5px/1 var(--body);color:var(--accent);padding:6px 8px;border-radius:8px}
.dp-f button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}

.pair:has(#f-date){grid-template-columns:minmax(0,1fr)!important}

/* logo sizing: Fill (default) crops to the rounded square; Fit shows the whole logo inside it */
html body .fit>img:not(#_),html body img.sd-logo.fit:not(#_),html body .af-prev.fit img:not(#_){object-fit:contain!important;padding:10%;box-sizing:border-box;background:#fff}
html body .adot.alogo.fit img:not(#_){padding:12%}
.ac-logo.fit,.adot.alogo.fit,.af-prev.fit{background:#fff}
.af-fitseg{display:inline-flex;gap:0;padding:2px;border-radius:8px;background:var(--fill);margin-right:6px}
.af-fitseg.off{display:none}
.af-fitseg button{all:unset;cursor:pointer;font:500 12px/1 var(--body);padding:6px 10px;border-radius:6px;color:var(--muted)}
.af-fitseg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--card-line)}
.af-logo2{align-items:center}
.ac-title{font-family:var(--display);letter-spacing:-.01em;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.aform .pf2:has(>.af-last[hidden]){grid-template-columns:minmax(0,1fr)}

html body img.sd-logo.fit:not(#_){padding:1px;box-shadow:0 0 0 .5px var(--card-line)}

/* Fit: the whole logo on its own edge color (navy for Ford), still a rounded square */
html body .ac-logo.fit,html body .adot.alogo.fit,html body .af-prev.fit{background:var(--lbg,#fff)!important}
html body .fit>img:not(#_),html body .af-prev.fit img:not(#_){background:var(--lbg,#fff)!important}
html body img.sd-logo.fit:not(#_){background:var(--lbg,#fff)!important}

/* Fit leaves real breathing room so artwork that runs to the edges (like Ford) shows whole */
html body .ac-logo.fit>img:not(#_){padding:15%!important}
html body .adot.alogo.fit img:not(#_){padding:16%!important}
html body .af-prev.fit img:not(#_){padding:15%!important}
html body img.sd-logo.fit:not(#_){padding:2px!important}

/* account icons */
.ai-svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.adot.aicon,.ac-logo.aicon,.sd-ic,.af-prev.aicon{background:var(--c)!important;color:#fff;display:grid;place-items:center;border-radius:27%!important;box-shadow:none}
.adot.aicon .ai-svg{width:58%;height:58%}
.ac-logo.aicon .ai-svg{width:62%;height:62%}
.sd-ic{width:16px;height:16px;flex:none}.sd-ic .ai-svg{width:12px;height:12px;stroke-width:2}
.af-prev.aicon .ai-svg{width:55%;height:55%}
.af-icons{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.af-icons>span{font-size:12.5px;color:var(--muted);margin-right:4px}
.af-ic{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--fill);transition:background-color .15s,color .15s,transform .2s var(--spring)}
.af-ic .ai-svg{width:19px;height:19px}
.af-ic:hover{color:var(--ink);transform:translateY(-1px)}
.af-ic.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .af-ic.on{color:#0B1622}

html body .sd-acct .sd-ic{flex:0 0 16px!important;width:16px;height:16px;padding:0}
html body .af-prev.aicon svg{stroke:#fff!important;width:55%!important;height:55%!important}

/* all account cards: light and airy, silver-gray base with a soft hint of color by type */
html body .acard:not(.ac-add){color:#1d1d1f;box-shadow:inset 0 0 0 1px rgba(18,34,74,.07),0 6px 16px -10px rgba(10,20,40,.28)}
html body .ac-credit{background:linear-gradient(140deg,#fbfbfd,#e4e7ee)}
html body .ac-checking{background:linear-gradient(140deg,#f6f8fc,#dfe5f1);color:#101F30}
html body .ac-savings{background:linear-gradient(140deg,#F3F6F6,#D8E3E7);color:#0b2547}
html body .ac-invest{background:linear-gradient(140deg,#f4fbf7,#d9efe3);color:#0b3d2a}
html body .ac-cash{background:linear-gradient(140deg,#fbfaf6,#ece8dd);color:#3a3324}
html body .ac-loan{background:linear-gradient(140deg,#fbf8f8,#ebe3e3);color:#3a2626}
html body .acard .ac-type,html body .acard .ac-name{opacity:.7}
:root[data-theme="dark"] .ac-checking{background:linear-gradient(140deg,#e9edf6,#cfd8ea)}
:root[data-theme="dark"] .ac-savings{background:linear-gradient(140deg,#e6f2fd,#c6def4)}
:root[data-theme="dark"] .ac-invest{background:linear-gradient(140deg,#e6f4ec,#c6e3d2)}
:root[data-theme="dark"] .ac-cash{background:linear-gradient(140deg,#f2efe6,#dcd6c6)}
:root[data-theme="dark"] .ac-loan{background:linear-gradient(140deg,#f2ebeb,#dccfcf)}

/* account filter chips and sort */
.afbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.af-chips{display:flex;gap:6px;flex-wrap:wrap}
.af-chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--card-line);font:500 13px/1 var(--body);color:var(--ink);transition:background-color .15s,border-color .15s,color .15s}
.af-chip em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--fill);border-radius:999px;padding:2px 7px}
.af-chip:hover{background:var(--fill)}
.af-chip.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent);color:var(--accent);font-weight:600}
.af-chip.on em{background:var(--accent);color:#fff}
:root[data-theme="dark"] .af-chip.on em{color:#0B1622}
.af-sort{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.af-sort .lp-btn{height:32px;width:auto!important;min-width:128px}

/* ===== Accounts v2 ===== */
.ahead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-2px}
.ahead>b{font:700 20px/1.1 var(--display);letter-spacing:-.015em}
.ahead-r{display:flex;align-items:center;gap:8px}
.aseg{margin:0}
.asort{all:unset;cursor:pointer;width:32px;height:32px;border-radius:var(--ctl-r);display:grid;place-items:center;background:var(--surface);border:1px solid var(--card-line);color:var(--muted);transition:background-color .15s,color .15s}
.asort:hover{background:var(--fill);color:var(--ink)}
.asort svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.agl{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px -4px;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.agl b{font:600 12.5px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
html body .acard{aspect-ratio:auto;height:118px;padding:11px 13px}
.ac-mid{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ac-mid .ac-num{margin-top:0}
.ac-key{font:650 13px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.85}
html body .acard .ac-foot{margin-top:4px}
.dragging-ok .acard[data-acctsel]{cursor:grab;touch-action:none}
body.adragging,body.adragging *{cursor:grabbing!important;user-select:none}
.aghost{box-shadow:0 24px 50px -16px rgba(10,20,40,.45)!important;opacity:.96;transition:none!important}
.acard.drag{opacity:.4}
.acard.over{outline:2px dashed var(--accent);outline-offset:3px}
.acard:hover:not(.ac-add){transform:translateY(-3px) rotate(-.4deg)}
.aempty{padding:28px 16px;border:1.5px dashed var(--card-line);border-radius:16px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px}
.aempty p{margin:0}
/* overview */
.aov{display:flex;flex-direction:column}
.aov .big{font-size:32px;margin:4px 0 12px}
.aov-bar{display:flex;gap:3px;height:12px;border-radius:6px;overflow:hidden;margin-bottom:12px}
.aov-bar i{min-width:3px}
.aov-lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13px}
.aov-lg i{width:10px;height:10px;border-radius:3px}
.aov-lg b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.aov-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 6px;border-radius:10px;font-size:13.5px}
.aov-row:hover{background:var(--fill)}
.aov-row .adot{width:30px;height:30px;font-size:12px}
.aov-row span{display:flex;flex-direction:column;gap:2px;min-width:0}.aov-row span b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aov-row em{font-style:normal;font-size:12px;color:var(--muted)}
.aov-row>b{font-weight:650;font-variant-numeric:tabular-nums}
.aov .nwb{margin-top:4px}

html body .aseg button{padding:0 11px}
.ahead{flex-wrap:nowrap;min-width:0}.ahead-r{min-width:0}

/* credit cards: Apple Pay and the network badge share the top-right corner */
.ac-badges{display:flex;align-items:center;gap:6px}
html body .ac-badges .ac-pay2{width:40px;height:26px}
html body .ac-badges .ac-net2{width:40px;height:26px}

.ac-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* debit cards inside an account */
.dc-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.dc-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--fill)}
.dc-mini{width:34px;height:22px;border-radius:5px;background:linear-gradient(140deg,#fbfbfd,#d9dde6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative}
.dc-mini::after{content:"";position:absolute;left:5px;top:6px;width:8px;height:6px;border-radius:2px;background:linear-gradient(135deg,#D9C49C,#B99B68)}
.dc-t{display:flex;flex-direction:column;gap:2px;min-width:0}.dc-t b{font-weight:600;font-size:13.5px}.dc-t em{font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.04em}
.dc-b{display:flex;gap:5px;align-items:center}
html body .ac-net2.sm,html body .ac-pay2.sm{width:32px;height:21px}
.dc-row .del{opacity:0;transition:opacity .2s}.dc-row:hover .del,.dc-row .del.confirm{opacity:1}.dc-row .del.confirm{width:auto;padding:0 8px}
.dc-form{padding:12px;border-radius:12px;border:1px solid var(--card-line);margin-top:6px}
.dc-form .set-in{width:100%;box-sizing:border-box}
.dc-actions{display:flex;gap:8px;margin-top:4px}
/* an account with debit cards shows a second card edge peeking out behind it */
.acard.has-sub{overflow:visible;margin-bottom:6px}
.acard.has-sub::before{content:"";position:absolute;left:10px;right:10px;bottom:-6px;height:14px;border-radius:0 0 12px 12px;background:linear-gradient(140deg,#f4f5f8,#dfe2ea);box-shadow:inset 0 0 0 1px rgba(18,34,74,.08),0 4px 10px -6px rgba(10,20,40,.3);z-index:-1}
.ac-subn{margin-left:auto;font:600 11px/1 var(--body);padding:3px 7px;border-radius:999px;background:rgba(18,34,74,.08);white-space:nowrap}

html body .dc-b .ac-net2,html body .dc-b .ac-pay2{width:32px!important;height:21px!important;border-radius:5px!important;padding:0!important;background:none!important;display:block}
html body .dc-b svg{width:100%!important;height:100%!important;display:block}
.acards{position:relative;z-index:0}

/* the second card's edge, drawn as a layered edge just under the card */
html body .acard.has-sub::before{display:none}
html body .acard.has-sub:not(.ac-add){box-shadow:inset 0 0 0 1px rgba(18,34,74,.07),0 7px 0 -3px #e4e7ee,0 7px 0 -2px rgba(18,34,74,.14),0 12px 18px -10px rgba(10,20,40,.3)!important}
:root[data-theme="dark"] .acard.has-sub:not(.ac-add){box-shadow:0 7px 0 -3px #c9cfdb,0 7px 0 -2px rgba(255,255,255,.12)!important}

/* small icon buttons (edit a card) */
.an-b{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background-color .15s,color .15s}
.an-b:hover{background:var(--surface);color:var(--ink)}
.an-b.on,.an-b.ok{color:var(--accent)}
.an-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.dc-row{grid-template-columns:34px minmax(0,1fr) auto 30px 26px}
.dc-row .dc-ed{opacity:0}.dc-row:hover .dc-ed{opacity:1}
.ac-edit{position:absolute;right:8px;bottom:8px;z-index:3;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15);opacity:0;transform:scale(.9);transition:opacity .15s,transform .2s var(--spring)}
.ac-edit svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acard:hover .ac-edit{opacity:1;transform:none}
.ac-edit:hover{color:var(--accent)}
body.adragging .ac-edit{display:none}

html body .ac-edit{right:10px;top:9px;bottom:auto}
.acard .ac-top>:last-child:not(.ac-logo):not(.ac-type){transition:opacity .15s}
.acard:hover .ac-top>:last-child:not(.ac-logo):not(.ac-type){opacity:0}

/* add an item to a budget category: one compact row, soft Add, quiet Cancel */
html body .pgroup .gadd{grid-template-columns:minmax(0,1fr) 92px auto auto!important;gap:6px;align-items:center;padding:4px 4px 2px}
html body .pgroup .gadd input{height:34px}
html body .pgroup #gi-add:not(#_){height:34px!important;min-height:0!important;padding:0 14px!important;width:auto;border:0!important;background:color-mix(in srgb,var(--accent) 13%,transparent)!important;color:var(--accent)!important;font-weight:600;line-height:34px}
html body .pgroup #gi-add:not(#_):hover{background:color-mix(in srgb,var(--accent) 22%,transparent)!important}

/* ===== Dashboard v2 (from the Figma concept) ===== */
.dh{display:flex;flex-direction:column;gap:18px;margin-top:10px}

.pc-tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.pc-tot span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.pc-tot b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}

.ac-plan1 .pc-t span,.ac-plan1 .pc-tot span,.ac-plan1 .pc-s{color:#6e6e73}

/* ===== one hover motion for the whole app: a gentle 1px lift for cards, a soft 3% grow for buttons, same slow easing ===== */
:root{--hover-ease:cubic-bezier(.22,1,.36,1);--hover-time:.5s}
html body :is(.acard,.hc,.sm,.jar,.stat,.bill2,.step,.mdrow,.pc-it,button.gw,.textbtn,.cchip,.from,.del,.gplus,.iconbtn,.info,.gw-arr,.b2-btn,.paid-btn,.gw-plus,.nw-plus,.fund-badge,.pf-badge,.pf-ring,.ln-btn,.gn-crumb,.b2-del,.gw-reveal,.af-ic){transition:transform var(--hover-time) var(--hover-ease),box-shadow var(--hover-time) var(--hover-ease),background-color .25s ease,color .25s ease,opacity .25s ease!important}
/* cards: lift, never tilt or grow */
html body :is(.acard:not(.ac-plan1),.hc,.sm:not(.ln-wide):not(.ln-tx),.jar,.stat,.bill2,.step:not(.locked):not(.compact)):hover:not(#_),html body .rv.in :is(.stat,.jar,.step:not(.locked)):hover:not(#_){transform:translateY(-1px)!important;rotate:none!important;box-shadow:0 1px 2px rgba(10,20,40,.05),0 10px 22px -16px rgba(10,20,40,.28)!important}
html body .acard.ac-plan1:hover:not(#_){transform:none!important;rotate:none!important}
html body :is(.mdrow,.pc-it,.af-ic):hover:not(#_){transform:translateY(-1px)!important}
/* buttons: a soft grow */
html body :is(.textbtn,.cchip,.from,.del.confirm,.fund-badge,.ln-btn,.gn-crumb,.gw-reveal,.nav-inner .gw-plus):hover:not(#_){transform:scale(1.03)!important}
html body :is(.gplus,.iconbtn,.info,.gw-arr,.b2-btn,.paid-btn,.nw-plus,.pf-badge,.pf-ring,.b2-del,.del:not(.confirm)):hover:not(#_){transform:scale(1.06)!important}
html.reduce-motion body :is(.acard,.hc,.sm,.jar,.stat,.bill2,.step,.mdrow,.pc-it,.textbtn,.cchip,.from,.del,.gplus,.iconbtn,.info,.gw-arr,.b2-btn,.paid-btn,.nw-plus,.fund-badge,.pf-badge,.pf-ring,.ln-btn,.gn-crumb,.b2-del,.gw-reveal):hover:not(#_){transform:none!important}

/* sidebar plan items: navy icon tile (brand blue in dark mode) */
html body .sd-plan .sd-ic{--c:#101F30}
:root[data-theme="dark"] body .sd-plan .sd-ic{--c:#6B8994}

/* the live answer under a number box when you type math */
.calc-pill{position:fixed;z-index:9999;pointer-events:none;padding:4px 9px;border-radius:8px;background:#101F30;color:#F3EBDD;font:600 12px/1.2 var(--body);font-variant-numeric:tabular-nums;opacity:0;transform:translateY(-3px);transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.calc-pill.on{opacity:1;transform:none}.calc-pill.bad{background:var(--fill-strong);color:var(--muted)}
:root[data-theme="dark"] .calc-pill{background:#F3EBDD;color:#101F30}

/* a box with math in it lights up like Siri: the moment there's an answer, a ring blooms out from the middle to both ends */
@property --calc-s{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --calc-glow{syntax:'<number>';inherits:false;initial-value:0}
html body input.money{transition:color .35s ease}
html body input.money.calc-on:not(#_){
  --calc-fill:var(--field,#fff);
  color:#9A7B46!important;font-weight:650;letter-spacing:.03em;
  border:2px solid transparent!important;
  background:
    linear-gradient(var(--calc-fill),var(--calc-fill)) padding-box,
    linear-gradient(to right,#E6D3AE,#B99B68,#E6D3AE) border-box center/var(--calc-s) 100% no-repeat,
    linear-gradient(var(--field-line,#dcdfe7),var(--field-line,#dcdfe7)) border-box!important;
  box-shadow:0 0 calc(var(--calc-glow)*14px) calc(var(--calc-glow)*1px) rgba(185,155,104,.38),0 0 calc(var(--calc-glow)*26px) rgba(230,211,174,.35)!important;
  animation:calc-bloom .95s cubic-bezier(.25,.8,.25,1) forwards,calc-glowin 1.05s ease-out forwards,calc-breathe 3.6s ease-in-out 1.05s infinite}
@keyframes calc-bloom{from{--calc-s:0%}to{--calc-s:100%}}
@keyframes calc-glowin{from{--calc-glow:0}to{--calc-glow:1}}
@keyframes calc-breathe{0%,100%{--calc-glow:1}50%{--calc-glow:.7}}
html body input.money.calc-on.calc-bad:not(#_){color:var(--muted)!important}
:root[data-theme="dark"] body input.money.calc-on:not(#_){--calc-fill:var(--field,#1c1c1e);color:#E6D3AE!important}
html.reduce-motion body input.money.calc-on:not(#_){animation:none;--calc-glow:1;--calc-s:100%}
html body .calc-pill:not(.bad){background:#B99B68;color:#101F30}
:root[data-theme="dark"] body .calc-pill:not(.bad){background:#C9AE7F;color:#101F30}
html body input.money.calc-on.calc-bad:not(#_){color:var(--muted)!important}
:root[data-theme="dark"] body input.money.calc-on:not(#_){color:#C3D6DD!important;background-color:color-mix(in srgb,#6B8994 18%,var(--field,#1c1c1e))!important}

/* ===== Darker without getting wider (Oct 24) =====
   Bold text is wider, so a tab that turns bold pushes its neighbors. Apple's system font has no grade axis,
   so a hairline outline in the text's own color thickens the letters in place: same width, nothing moves. */
:root{--grade-on:.38px;--grade-hover:.28px;--grade-t:color .18s ease,-webkit-text-stroke-width .18s ease,background-color .2s ease,box-shadow .2s ease,opacity .2s ease,transform .2s ease}
html body :is(.tabs button,.plan-switch button,.gn-links button,.pmenu button,.sd-nav button,.gw-seg button,.seg-pills button,.lp-o,.af-fitseg button,.af-chip,.bd-steps .bd-stt,.bd-chk li,.db-seg button):not(#_):not(#__){font-weight:500!important;-webkit-text-stroke:0 currentColor;transition:var(--grade-t)}
html body :is(.tabs button[aria-selected="true"],.plan-switch button[aria-selected="true"],.gn-links button[aria-selected="true"],.pmenu button.on,.sd-nav button.on,.gw-seg button[aria-selected="true"],.seg-pills button.on,.seg-pills button[aria-checked="true"],.lp-o.on,.af-fitseg button.on,.af-chip.on,.bd-steps .on .bd-stt,.bd-chk li.on,.db-seg button[aria-selected="true"]):not(#_):not(#__){-webkit-text-stroke-width:var(--grade-on)}
html body :is(.gn-links button,.sd-nav button,.gw-seg button,.seg-pills button,.db-seg button,.plan-switch button,.tabs button,.bd-tog,.from,.cl-edit,.pg-add,.lp-o):not(#_):not(#__):hover{color:var(--ink)!important;-webkit-text-stroke-width:var(--grade-hover)}
html body :is(.bd-tog,.from,.cl-edit):not(#_){-webkit-text-stroke:0 currentColor;transition:var(--grade-t)}
html body .lr .lr-n{-webkit-text-stroke:0 currentColor;transition:-webkit-text-stroke-width .18s ease}
html body .lr:hover .lr-n,html body .lr.on .lr-n{-webkit-text-stroke-width:.25px}
@media (prefers-reduced-motion:reduce){html body :is(.gn-links button,.sd-nav button,.gw-seg button,.lr .lr-n){transition:none}}

/* ===== More little graphs in the middle lists (Oct 25) ===== */

@keyframes mo-reveal{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% -2% -10% 0)}}

/* hovering a chart: the part under the pointer stays, the rest steps back */
svg [data-tip]{transition:opacity .2s ease,fill .2s ease}
svg.mo-dim [data-tip]:not(.mo-hov):not([fill="transparent"]){opacity:.42}

#mo-tip.on{opacity:1;scale:1}#mo-tip span{font-weight:400;font-size:11.5px;color:var(--muted)}#mo-tip b{font-weight:600;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){.mo-in,.mo-in *{animation:none!important}.mo-knob{transition:none}}

const LOCKED_GROUPS=['Giving','Saving','Housing','Utilities','Food','Transportation','Health','Insurance','Personal','Lifestyle','Childcare','Miscellaneous','Debt'];
const groupNames=()=>(plan&&plan.groups?plan.groups.map(g=>g.name):LOCKED_GROUPS);
// where existing items belong in the locked categories
const LINE_HOME={health:'Insurance',life:'Insurance',autoins:'Insurance',medical:'Health',subs:'Lifestyle',fun:'Lifestyle',dates:'Lifestyle'};
// category colors: distinct mid-tones that read in light and dark mode (no orange; red stays for "over budget")
const CAT_COLORS=['#007aff','#34c759','#ffcc00','#af52de','#30b0c7','#ff2d55','#5856d6','#a2845e','#00c7be','#A9BEC6','#8e8e93','#2e7d32','#e87ba4','#c9a227','#5e7c99','#32ade6','#7e57c2','#8bc34a','#b0436e','#64748b'];
let colorsAdded=false;
// a new category gets a random color that no other category is using
function pickColor(used){
  const free=CAT_COLORS.filter(c=>!used.includes(c));
  if(free.length)return free[Math.floor(Math.random()*free.length)];
  return `hsl(${Math.floor(Math.random()*360)} 55% 55%)`;
}
function normalizeGroups(p){
  const kept=Object.fromEntries((p.groups||[]).filter(g=>g.color).map(g=>[g.name,g.color]));
  const custom=(p.groups||[]).filter(g=>!g.locked&&!LOCKED_GROUPS.includes(g.name)).map(g=>({name:g.name,locked:false}));
  for(const l of p.lines){
    if(!p.groups&&LINE_HOME[l.id])l.g=LINE_HOME[l.id];
    if(l.g==='Insurance & health')l.g='Insurance';
    if(!LOCKED_GROUPS.includes(l.g)&&!custom.some(c=>c.name===l.g))custom.push({name:l.g,locked:false});
  }
  const locked=LOCKED_GROUPS.map(n=>({name:n,locked:true})),debt=locked.pop();
  p.groups=[...locked,...custom,debt];
  // colors stay with their category; built-in categories start from the fixed list, any others get a random free color once
  for(const g of p.groups){
    if(kept[g.name]){g.color=kept[g.name];continue}
    const i=LOCKED_GROUPS.indexOf(g.name);
    g.color=i>=0?CAT_COLORS[i]:pickColor(p.groups.map(x=>x.color).filter(Boolean));
    colorsAdded=true;
  }
  return p;
}

// Light / Dark / System: switch the app's dark-mode styles on or off directly, so it works the same in the Mac app and in Edge
function applyAppearance(){
  const t=device.theme||'system';
  for(const sh of document.styleSheets){let rules;try{rules=sh.cssRules}catch(e){continue}
    for(const r of rules){if(!r.media||!/prefers-color-scheme:\s*dark/.test(r.media.mediaText))continue;
      // each dark-mode block keeps its "dark" test, so it can always be found again: always on, never on, or follow the system
      const want=t==='dark'?'all, (prefers-color-scheme: dark)':t==='light'?'(prefers-color-scheme: dark) and (max-width: 0px)':'(prefers-color-scheme: dark)';
      if(r.media.mediaText!==want)r.media.mediaText=want}}
  document.documentElement.classList.toggle('reduce-motion',device.motion==='reduced');
  // styles written for dark mode by name (the glass bar's edges and shine) follow the look actually on screen
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
}

function periodRange(ym){const [y,m]=ym.split('-').map(Number),sd=startDay();return [new Date(y,m-1,sd),new Date(y,m,sd-1)]}
const shortDate=d=>!d||isNaN(d)?'—':`${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
function periodLabel(ym){if(startDay()===1)return '';const [a,b]=periodRange(ym);return `${shortDate(a)} – ${shortDate(b)}`}

/* ================= storage: Mac app file, Claude account, or this browser ================= */
const Store={mode:'local',chains:{},timers:{},
  async init(){
    const native=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.store;
    if(native){this.mode='native';this.native=native;return}
    let db=null;try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
    if(db){this.mode='db';this.db=db;return}
    this.mode='local';
  },
  async load(){
    if(this.mode==='native'){const s=await this.native.postMessage({op:'load'});const o=s?JSON.parse(s):{};this.prefs=o.prefs||{};return {plan:o.plan||null,months:o.months||{}}}
    if(this.mode==='db'){
      const p=await this.db.doc('app/plan').get();
      const ms=await this.db.collection('months').get();
      const out={};ms.docs.forEach(d=>{out[d.id]=d.data()});
      return {plan:p.exists?p.data().plan:null,months:out};
    }
    try{const o=JSON.parse(localStorage.getItem(LS)||'{}');return {plan:o.plan||null,months:o.months||{}}}catch(e){return {plan:null,months:{}}}
  },
  write(key,value){
    const base=this.writeLocal(key,value);
    return Cloud.on?Promise.all([base,Cloud.put(key,value)]):base;
  },
  writeLocal(key,value){
    if(this.mode==='native')return this.native.postMessage({op:'save',key,value:JSON.stringify(value)});
    if(this.mode==='db')return key==='plan'?this.db.doc('app/plan').set({plan:value}):this.db.doc('months/'+key.slice(6)).set(value);
    try{const o=JSON.parse(localStorage.getItem(LS)||'{}');o.months=o.months||{};
      if(key==='plan')o.plan=value;else o.months[key.slice(6)]=value;
      localStorage.setItem(LS,JSON.stringify(o))}catch(e){}
    return Promise.resolve();
  },
  save(key,value,delay=0){
    snapCache=null;
    clearTimeout(this.timers[key]);
    return new Promise(res=>{this.timers[key]=setTimeout(()=>{
      const snap=JSON.parse(JSON.stringify(value));
      this.chains[key]=(this.chains[key]||Promise.resolve()).then(()=>this.write(key,snap)).then(()=>{showError('')},e=>{
        showError(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old entries, then try again.':'Your last change didn’t save. Check your connection and try again.')});
      this.chains[key].then(res);
    },delay)});
  }
};

const CLOUD={url:'https://nodladyhgqkwnnvfyagt.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vZGxhZHloZ3Frd25udmZ5YWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzczOTYsImV4cCI6MjEwNzU1MzM5Nn0.lihFgYoolzZfBjivkEW39EyjuXMNhurJ2JLaF9h2-3g'};
const Cloud={sb:null,user:null,hid:null,code:null,pending:{},
  get ready(){return !!this.sb},
  get on(){return !!(this.sb&&this.user&&this.hid&&!this.choice)},
  async init(){

    const CDN='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';

      try{await this.findHousehold()}catch(e){}
    }
    // back online: send what changed here first, then pick up what changed on the other computer
    addEventListener('online',()=>this.resync());
    // phones and sleeping Macs drop the live connection: catch up whenever the app is opened again, and every 20 seconds while it's open
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.resync()});addEventListener('focus',()=>this.resync());setInterval(()=>{if(!document.hidden&&(!this.live||Date.now()-(this.last||0)>15000))this.resync()},4000);setInterval(()=>{if(Object.keys(this.pending).length)this.resync()},30000);
  },
  async findHousehold(){
    const {data}=await this.sb.from('household_members').select('household_id, households(invite_code,name)').eq('user_id',this.user.id).limit(1);
    if(data&&data[0]){this.hid=data[0].household_id;this.code=data[0].households&&data[0].households.invite_code}
  },
  async loadAll(){
    const {data,error}=await this.sb.from('budget_kv').select('key,value,updated_at').eq('household_id',this.hid);if(error)throw error;this.last=Date.now();this.seen={};for(const r of data)this.seen[r.key]=r.updated_at;
    const out={plan:null,months:{}};for(const r of data){if(r.key==='plan')out.plan=r.value;else if(/^month[:-]/.test(r.key))out.months[r.key.slice(6)]=r.value;else if(r.key==='inbox')setInbox(r.value,true)}
    return out;
  },
  async put(key,value){this.dirty=this.dirty||{};this.dirty[key]=Date.now();
    const at=new Date().toISOString();let error;try{({error}=await this.sb.from('budget_kv').upsert({household_id:this.hid,key,value,updated_at:at,updated_by:this.user.id}))}catch(e){error=e}
    if(!error&&this.seen)this.seen[key]=at;
    if(error){this.pending[key]=value;this.savePending();throw error}this.last=Date.now();if(key in this.pending){delete this.pending[key];this.savePending()}
  },
  // changes that haven't reached the shared budget yet survive quitting the app
  savePending(){try{localStorage.setItem('wfb-pending',JSON.stringify(this.pending))}catch(e){}},
  async flush(){if(!this.on)return false;for(const [k,v] of Object.entries(this.pending)){try{await this.put(k,v)}catch(e){return false}}showError('');return true},
  // a light check: just each row's last-saved time, so a quiet poll costs almost nothing
  async changed(){
    const {data,error}=await this.sb.from('budget_kv').select('key,updated_at').eq('household_id',this.hid);if(error)throw error;
    this.seen=this.seen||{};const keys=data.filter(r=>this.seen[r.key]!==r.updated_at).map(r=>r.key);this.last=Date.now();return keys;
  },
  async resync(){
    if(!this.on||this.syncing)return;this.syncing=true;
    try{if(await this.flush()){if(this.seen&&!(await this.changed()).length){if(!this.ch)this.subscribe();return}
      const d=await this.loadAll();const same=JSON.stringify(d.plan)===JSON.stringify(plan)&&Object.entries(d.months||{}).every(([k,v])=>JSON.stringify(v)===JSON.stringify(months[k]));if(same){if(!this.ch)this.subscribe();return}
      snapCache=null;if(d.plan){plan=migrate(d.plan);Store.writeLocal('plan',plan)}
      for(const [ym,m] of Object.entries(d.months||{})){months[ym]=m;Store.writeLocal('month:'+ym,m)}
      dropLeftovers();
      if(!this.ch)this.subscribe();
      const a=document.activeElement;if(a&&a.matches&&a.matches('input,select,textarea'))this.redraw=true;else render()}}
    catch(e){}finally{this.syncing=false}
  },
  async uploadAll(){await this.put('plan',plan);for(const [ym,m] of Object.entries(months))await this.put('month:'+ym,m)},
  subscribe(){
    // syncing is on: from now on this device is linked to the shared budget
    try{localStorage.setItem('wfb-hid',JSON.stringify({u:this.user.id,hid:this.hid,code:this.code}))}catch(e){}this.wasLinked=true;
    if(this.ch)this.sb.removeChannel(this.ch);
    this.ch=this.sb.channel('kv-'+this.hid).on('postgres_changes',{event:'*',schema:'public',table:'budget_kv',filter:'household_id=eq.'+this.hid},p=>this.remote(p)).subscribe(st=>{this.live=st==='SUBSCRIBED';if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){clearTimeout(this.retry);this.retry=setTimeout(()=>{if(this.on)this.subscribe()},3000)}});
  },
  // the other person saved something: take it, keep this device's copy in step, and redraw unless you're mid-typing
  remote(p){
    snapCache=null;

      await sb.auth.signOut();if(Cloud.ch)sb.removeChannel(Cloud.ch);Cloud.ch=null;try{localStorage.removeItem('wfb-hid')}catch(e){}Cloud.user=null;Cloud.hid=null;Cloud.code=null;cloudMsg='Signed out. This device keeps its own copy.';

function sameBudget(d){const k=p=>JSON.stringify([num(p&&p.takeHome),num(p&&p.extraMortgage),((p&&p.lines)||[]).map(l=>[l.id,num(l.amt)])]);

async function linkDevice(){

/* ================= state & math ================= */
let plan=null,months={},tab='month',curMonth=todayISO().slice(0,7),pendingDelete=null;
try{const t=localStorage.getItem(LS+'-tab');if(['home','tx','cats','plan','cash','accounts','bills','steps'].includes(t))tab=t;else if(t==='jars')tab='plan';else if(TABMAP[t])tab=TABMAP[t]}catch(e){}

function mortgage(){
  const m=plan.mortgage,loan=Math.max(0,m.price*(1-m.downPct/100)),r=m.rate/1200,n=Math.round(m.years*12);
  const pay=(L,N)=>N<=0?0:r?L*r/(1-Math.pow(1+r,-N)):L/N;
  const pi=pay(loan,n),tax=m.price*m.taxRate/100/12,ins=m.insYear/12,pmi=m.downPct<20?loan*m.pmiRate/100/12:0;
  const total=pi+tax+ins+pmi;
  return {loan,pi,tax,ins,pmi,total,pi15:pay(loan,180),ratio:plan.takeHome?total/plan.takeHome:0};
}
const debtMins=()=>plan.debts.filter(d=>num(d.balance)>0).reduce((s,d)=>s+num(d.min),0);
/* each month keeps its own budget: months[ym].budget = {lineId: amount}. Linked lines (mortgage, debts, jars) stay automatic. */
const MONTH_TABS=['tx','cats','plan','month','cash'];
const viewYM=()=>MONTH_TABS.includes(tab)?curMonth:thisPeriod();
const monthBudget=ym=>(months[ym]||{}).budget;
const hasBudget=ym=>!!monthBudget(ym);
// a line added this month keeps the amount it was added with until you change it
const plainAmt=(l,ym)=>{const b=monthBudget(ym);if(b&&b[l.id]!=null)return num(b[l.id]);return b&&ym===thisPeriod()&&l.born===ym?num(l.amt):0};
const lineAmt=(l,ym)=>l.link==='mortextra'?num(plan.extraMortgage):l.link==='piti'?r2(mortgage().total):l.link==='debts'?debtMins():l.link==='jars'?jarsMonthly():plainAmt(l,ym||viewYM());
function setLineAmt(l,ym,v){if(l.link)return;months[ym]=months[ym]||{tx:[]};const b=months[ym].budget=months[ym].budget||{};b[l.id]=Math.max(0,r2(num(v)));if(ym===thisPeriod())l.amt=b[l.id];saveMonth(ym)}
// copy one month's amounts into another (only the lines you type in; Baby Steps, jars and debts aren't touched)
function copyBudget(from,to){months[to]=months[to]||{tx:[]};const b={};for(const l of plan.lines)if(!l.link)b[l.id]=plainAmt(l,from);months[to].budget=b;saveMonth(to)}
// the most recent month at or before ym that has a budget
function budgetBefore(ym){return Object.keys(months).filter(k=>k<ym&&hasBudget(k)).sort().pop()||null}
// Baby Steps size the emergency fund from your current budget, so copying or starting a new month doesn't move them
function stepsYM(){const n=thisPeriod();if(hasBudget(n)&&totalPlanned(n)>0)return n;return Object.keys(months).filter(k=>hasBudget(k)&&totalPlanned(k)>0).sort().pop()||n}
// first run: today's plan becomes this month's budget, so nothing you already set up disappears
let bootDone=false;
function migrateBudgets(){if(!bootDone||plan.budgetV2)return;const n=thisPeriod();if(!Object.keys(months).some(hasBudget)){months[n]=months[n]||{tx:[]};const b={};for(const l of plan.lines)if(!l.link)b[l.id]=num(l.amt);months[n].budget=b;saveMonth(n)}plan.budgetV2=true;savePlan(0)}
function newMonthNote(ym){if(hasBudget(ym))return '';const from=budgetBefore(ym),[,m]=ym.split('-').map(Number);
  return `<section class="nm-note" role="status"><div><b>${MONTHS[m-1]} doesn’t have a budget yet</b><span>Each month has its own numbers. Start from ${from?`${MONTHS[+from.slice(5)-1]}’s`:'a blank budget'}${from?' and adjust what’s different, or start fresh':''}.</span></div><div class="nm-btns">${from?`<button class="textbtn primary" data-copybudget="${from}">Copy ${MONTHS[+from.slice(5)-1]}’s numbers</button>`:''}<button class="textbtn" data-blankbudget>Start from zero</button></div></section>`}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-copybudget],[data-blankbudget]');if(!t)return;const ym=viewYM(),[,m]=ym.split('-').map(Number);
  if(t.dataset.copybudget){copyBudget(t.dataset.copybudget,ym);toast(`${MONTHS[m-1]} now starts with ${MONTHS[+t.dataset.copybudget.slice(5)-1]}’s numbers`)}
  else{months[ym]=months[ym]||{tx:[]};months[ym].budget={};saveMonth(ym);toast(`${MONTHS[m-1]} starts from zero`)}
  savePlan(0);render()});
const jarLine=j=>j.line&&plan.lines.find(l=>l.id===j.line&&!l.link);
const jarMonthly=j=>{const l=jarLine(j);return l?lineAmt(l,thisPeriod()):num(j.monthly)};
const jarsMonthly=()=>(plan.jars||[]).filter(j=>!jarLine(j)).reduce((s,j)=>s+num(j.monthly),0);
function ymAdd(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function monthsUntil(ym){if(!ym)return 0;const [y,m]=ym.split('-').map(Number),n=new Date();return Math.max(1,(y-n.getFullYear())*12+(m-1-n.getMonth()))}
function ymLabel(ym){const [y,m]=ym.split('-').map(Number);return `${MONTHS[m-1].slice(0,3)} ${y}`}
const totalPlanned=ym=>plan.lines.reduce((s,l)=>s+lineAmt(l,ym),0);
const fundLine=()=>plan.lines.find(l=>l.id==='bsfund');
// The mortgage balance you enter is saved with the month you entered it. From then on it goes down by itself each month:
// interest is added, then the principal-and-interest payment and any monthly extra come off.
// was the mortgage paid in this budget month? the Mortgage bill ticked off, or a payment logged to the mortgage line
function mortPaidIn(ym){const m=months[ym];if(!m)return false;
  if((plan.bills||[]).some(b=>b.line==='house'&&m.paid&&m.paid[b.id]))return true;
  return (m.tx||[]).some(t=>t.kind!=='income'&&t.cat==='house'&&num(t.amount)>0)}
const mortPaidCount=()=>Object.keys(months).filter(ym=>mortPaidIn(ym)).length;
const mortStart=()=>(plan.mortgage&&plan.mortgage.start)||thisPeriod();
function mortBalance(){
  // Balance today = what you borrowed (home price − down payment), minus the payments you've actually made:
  // each month the mortgage is marked paid (the Mortgage bill on Bills, or a payment logged to the mortgage line),
  // plus "Extra every month" in those months, plus one-time payments
  const mo=mortgage(),r=plan.mortgage.rate/1200,pay=mo.pi+num(plan.extraMortgage),start=mortStart();
  const once={};for(const p of plan.mortgagePayments||[]){const ym=String(p.date||'').slice(0,7)||thisPeriod();once[ym]=(once[ym]||0)+num(p.amount)}
  const yms=[...new Set([...Object.keys(months),...Object.keys(once)])].sort();
  let bal=mo.loan;
  for(const ym of yms){if(bal<=0)break;if(mortPaidIn(ym))bal=Math.max(0,bal+bal*r-pay);bal=Math.max(0,bal-(once[ym]||0))}

// try to keep a copy inside the budget (works offline); if the icon host won't allow that, keep the link
async function fetchLogo(site){const url=iconURL(site);
  // a free image relay lets Helm keep a real copy of the icon (works offline, and its colors can be read)
  for(const u of ['https://images.weserv.nl/?output=png&url='+encodeURIComponent(url.replace(/^https?:\/\//,'')),url]){
    try{const r=await fetch(u,{mode:'cors'});if(!r.ok)continue;const b=await r.blob();if(!b.size)continue;
      return await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)})}catch(e){}}
  return url}
// look at a logo's pixels: its background (the most common edge color), and whether the artwork crowds or runs off the edges
function logoAnalyze(src){return new Promise(res=>{const none={bg:'#ffffff',crowded:false};if(!src||!/^data:/.test(src)){res(none);return}
  const im=new Image();im.onload=()=>{try{const N=64,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');g.drawImage(im,0,0,N,N);const d=g.getImageData(0,0,N,N).data;
    const px=(x,y)=>{const k=(y*N+x)*4;return [d[k],d[k+1],d[k+2],d[k+3]]};
    // most common edge color, bucketed so slight shading still counts as one color
    const tally=new Map();let clear=0,edges=0;
    for(let i=0;i<N;i++)for(const [x,y] of [[i,0],[i,N-1],[0,i],[N-1,i]]){const p=px(x,y);edges++;if(p[3]<128){clear++;continue}const key=p.slice(0,3).map(v=>v>>4).join();const t=tally.get(key)||{n:0,r:0,g:0,b:0};t.n++;t.r+=p[0];t.g+=p[1];t.b+=p[2];tally.set(key,t)}
    let bg=[255,255,255],transparent=clear>edges/2;
    if(!transparent&&tally.size){const t=[...tally.values()].sort((a,b)=>b.n-a.n)[0];bg=[t.r/t.n,t.g/t.n,t.b/t.n]}
    const isArt=p=>transparent?p[3]>=128:p[3]>=128&&Math.abs(p[0]-bg[0])+Math.abs(p[1]-bg[1])+Math.abs(p[2]-bg[2])>90;
    let x0=N,x1=-1,y0=N,y1=-1;
    const band=[];for(let y=0;y<N;y++){let n=0;for(let x=0;x<N;x++)if(isArt(px(x,y)))n++;band[y]=n>N*.85}
    for(let y=0;y<N;y++)if(!band[y])for(let x=0;x<N;x++)if(isArt(px(x,y))){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    // an edge is crowded when artwork partly touches its middle half; a solid band along a whole edge (Wells Fargo's stripe) is part of the design
    const lo=Math.round(N*.25),hi=Math.round(N*.75);let crowdedEdges=0;
    for(const side of ['l','r','t','b']){let art=0;for(let i=lo;i<hi;i++){const [x,y]=side==='l'?[1,i]:side==='r'?[N-2,i]:side==='t'?[i,1]:[i,N-2];if(isArt(px(x,y)))art++}const f=art/(hi-lo);if(f>.04&&f<.85)crowdedEdges++}

    const w=(x1-x0+1)/N,h=(y1-y0+1)/N,margin=Math.min(x0,y0,N-1-x1,N-1-y1)/N;

// what's left before a step can be marked done
function stepToGo(i){const s=stepInfo();
  if(i===0)return `${fmt0.format(Math.max(0,1000-s.ef))} more to save`;
  if(i===1)return `${fmt0.format(s.debtTotal)} of debt left`;
  if(i===2)return `${fmt0.format(Math.max(0,s.efTarget-s.ef))} more to save`;
  if(i===3)return `${fmt0.format(Math.max(0,s.retireTarget-num(plan.retire.monthly)))}/mo more to invest`;
  if(i===4)return 'Choose a college plan, or skip it';
  if(i===5)return `${fmt0.format(mortBalance())} left on the house`;
  return ''}
function stepInfo(){
  const ef=num(plan.ef.balance),debtTotal=plan.debts.reduce((s,d)=>s+Math.max(0,num(d.balance)),0);
  const sy=stepsYM(),monthlyExp=totalPlanned(sy)-lineAmt(fundLine(),sy);
  const efTarget=monthlyExp*plan.ef.months,retireTarget=plan.grossAnnual*0.15/12;
  const met=[ef>=1000,debtTotal<=0,ef>=efTarget&&efTarget>0,num(plan.retire.monthly)>=retireTarget-0.5,
    plan.college.status==='skip'||num(plan.college.monthly)>0,mortBalance()<=0,false];
  // a step only counts as done once you mark it done, so nothing gets skipped
  const done=met.map((_,i)=>i<6&&!!(plan.stepsDone||[])[i]);
  let current=done.slice(0,3).findIndex(x=>!x);
  let parallel=false;
  if(current===-1){const i=[3,4,5].find(i=>!done[i]);if(i!==undefined){current=i;parallel=true}else current=6}
  return {ef,debtTotal,monthlyExp,efTarget,retireTarget,met,done,current,parallel};
}
// What the Baby Step fund is paying for right now, in plain words
function stepGoal(){
  const s=stepInfo();
  if(s.current===0)return 'your $1,000 starter emergency fund';
  if(s.current===1){const next=plan.debts.filter(d=>num(d.balance)>0).sort((a,b)=>num(a.balance)-num(b.balance))[0];return next?`paying off ${next.name}`:'paying off your debts'}
  if(s.current===2)return 'your full emergency fund';
  if(s.parallel){if(!s.done[3])return 'investing for retirement';if(!s.done[4])return 'college savings';return 'paying off your home early'}
  return 'building wealth and giving';
}

function mortChart(){
  const ex=num(plan.extraMortgage),a=payoffCurve(0),b=ex>0?payoffCurve(ex):null;
  if(!a||a.length<2)return '';
  const W=600,H=150,L=4,R=4,T=8,B=20,n=a.length-1,max=a[0]||1;
  const x=i=>L+(W-L-R)*i/n,y=v=>T+(H-T-B)*(1-v/max);
  const path=arr=>arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const yr=new Date().getFullYear(),now=new Date().getMonth();let ticks='';
  for(let i=1;i<=n;i++){const m=(now+i)%12;if(m===0){const Y=yr+Math.floor((now+i)/12);if(Y%5===0)ticks+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${Y}</text>`}}

  return `<svg class="mort-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mortgage balance over time: paid off ${monthsFromNow(n)}${b?`, or ${monthsFromNow(b.length-1)} with extra payments`:''}">
    <path d="${path(a)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 5"/>
    ${b?`<path d="${path(b)}" fill="none" stroke="var(--accent)" stroke-width="2.25"/><circle cx="${x(b.length-1)}" cy="${y(0)}" r="4" fill="var(--accent)"/>`:''}
    <circle cx="${x(n)}" cy="${y(0)}" r="3.5" fill="var(--muted)"/>${ticks}${hits}</svg>
    <div class="mort-legend"><span><i class="dash"></i>Regular payments · ${monthsFromNow(n)}</span>${b?`<span><i style="background:var(--accent)"></i>With ${fmt0.format(ex)}/mo extra · ${monthsFromNow(b.length-1)}</span>`:''}</div>`;
}

function payExtra(){

  else toast(`Paid ${fmt0.format(amt)} extra`);

/* Your paycheck: one rounded bar showing how each month's take-home divides up, shaped like the income card beside it */
// whole-number percentages that always add up to 100 (largest remainder); a sliver shows as "<1"
function sharePcts(vals,total){
  if(!total)return vals.map(()=>0);
  const raw=vals.map(v=>v/total*100),fl=raw.map(Math.floor),target=Math.round(raw.reduce((a,b)=>a+b,0));
  let left=target-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){fl[i]++;left--}});
  return fl.map((p,i)=>p===0&&vals[i]>0?'<1':p);
}

function paychecks(){
