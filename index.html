<title>Wess Family Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--warm:#a39a91;--brand:"Didot","Bodoni 72","Playfair Display",Georgia,serif;--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--baby:#9ecff5;--warm:#7d756d;color-scheme:dark}
}
:root[data-theme="dark"]{--baby:#9ecff5;--warm:#7d756d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
.app{max-width:1120px;margin:0 auto;display:grid}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-family:var(--brand);font-size:31px;font-weight:700;letter-spacing:.005em}
h3{font-family:var(--body)}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.brand{display:flex;align-items:center}
.mark{width:40px;height:40px;flex:none;display:block}
.badge{font-size:12px;color:var(--muted);border-radius:999px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{font-weight:600}
.iconbtn{display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.textbtn:hover{border-color:var(--accent)}
.textbtn.primary{border-color:var(--accent)}
.textbtn:disabled{cursor:default}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.notice.err{border-color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);display:grid;min-width:0;align-content:start}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{color:var(--muted)}
.stat.key .v{font-family:var(--display);font-weight:700}
.good{color:var(--good)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}
.muted{color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted)}
.monthnav{display:flex;align-items:center}
.monthnav .label{font-family:var(--display);min-width:9em;text-align:center}
.group{display:grid;gap:10px}
.group+.group{border-top:1px solid var(--line);padding-top:12px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group-head .mono{font-size:13px;color:var(--muted)}
.bud{display:grid;gap:4px}
.bud-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bud-top .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.bud-top .amt b{color:var(--ink);font-weight:500}
.bar{border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px}
.bar.prog span{background:var(--accent)}
.bar.warn span{background:var(--warn)}
form{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;font-weight:500;font-size:14px;cursor:pointer;color:var(--muted)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input:not([type]),select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.formmsg{font-size:13px;min-height:1.2em;color:var(--muted)}
.formmsg.err{color:var(--bad)}
.entries{list-style:none;margin:0;padding:0;display:grid}
.entry{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .d{font-family:var(--mono);font-size:13px;color:var(--muted)}
.entry .desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .cat{font-size:12px;color:var(--muted)}
.entry .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.del:hover{border-color:var(--line)}
.del.confirm{border-color:var(--bad)}
.empty{color:var(--muted);font-size:14px;padding:16px 0;text-align:center}
.assign{display:flex;flex-wrap:wrap;gap:18px;align-items:end;justify-content:space-between}
.assign .big{font-variant-numeric:tabular-nums}
.pline{display:grid;gap:10px;align-items:center;padding:6px 0}
.pline .nm{min-width:0}
.pline .note{font-size:12px;color:var(--muted)}
.pline .linked{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:10px;font-size:14px}
.checks{display:grid;margin:0;padding:0;list-style:none;font-size:14px}
.checks li{display:grid}
.checks .ic{font-weight:700}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;row-gap:6px;column-gap:0;font-size:14px}
.kv>span:nth-child(odd){padding-right:12px}
.kv .mono{text-align:right}
.kv .tot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.step .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;border:1.5px solid var(--line);color:var(--muted)}
.step.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.current .n{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.step-body{display:grid;gap:10px;min-width:0}
.step-title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chip{font-size:12px;font-weight:600;border-radius:999px;color:var(--muted);white-space:nowrap}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.current{border-color:var(--accent);color:var(--accent)}
.debts{display:grid;gap:6px;overflow-x:auto}
.drow{display:grid;gap:8px;align-items:center;min-width:560px}
.drow.head{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drow .pay{font-size:13px;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.jars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.jar{border:1px solid var(--line);border-radius:12px;align-content:start;min-width:0}
.jar.full{border-color:var(--good)}
.jar-head{display:flex;gap:8px;align-items:center}
.jar-head input{font-weight:700;font-size:16px;border-color:transparent;padding-inline:4px}
.jar-head input:hover,.jar-head input:focus{border-color:var(--line);background:var(--bg)}
.jar .amount{font-variant-numeric:tabular-nums}

<script>
/* ================= constants ================= */
const LOCKED_GROUPS=['Giving','Saving','Housing','Utilities','Food','Transportation','Health','Insurance','Personal','Lifestyle','Childcare','Miscellaneous','Debt'];
const groupNames=()=>(plan&&plan.groups?plan.groups.map(g=>g.name):LOCKED_GROUPS);
// where existing items belong in the locked categories
const LINE_HOME={health:'Insurance',life:'Insurance',autoins:'Insurance',medical:'Health',subs:'Lifestyle',fun:'Lifestyle',dates:'Lifestyle'};
// category colors: distinct mid-tones that read in light and dark mode (no orange; red stays for "over budget")
const CAT_COLORS=['#007aff','#34c759','#ffcc00','#af52de','#30b0c7','#ff2d55','#5856d6','#a2845e','#00c7be','#9ecff5','#8e8e93','#2e7d32','#e87ba4','#c9a227','#5e7c99','#32ade6','#7e57c2','#8bc34a','#b0436e','#64748b'];
let colorsAdded=false;
// a new category gets a random color that no other category is using
function pickColor(used){
  const free=CAT_COLORS.filter(c=>!used.includes(c));
  if(free.length)return free[Math.floor(Math.random()*free.length)];
  return `hsl(${Math.floor(Math.random()*360)} 55% 55%)`;
}
function normalizeGroups(p){
  const kept=Object.fromEntries((p.groups||[]).filter(g=>g.color).map(g=>[g.name,g.color]));
  const custom=(p.groups||[]).filter(g=>!g.locked&&!LOCKED_GROUPS.includes(g.name)).map(g=>({name:g.name,locked:false}));
  for(const l of p.lines){
    if(!p.groups&&LINE_HOME[l.id])l.g=LINE_HOME[l.id];
    if(l.g==='Insurance & health')l.g='Insurance';
    if(!LOCKED_GROUPS.includes(l.g)&&!custom.some(c=>c.name===l.g))custom.push({name:l.g,locked:false});
  }
  const locked=LOCKED_GROUPS.map(n=>({name:n,locked:true})),debt=locked.pop();
  p.groups=[...locked,...custom,debt];
  // colors stay with their category; built-in categories start from the fixed list, any others get a random free color once
  for(const g of p.groups){
    if(kept[g.name]){g.color=kept[g.name];continue}
    const i=LOCKED_GROUPS.indexOf(g.name);
    g.color=i>=0?CAT_COLORS[i]:pickColor(p.groups.map(x=>x.color).filter(Boolean));
    colorsAdded=true;
  }
  return p;
}
// take-home pay can come from more than one paycheck; the budget uses their total
function syncIncome(){if(plan.incomes&&plan.incomes.length>1)plan.takeHome=r2(plan.incomes.reduce((a,s)=>a+num(s.amt),0))}
/* settings that belong to this computer only (never shared): who uses it, appearance, motion, and the page it opens to */
const DEV_KEY='homestead-budget-v1-device';
let device=(()=>{try{return JSON.parse(localStorage.getItem(DEV_KEY)||'{}')||{}}catch(e){return {}}})();
function saveDevice(){try{localStorage.setItem(DEV_KEY,JSON.stringify(device))}catch(e){}}
const meKey=()=>device.who==='b'?'b':'a',partnerKey=()=>meKey()==='a'?'b':'a';
const meName=()=>personName(meKey()),partnerName=()=>personName(partnerKey());
const reduceMotion=()=>device.motion==='reduced'||matchMedia('(prefers-reduced-motion: reduce)').matches;
// Light / Dark / System: switch the app's dark-mode styles on or off directly, so it works the same in the Mac app and in Edge
function applyAppearance(){
  const t=device.theme||'system';
  for(const sh of document.styleSheets){let rules;try{rules=sh.cssRules}catch(e){continue}
    for(const r of rules){if(!r.media||!/prefers-color-scheme:\s*dark/.test(r.media.mediaText))continue;
      // each dark-mode block keeps its "dark" test, so it can always be found again: always on, never on, or follow the system
      const want=t==='dark'?'all, (prefers-color-scheme: dark)':t==='light'?'(prefers-color-scheme: dark) and (max-width: 0px)':'(prefers-color-scheme: dark)';
      if(r.media.mediaText!==want)r.media.mediaText=want}}
  document.documentElement.classList.toggle('reduce-motion',device.motion==='reduced');
}
const personName=k=>k==='a'?(plan.people&&plan.people.a)||'You':k==='b'?(plan.people&&plan.people.b)||'Spouse':'Shared';
const INCOME_CATS=[{id:'paycheck',name:'Paycheck'},{id:'otherin',name:'Other income'}];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const LS='homestead-budget-v1';
const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const fmt0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round(n*100)/100;
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,%\s]/g,''));return isFinite(n)?n:0};
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// budget months can start on payday (Settings): with a start day of 15, "October" runs Oct 15 – Nov 14
const startDay=()=>Math.min(28,Math.max(1,Math.round(num(plan&&plan.settings&&plan.settings.startDay))||1));
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function periodOf(iso){const [y,m,d]=iso.split('-').map(Number);if(d>=startDay())return `${y}-${pad(m)}`;const p=new Date(y,m-2,1);return `${p.getFullYear()}-${pad(p.getMonth()+1)}`}
function periodRange(ym){const [y,m]=ym.split('-').map(Number),sd=startDay();return [new Date(y,m-1,sd),new Date(y,m,sd-1)]}
const shortDate=d=>`${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;
function periodLabel(ym){if(startDay()===1)return '';const [a,b]=periodRange(ym);return `${shortDate(a)} – ${shortDate(b)}`}
const thisPeriod=()=>periodOf(todayISO());
function monthName(ym){const [y,m]=ym.split('-').map(Number);return `${MONTHS[m-1]} ${y}`}
function monthsFromNow(n){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}`}
function duration(n){if(n<=0)return 'now';const y=Math.floor(n/12),m=n%12;return [y?`${y} yr`:'',m?`${m} mo`:''].filter(Boolean).join(' ')}

/* ================= starting estimates ================= */
function defaultLines(){return [
  {id:'giving',g:'Giving',name:'Church & charity',amt:300,note:'Ramsey puts giving first in the budget'},
  {id:'bsfund',g:'Saving',name:'Baby Step fund',amt:0,note:'Every leftover dollar goes to your current Baby Step'},
  {id:'jars',g:'Saving',name:'Savings jars',link:'jars',note:'Monthly amounts for savings jars that aren’t tied to another budget line'},
  {id:'house',g:'Housing',name:'Mortgage payment (PITI)',link:'piti',note:'Principal, interest, tax, insurance and PMI from the mortgage panel'},
  {id:'mortextra',g:'Housing',name:'Extra toward the house',link:'mortextra',note:'Extra principal each month, set on the Mortgage page'},
  {id:'homemaint',g:'Housing',name:'Home maintenance & repairs',amt:210,note:'About 1% of the home’s value per year'},
  {id:'electric',g:'Utilities',name:'Electric',amt:185,note:'Summer AC months usually run higher'},
  {id:'natgas',g:'Utilities',name:'Natural gas',amt:60,note:'Averaged across the year'},
  {id:'water',g:'Utilities',name:'Water & sewer',amt:85,note:'Water and sewer service together'},
  {id:'trash',g:'Utilities',name:'Trash pickup',amt:30,note:'Private hauler if you’re outside city limits'},
  {id:'internet',g:'Utilities',name:'Internet',amt:75},
  {id:'phones',g:'Utilities',name:'Phones (2 lines)',amt:110},
  {id:'groceries',g:'Food',name:'Groceries',amt:900,note:'Couple on a moderate-cost grocery plan'},
  {id:'restaurants',g:'Food',name:'Restaurants & takeout',amt:250},
  {id:'fuel',g:'Transportation',name:'Gas',amt:250,note:'Two cars'},
  {id:'autoins',g:'Insurance',name:'Car insurance (2 cars)',amt:240,note:'Two cars, full coverage'},
  {id:'automaint',g:'Transportation',name:'Car maintenance',amt:60},
  {id:'autotax',g:'Transportation',name:'Vehicle property tax & registration',amt:45,note:'Some states bill property tax on cars every year'},
  {id:'health',g:'Insurance',name:'Health insurance premiums',amt:500,note:'Employer plan, couple coverage'},
  {id:'medical',g:'Health',name:'Doctor & pharmacy',amt:100},
  {id:'life',g:'Insurance',name:'Term life insurance (both)',amt:60,note:'Ramsey: term only, 10–12× income each'},
  {id:'household',g:'Personal',name:'Household supplies & toiletries',amt:150},
  {id:'clothing',g:'Personal',name:'Clothing',amt:100},
  {id:'subs',g:'Lifestyle',name:'Subscriptions',amt:50},
  {id:'fun',g:'Lifestyle',name:'Fun money (both of you)',amt:200},
  {id:'dates',g:'Lifestyle',name:'Date nights & entertainment',amt:150},
  {id:'debtmins',g:'Debt',name:'Debt minimum payments',link:'debts',note:'Totals the minimums on your Baby Steps debt list'}
]}
function defaultPlan(){
  const p={v:2,takeHome:7000,grossAnnual:105000,
    mortgage:{price:250000,downPct:10,rate:6.5,years:30,taxRate:0.6,insYear:2100,pmiRate:0.5},
    mortgageBalance:null,mortgageAsOf:null,extraMortgage:0,mortgagePayments:[],
    lines:defaultLines(),
    ef:{balance:0,months:4},
    debts:[
      {id:'dx1',name:'Credit card',balance:2800,apr:24,min:90,example:true},
      {id:'dx2',name:'Student loan',balance:9200,apr:5.5,min:120,example:true},
      {id:'dx3',name:'Car loan',balance:14500,apr:6.9,min:385,example:true}
    ],
    retire:{monthly:0},college:{status:'skip',monthly:0},stepsDone:[],mortV2:true,
    bills:[],people:{a:'Kurtis',b:'Spouse'},settings:{startDay:1,notify:true,remindDays:2},
    nw:{homeValue:null,retirement:0,accounts:[]},nwHistory:{},jars:defaultJars(),groups:LOCKED_GROUPS.map((n,i)=>({name:n,locked:true,color:CAT_COLORS[i]}))};
  // totalPlanned() reads the current plan, so point it at the new one just long enough to size the Baby Step fund
  const prev=plan;plan=p;
  const fund=p.lines.find(l=>l.id==='bsfund');
  fund.amt=Math.max(0,r2(p.takeHome-totalPlanned()));
  plan=prev;
  return p;
}
// Sinking funds. Jars tied to a budget line fill from that line; the rest start at $0 a month.
function defaultJars(){
  const n=new Date(),dec=`${n.getFullYear()+(n.getMonth()>=10?1:0)}-12`;
  return [
    {id:'j-car',name:'Car repairs & tires',target:1200,balance:0,due:'',line:'automaint'},
    {id:'j-home',name:'Home repairs',target:2500,balance:0,due:'',line:'homemaint'},
    {id:'j-cartax',name:'Car tax bill',target:540,balance:0,due:'',line:'autotax'},
    {id:'j-xmas',name:'Christmas & gifts',target:800,balance:0,due:dec,monthly:0,example:true},
    {id:'j-trip',name:'Vacation',target:2000,balance:0,due:ymAdd(8),monthly:0,example:true}
  ];
}
function exampleTx(ym){
  const day=ym===todayISO().slice(0,7)?+todayISO().slice(8):28;
  const rows=[
    [1,'income','paycheck',1800,'Paycheck (you)'],[1,'expense','house',r2(mortgage().total),'Mortgage payment'],
    [2,'expense','giving',150,'Church giving'],[3,'income','paycheck',1700,'Paycheck (spouse)'],
    [3,'expense','debtmins',90,'Credit card minimum'],[4,'expense','groceries',212.40,'Groceries'],
    [5,'expense','electric',168.33,'Duke Energy bill'],[6,'expense','fuel',58.10,'Gas fill-up'],

/* scroll reveal: when a screen opens, each tile rises into place as it scrolls into view */
const REVEAL='.summary,.panel,.steps,.jars,.countdown,.ytable';
let revealIO=null,heroFresh=false;
function setupReveal(animate){

  const h=$('hero-slot').firstElementChild;
  if(h&&!heroFresh&&h.classList.contains('rv')&&!h.classList.contains('in'))revealOne(h);
  if(!animate||reduceMotion()||!('IntersectionObserver' in window))return;
  const v=$('view'),els=[...(heroFresh?[$('hero-slot').firstElementChild]:[]),...v.querySelectorAll(REVEAL)].filter(el=>!el.parentElement.closest(REVEAL));

      setTimeout(()=>revealOne(el),k++*60)}

}
function revealOne(el){

// dollar amounts and percents roll up from zero when they appear
function countUp(el){
  const node=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.textContent));if(!node)return;
  const text=node.textContent,m=text.match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/s);
  if(!m||!/[$%]/.test(text))return;
  const [,pre,numStr,post]=m,target=parseFloat(numStr.replace(/,/g,'')),dec=(numStr.split('.')[1]||'').length;
  if(!isFinite(target)||target===0)return;

  const t0=performance.now(),dur=1100;
  const step=now=>{const p=Math.min(1,(now-t0)/dur),ease=1-Math.pow(2,-10*p);
    if(!node.isConnected)return;
    node.textContent=p<1?show(target*ease):text;if(p<1)requestAnimationFrame(step)};
  node.textContent=show(0);requestAnimationFrame(step);
}

function placeTabPill(){placePill(document.querySelector('.gn-links'));placePill(document.querySelector('.plan-switch'))}
function placePill(nav){
  const sel=nav&&nav.querySelector('[aria-selected="true"]');if(!sel)return;
  let pill=nav.querySelector('.tabs-pill');if(!pill){pill=document.createElement('span');pill.className='tabs-pill';nav.prepend(pill)}
  const from=parseFloat(pill.style.left);if(!placePill.again)requestAnimationFrame(()=>{placePill.again=1;placePill(nav);placePill.again=0});

  const phone=matchMedia('(max-width:600px)').matches&&nav.classList.contains('gn-links');
  const nr=nav.getBoundingClientRect(),br=sel.getBoundingClientRect();

  const sr=phone?br:{width:sel.offsetWidth,height:sel.offsetHeight},L=phone?br.left-nr.left-nav.clientLeft:sel.offsetLeft,T=phone?br.top-nr.top-nav.clientTop:sel.offsetTop;
  if(Math.abs(from-L)<0.5&&Math.abs(parseFloat(pill.style.width)-sr.width)<0.5)return;
  if(phone){pill.style.cssText='';for(const [k,v] of [['left',L],['top',T],['width',sr.width],['height',sr.height]])pill.style.setProperty(k,v+'px','important')}
  else pill.style.cssText=`left:${L}px;top:${T}px;width:${sr.width}px;height:${sr.height}px`;
  // Liquid Glass: the lens squashes and stretches while it slides to the new tab, then settles
  if(!placePill.again&&!isNaN(from)&&Math.abs(from-L)>2&&pill.animate&&!reduceMotion())
    pill.animate([{transform:'scale(1,1)'},{transform:'scale(1.12,.86)',offset:.4},{transform:'scale(.97,1.04)',offset:.75},{transform:'scale(1,1)'}],{duration:520,easing:'cubic-bezier(.3,.7,.4,1)'});
}

let scanReady=false,sampler=null;
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(file)})}
// Backup reader for the raw receipt text: the TOTAL line, a date, and the store name at the top
function guessFromText(text){
  const out={},lines=String(text||'').split(/\n/);
  const money=l=>{const m=l.match(/\$?\s*\d{1,5}(?:,\d{3})*\.\d{2}\b/g);return m?num(m[m.length-1]):0};
  let total=0;
  for(const l of lines)if(/(grand\s*)?total|amount\s*due|balance\s*due/i.test(l)&&!/sub\s*-?\s*total/i.test(l)&&money(l))total=money(l);
  if(!total)for(const l of lines){const v=money(l);if(v>total)total=v}
  if(total)out.total=total;
  const d=String(text||'').match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(d){let y=+d[3];if(y<100)y+=2000;out.date=`${y}-${pad(+d[1])}-${pad(+d[2])}`}
  const first=lines.map(l=>l.trim()).find(l=>/[a-z]{3}/i.test(l));
  if(first)out.merchant=first.slice(0,40);
  return out;
}
// Web version only: pull text out of a PDF or Word receipt in the browser
const loadedLibs={};
function loadScript(src){return loadedLibs[src]||(loadedLibs[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loadedLibs[src];rej(new Error('load'))};document.head.appendChild(s)}))}
async function receiptFromDocument(file,kind){
  const buf=await file.arrayBuffer();
  if(kind==='docx'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
    return {text:(await window.mammoth.extractRawText({arrayBuffer:buf})).value};
  }
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  const pdf=await window.pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;
  let text='';
  for(let p=1;p<=Math.min(2,pdf.numPages);p++){const tc=await (await pdf.getPage(p)).getTextContent();text+=tc.items.map(i=>i.str+(i.hasEOL?'\n':' ')).join('')+'\n'}
  if(text.replace(/\s/g,'').length>20)return {text};
  const page=await pdf.getPage(1),vp=page.getViewport({scale:2}),c=document.createElement('canvas');
  c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return {images:[await new Promise(r=>c.toBlob(r,'image/jpeg',.9))]};
}
async function scanReceipt(file){
  const msg=$('scan-msg');if(!file||!msg)return;
  const kind=/\.pdf$/i.test(file.name)||file.type==='application/pdf'?'pdf':/\.docx$/i.test(file.name)?'docx':/\.doc$/i.test(file.name)?'doc':(/^image\//.test(file.type)||/\.(heic|heif|jpe?g|png|gif|webp)$/i.test(file.name))?'image':'';
  if(kind==='doc'){msg.className='scanmsg err';msg.textContent='Older .doc files can’t be read. In Word, choose File → Save As → .docx, then try that file.';return}
  if(!kind){msg.className='scanmsg err';msg.textContent='Choose a receipt photo (JPG, PNG, HEIC), a PDF or a Word file (.docx).';return}
  msg.className='scanmsg';msg.textContent='Reading the receipt…';
  const lines=plan.lines.filter(l=>!['bsfund','jars','debtmins','giving'].includes(l.id)).map(l=>({id:l.id,name:l.name}));
  let r={};
  try{
    if(Store.mode==='native'){
      const ask=Store.native.postMessage({op:'scanReceipt',image:await fileToBase64(file),name:file.name||('receipt.'+(kind==='image'?'jpg':kind)),lines,today:todayISO()});
      const t=await Promise.race([ask,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),60000))]);
      r=JSON.parse(t||'{}');
    }else{
      // PDFs and Word files are read in the browser; scanned PDFs go to Claude as a picture of the first page
      const src=kind==='image'?{images:[file]}:await receiptFromDocument(file,kind);
      const ask=`Read this store receipt and reply with only a JSON object:
{"merchant": store name, "date": "YYYY-MM-DD" or "", "total": the final amount paid including tax, as a number, "line": the id of the budget line it fits best}
Today is ${todayISO()}. Budget lines (id: name):
${lines.map(l=>l.id+': '+l.name).join('\n')}`;
      r=src.text?await sampler.json(ask+`\n\n<receipt>\n${src.text.slice(0,6000)}\n</receipt>`):await sampler.json(ask,{images:src.images});
    }
  }catch(e){
    msg.className='scanmsg err';
    msg.textContent=e&&e.code==='timeout'?'Reading that receipt is taking too long. Try again, or type the details in.':e&&e.code==='not_granted'?'Reading receipts needs your permission to use Claude. Reload and allow it, or type the details in.':'That receipt couldn’t be read. Try a clearer, flat photo, or type the details in.';
    return;
  }
  const g=guessFromText(r.text);
  const total=num(r.total)||g.total||0,date=/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:(g.date||''),merchant=String(r.merchant||g.merchant||'').trim();
  const lineId=lines.some(l=>l.id===r.line)?r.line:'';
  if(!total&&!merchant){msg.className='scanmsg err';msg.textContent='No text was found on that photo. Try a clearer, flat photo.';return}
  $('kind-expense').checked=true;$('f-cat').innerHTML=$('f-cat').dataset.exp;
  if(total)$('f-amount').value=total.toFixed(2);
  if(date)$('f-date').value=date;
  if(lineId)$('f-cat').value=lineId;
  if(merchant)$('f-desc').value=merchant;
  msg.className='scanmsg';
  msg.innerHTML=`Found <b>${esc(merchant||'a receipt')}</b>${total?` for <b>${fmt.format(total)}</b>`:''}${lineId?` · ${esc(lineName(lineId))}`:''}. Check the details below, then click <b>Add transaction</b>.`;
  $('f-amount').focus();
}

  return {date:monthsFromNow(when.months),line:ex>0&&fast.months!==Infinity?`With ${fmt0.format(ex)} a month extra you’re done in <b>${duration(fast.months)}</b>, <b class="good">${duration(base.months-fast.months)} sooner</b> and <b class="good">${fmt0.format(base.interest-fast.interest)}</b> less interest.`:`Regular payments: paid off in ${duration(base.months)}, ${fmt0.format(base.interest)} in interest. Add an extra amount to see how much sooner you’d own it.`};

function mortChart(){

}

/* Your paycheck: one rounded bar showing how each month's take-home divides up, shaped like the income card beside it */
// whole-number percentages that always add up to 100 (largest remainder); a sliver shows as "<1"
function sharePcts(vals,total){
  if(!total)return vals.map(()=>0);
  const raw=vals.map(v=>v/total*100),fl=raw.map(Math.floor),target=Math.round(raw.reduce((a,b)=>a+b,0));
  let left=target-fl.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){fl[i]++;left--}});
  return fl.map((p,i)=>p===0&&vals[i]>0?'<1':p);
}
function paycheckSplit(){

  const planned=totalPlanned(),take=num(plan.takeHome),left=take-planned;
  const parts=[['Giving',amt('Giving'),catColor('Giving')],['Saving',amt('Saving'),catColor('Saving')],['Housing',amt('Housing'),catColor('Housing')],['Everyday',everyday,'var(--g2)'],['Debt',amt('Debt'),catColor('Debt')],...(left>0.005?[['Not assigned yet',left,'var(--g3)']]:[])].filter(p=>p[1]>0.005);
  const base=Math.max(take,planned);
  const head=`<div class="assign"><div class="field"><span class="lbl">Your paycheck</span><span class="big">${fmt0.format(take)}</span></div><span class="sub">${left<-0.005?`Planned ${fmt0.format(-left)} more than you bring home`:'each month, after taxes'}</span></div>`;
  if(!base)return `<section class="panel pay-card">${head}<p class="sub">Add your take-home pay to see how each paycheck splits.</p></section>`;
  const P=sharePcts(parts.map(p=>p[1]),base);
  return `<section class="panel pay-card">${head}
    <div class="pay-bar" role="img" aria-label="${esc(parts.map((p,i)=>`${p[0]} ${P[i]}%`).join(', '))}">${parts.map(p=>`<i style="flex-grow:${(p[1]/base*1000).toFixed(1)};background:${p[2]}" title="${esc(p[0])}: ${fmt0.format(p[1])}"></i>`).join('')}</div>

/* ---------- Yearly overview ---------- */
let curYear=new Date().getFullYear();
function yearData(y){
  const now=new Date(),thisY=now.getFullYear();
  const lastM=y<thisY?12:y>thisY?0:now.getMonth()+1;
  const plannedSpend=totalPlanned()-lineAmt(fundLine());
  const rows=[],byLine={};let inc=0,out=0;
  for(let m=1;m<=12;m++){
    const ym=`${y}-${pad(m)}`,tx=(months[ym]&&months[ym].tx)||[];
    let mi=0,mo=0;
    for(const t of tx){const a=num(t.amount);if(t.kind==='income')mi+=a;else{mo+=a;byLine[t.cat]=(byLine[t.cat]||0)+a}}
    inc+=mi;out+=mo;
    rows.push({m,ym,inc:mi,out:mo,has:tx.length>0});
  }
  // count from the first month with anything recorded, so a late start isn't held to a full year of plan
  const first=(rows.find(r=>r.has)||{m:lastM}).m,elapsed=lastM>=first?lastM-first+1:0;
  rows.forEach(r=>{r.past=r.m>=first&&r.m<=lastM});
  return {rows,byLine,inc,out,net:inc-out,elapsed,plannedSpend};
}

  const y=curYear,d=yearData(y),active=d.rows.filter(r=>r.has||r.past);

  });
  if(d.plannedSpend>0){const py=yy(d.plannedSpend);g+=`<line x1="${L}" x2="${W-R}" y1="${py}" y2="${py}" stroke="var(--ink)" stroke-width="1.25" stroke-dasharray="5 5"/><text x="${W-R}" y="${py-7}" text-anchor="end" font-size="11.5" fill="var(--muted)">Planned ${fmt0.format(d.plannedSpend)}/mo</text>`}

function niceStep(raw){const p=10**Math.floor(Math.log10(raw||1)),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

/* ---------- Debt-free countdown ---------- */
function debtCountdown(){

  // One rounded bar per debt, from today to its payoff month. The debt the snowball is on now is the blue one.
  const W=1000,L=170,R=96,T=8,rowH=44,H=T+order.length*rowH+30,x=m=>L+(W-L-R)*m/Math.max(1,total);

  g+=`<text x="${x(0)}" y="${H-10}" text-anchor="start" font-size="11.5" fill="var(--muted)">Today</text>`;
  order.forEach((d,i)=>{
    const y=T+i*rowH+8,end=sb.payoff[d.id]||total,cur=i===0;
    g+=`<text x="0" y="${y+11}" font-size="13" fill="var(--ink)" font-weight="${cur?600:400}">${esc(d.name.length>18?d.name.slice(0,17)+'…':d.name)}</text>`;
    g+=`<text x="0" y="${y+26}" font-size="11.5" fill="var(--muted)">${fmt0.format(num(d.balance))} left</text>`;

    g+=`<text x="${x(end)+8}" y="${y+14}" font-size="11.5" fill="${cur?'var(--accent)':'var(--muted)'}">${monthsFromNow(end)}</text>`;
  });

     ${bar(s.efTarget?s.ef/s.efTarget:0,s.met[2])}<p class="sub">${fmt.format(s.ef)} of ${fmt0.format(s.efTarget)} (${plan.ef.months} × ${fmt0.format(s.monthlyExp)} monthly expenses). ${s.done[1]?eta(s.efTarget-s.ef):'Start after Step 2. Keep the $1,000 parked until then.'}</p>${loggedNote(2)}`,

    if(st==='locked')return `<li class="step locked" aria-label="Step ${i+1}, locked"><span class="n" aria-hidden="true">${LOCK}</span><div class="step-body"><div class="step-title"><h2>Step ${i+1}: ${esc(t)}</h2></div>${i===4||i===5?'':`<p class="sub">${unlockText(i)}${i===3?' (with Steps 5 and 6)':''}</p>`}</div></li>`;

    ${s.parallel?'<p class="sub" style="margin-top:12px">Steps 4, 5 and 6 run at the same time. Step 7 unlocks when all three are done.</p>':''}`;

// a bill shows as paid when you tick it, or when a transaction on its budget line for about the same amount lands that month
function billPaid(b,ym){
  const m=months[ym]||{};if(m.paid&&m.paid[b.id])return true;
  if(!b.line)return false;const a=num(b.amount),tol=Math.max(5,a*.15);
  return (m.tx||[]).some(t=>t.kind!=='income'&&t.cat===b.line&&Math.abs(num(t.amount)-a)<=tol);
}
// the calendar date a bill is due inside a budget month
function billDue(b,ym){
  const [a,e]=periodRange(ym),day=Math.min(28,Math.max(1,Math.round(num(b.day))||1));
  for(let d=new Date(a);d<=e;d.setDate(d.getDate()+1))if(d.getDate()===day||(day>28&&d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))return new Date(d);
  return new Date(a);
}
const daysUntil=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(new Date().setHours(0,0,0,0)))/864e5);
function billState(b,ym){
  if(billPaid(b,ym))return {k:'paid',t:'Paid'};
  const n=daysUntil(billDue(b,ym));
  if(n<0)return {k:'late',t:`${-n} day${n===-1?'':'s'} late`};
  if(n===0)return {k:'soon',t:'Due today'};
  if(n<=7)return {k:'soon',t:`Due in ${n} day${n===1?'':'s'}`};
  return {k:'later',t:`Due ${shortDate(billDue(b,ym))}`};
}
function nextWeekBills(){
  const now=thisPeriod(),next=(()=>{const [y,m]=now.split('-').map(Number),d=new Date(y,m,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`})();
  let sum=0;for(const b of plan.bills)for(const ym of [now,next]){const n=daysUntil(billDue(b,ym));if(n>=0&&n<=7&&!billPaid(b,ym))sum+=num(b.amount)}
  return sum;
}

// rebuild the Mac's bill reminders for the next two budget months

/* ================= Net worth and home equity ================= */
function netWorth(){
  const home=homeValue(),ef=num(plan.ef.balance),jars=(plan.jars||[]).reduce((x,j)=>x+num(j.balance),0),ret=num(plan.nw.retirement),college=num(plan.college&&plan.college.saved);
  const accts=plan.nw.accounts.reduce((x,a)=>x+num(a.amount),0),own=home+ef+jars+ret+college+accts;
  const mort=mortBalance(),debts=plan.debts.reduce((x,d)=>x+Math.max(0,num(d.balance)),0),owe=mort+debts;
  return {home,ef,jars,ret,college,accts,own,mort,debts,owe,net:own-owe,equity:home-mort};
}

/* ================= This month: spending pace ================= */
function paceHTML(tx){
  const [a,e]=periodRange(curMonth),days=Math.round((e-a)/864e5)+1,planned=totalPlanned()-lineAmt(fundLine());
  const byDay=new Array(days).fill(0);
  for(const t of tx){if(t.kind==='income')continue;const [y,m,d]=t.date.split('-').map(Number),i=Math.round((new Date(y,m-1,d)-a)/864e5);if(i>=0&&i<days)byDay[i]+=num(t.amount)}
  const cum=[];byDay.reduce((s,v,i)=>(cum[i]=s+v),0);
  const isNow=curMonth===thisPeriod(),todayIdx=isNow?Math.min(days-1,Math.max(0,daysUntil(a)*-1)):(curMonth<thisPeriod()?days-1:-1);
  if(todayIdx<0)return '';
  const spent=cum[todayIdx]||0,forecast=isNow?spent/(todayIdx+1)*days:spent,diff=forecast-planned;
  const W=600,H=170,L=8,R=8,T=12,B=22,max=Math.max(planned*1.1,forecast,spent,1);
  const x=i=>L+(W-L-R)*i/(days-1||1),y=v=>T+(H-T-B)*(1-v/max);
  const actual=cum.slice(0,todayIdx+1).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const msg=isNow?(Math.abs(diff)<planned*.02?'Right on pace for the month':`On pace to end ${MONTHS[+curMonth.slice(5)-1]} <b class="${diff>0?'bad':'good'}">${fmt0.format(Math.abs(diff))} ${diff>0?'over':'under'}</b>`):`Finished ${spent>planned?`<b class="bad">${fmt0.format(spent-planned)} over</b>`:`<b class="good">${fmt0.format(planned-spent)} under</b>`} plan`;
  const hits=cum.map((v,i)=>i<=todayIdx?`<rect x="${(x(i)-(W/days)/2).toFixed(1)}" y="0" width="${(W/days).toFixed(1)}" height="${H}" fill="transparent"><title>${shortDate(new Date(a.getFullYear(),a.getMonth(),a.getDate()+i))}: ${fmt0.format(v)} spent</title></rect>`:'').join('');
  return `<section class="panel pace"><div class="panel-head"><h2>Spending pace</h2><span class="sub">${msg}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending pace: ${fmt0.format(spent)} spent so far, plan ${fmt0.format(planned)}" style="width:100%;height:auto;display:block">
      <line x1="${x(0)}" y1="${y(0)}" x2="${x(days-1)}" y2="${y(planned)}" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="4 5"/>
      <text x="${x(days-1)}" y="${y(planned)-6}" text-anchor="end" font-size="11" fill="var(--muted)">Plan ${fmt0.format(planned)}</text>
      ${isNow&&todayIdx<days-1?`<line x1="${x(todayIdx)}" y1="${y(spent)}" x2="${x(days-1)}" y2="${y(forecast)}" stroke="${diff>0?'var(--bar-bad)':'var(--bar-good)'}" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round"/>`:''}
      <polyline points="${actual}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(todayIdx)}" cy="${y(spent)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(0)}" y="${H-5}" font-size="11" fill="var(--muted)">${shortDate(a)}</text><text x="${x(days-1)}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--muted)">${shortDate(e)}</text>
      ${hits}</svg></section>`;
}

/* ================= This month: month in review ================= */
const prevPeriod=ym=>{const [y,m]=ym.split('-').map(Number),d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function reviewFacts(ym){
  const tx=(months[ym]?.tx)||[];let inc=0,spent=0;const by={};
  for(const t of tx){const a=num(t.amount);if(t.kind==='income')inc+=a;else{spent+=a;by[t.cat]=(by[t.cat]||0)+a}}
  const planned=totalPlanned()-lineAmt(fundLine());
  const lines=plan.lines.filter(l=>l.id!=='bsfund').map(l=>({n:l.name,d:(by[l.id]||0)-lineAmt(l)}));
  const over=lines.filter(x=>x.d>1).sort((a,b)=>b.d-a.d).slice(0,2),under=lines.filter(x=>x.d<-1&&(by[plan.lines.find(l=>l.name===x.n)?.id]||0)>0).sort((a,b)=>a.d-b.d).slice(0,2);
  return {ym,name:MONTHS[+ym.slice(5)-1],inc,spent,planned,under:planned-spent,over,under2:under,count:tx.length};
}
function reviewTemplate(f){
  const parts=[`In ${f.name} you spent ${fmt0.format(f.spent)} of the ${fmt0.format(f.planned)} you planned, ${f.under>=0?`coming in ${fmt0.format(f.under)} under`:`running ${fmt0.format(-f.under)} over`}.`];
  if(f.over.length)parts.push(`${f.over.map(o=>`${o.n} ran ${fmt0.format(o.d)} over`).join(' and ')}.`);
  if(f.under2.length)parts.push(`${f.under2.map(o=>`${o.n} came in ${fmt0.format(-o.d)} under`).join(' and ')}.`);

}
let reviewAsked={};
function fetchReview(f){
  if(reviewAsked[f.ym]||months[f.ym]?.reviewText)return;reviewAsked[f.ym]=true;
  const s=stepInfo();
  const prompt=`Month: ${f.name}. Money in: ${fmt0.format(f.inc)}. Spent: ${fmt0.format(f.spent)} of ${fmt0.format(f.planned)} planned (${f.under>=0?fmt0.format(f.under)+' under':fmt0.format(-f.under)+' over'}). Over budget: ${f.over.map(o=>o.n+' by '+fmt0.format(o.d)).join(', ')||'none'}. Under budget: ${f.under2.map(o=>o.n+' by '+fmt0.format(-o.d)).join(', ')||'none'}. They are on Baby Step ${s.current+1}: ${STEP_SHORT[s.current]}. Write the summary.`;
  const done=txt=>{txt=String(txt||'').trim();if(!txt)return;months[f.ym]=months[f.ym]||{tx:[]};months[f.ym].reviewText=txt;saveMonth(f.ym);const el=$('review-text');if(el){el.textContent=txt;el.classList.add('ai')}};
  if(Store.mode==='native'&&Store.caps&&Store.caps.ai)Store.native.postMessage({op:'summarize',prompt}).then(done).catch(()=>{});

}
function reviewHTML(){
  if(curMonth!==thisPeriod())return '';

    <div class="review-chips"><span class="chip">${fmt0.format(f.inc)} in</span><span class="chip">${fmt0.format(f.spent)} spent</span><span class="chip ${f.under>=0?'done':''}">${f.under>=0?fmt0.format(f.under)+' under':fmt0.format(-f.under)+' over'}</span></div>

}
function sendLeftover(x){

function applyInput(el){

    if(f==='balance'&&before>0&&num(d.balance)<=0)setTimeout(()=>debtCelebration(d),200)}}
  else if(k.startsWith('bill:')){const [,id,f]=k.split(':');const b=plan.bills.find(x=>x.id===id);if(b){b[f]=f==='name'?v.slice(0,40):f==='day'?Math.min(31,Math.max(1,Math.round(num(v))||1)):Math.max(0,r2(num(v)))}scheduleReminders()}
  else if(k.startsWith('nw:')){plan.nw[k.slice(3)]=Math.max(0,r2(num(v)))}
  else if(k.startsWith('inc:')){const [,id,f]=k.split(':');const s=(plan.incomes||[]).find(x=>x.id===id);if(s){s[f]=f==='name'?v.slice(0,40):Math.max(0,r2(num(v)))}syncIncome()}
  else if(k.startsWith('acct:')){const [,id,f]=k.split(':');const a=plan.nw.accounts.find(x=>x.id===id);if(a)a[f]=f==='name'?v.slice(0,40):r2(num(v))}
  else if(k.startsWith('jar:')){const [,id,f]=k.split(':');const j=plan.jars.find(x=>x.id===id);if(j){
    if(f==='line'){
      if(v==='__new'){const left=Math.max(0,num(j.target)-num(j.balance)),need=j.due?Math.ceil(left/monthsUntil(j.due)):0;j.line=addJarLine(j.name,num(j.monthly)||need)}
      else{if(!v&&j.line){const l=jarLine(j);if(l)j.monthly=num(l.amt)}j.line=v}
    }else{const wasFull=num(j.target)>0&&num(j.balance)>=num(j.target);j[f]=f==='name'?v.slice(0,50):f==='due'?v:Math.max(0,r2(num(v)));
      if(!wasFull&&num(j.target)>0&&num(j.balance)>=num(j.target))setTimeout(()=>celebrate(`${j.name} is full`,`${fmt0.format(num(j.target))} saved. When the bill comes, the money’s already there.`),200)}
    delete j.example}}
  else if(k==='college.status')plan.college.status=v;
  else if(k==='mortgage.start'){const t=String(v).trim();if(/^\d{4}-\d{1,2}$/.test(t)){const [y,mm]=t.split('-');plan.mortgage.start=`${y}-${pad(+mm)}`}}
  else{const path=k.split('.');let o=plan;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path.at(-1)]=Math.max(0,num(v))}
}

// buttons that change something: a note that says what happened (unless the action already said so itself)
function actionNote(t){
  const d=t.dataset,c=t.classList.contains('confirm');
  if(d.del&&c)return 'Transaction deleted';
  if(d.delline)return 'Line removed';
  if(d.delgroup&&c)return 'Category removed';
  if(d.delbill&&c)return 'Bill removed';
  if(d.delacct&&c)return 'Account removed';
  if(d.deljar&&c)return 'Jar removed';
  if(d.delinc&&c)return 'Income removed';
  if(d.deldebt)return 'Debt removed';
  if(d.paid)return t.getAttribute('aria-pressed')==='true'?'Marked not paid':'Marked paid';
  if(d.stepdone)return `Step ${+d.stepdone+1} marked done`;
  if(d.stepundo)return `Step ${+d.stepundo+1} reopened`;
  if(d.jaradd)return 'Added this month’s amount to the jar';
  if(d.jarundo)return 'Took this month’s amount back out';
  if(d.assignrest!=null||t.id==='assign-rest')return 'Assigned to your Baby Step';
  if(d.addinc!=null)return 'Income added';
  if(d.set||d.pref)return 'Setting saved';
  if(t.id==='add-debt')return 'Debt added';
  if(t.id==='gi-add'&&($('gi-name')||{}).value)return `Added ${($('gi-name')||{}).value.trim()}`;
  if(t.id==='ng-add'&&($('ng-name')||{}).value)return `Added the ${($('ng-name')||{}).value.trim()} category`;
  if(t.id==='clear-examples')return 'Examples cleared';
  if(d.showempty!=null||t.classList.contains('showempty'))return '';
  return '';
}

function migrate(p){
  const d=defaultPlan();
  const out={...d,...p,mortgage:{...d.mortgage,...(p.mortgage||{})},ef:{...d.ef,...(p.ef||{})},retire:{...d.retire,...(p.retire||{})},college:{...d.college,...(p.college||{})}};
  if(!Array.isArray(p.lines))out.lines=d.lines;
  if(!Array.isArray(p.debts))out.debts=d.debts;
  if(!Array.isArray(p.jars))out.jars=defaultJars();
  if(!out.lines.some(l=>l.id==='jars')){const i=out.lines.findIndex(l=>l.id==='bsfund');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='jars'))}
  for(const db of out.debts)if(db.start==null||num(db.balance)>num(db.start))db.start=num(db.balance);
  if(!Array.isArray(p.stepsDone))out.stepsDone=[num(out.ef.balance)>=1000];
  if(!p.mortV2){
    out.mortV2=true;
    if(out.mortgage.home==null)out.mortgage.home=(out.nw&&out.nw.homeValue!=null)?out.nw.homeValue:out.mortgage.price;
    if(out.mortgageBalance!=null&&num(out.mortgageBalance)<=0)out.mortgageBalance=null;
    if(out.mortgageBalance!=null&&!out.mortgageAsOf)out.mortgageAsOf=todayISO().slice(0,7);
  }
  if(!Array.isArray(out.mortgagePayments))out.mortgagePayments=[];
  if(!out.mortgage.start)out.mortgage.start=out.mortgageAsOf||todayISO().slice(0,7);
  if(!out.lines.some(l=>l.id==='mortextra')){const i=out.lines.findIndex(l=>l.id==='house');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='mortextra'))}
  out.settings={...d.settings,...(p.settings||{})};out.people={...d.people,...(p.people||{})};
  out.nw={...d.nw,...(p.nw||{})};if(!Array.isArray(out.nw.accounts))out.nw.accounts=[];
  if(!Array.isArray(out.bills))out.bills=[];if(!out.nwHistory||typeof out.nwHistory!=='object')out.nwHistory={};
  // older plans carried notes tied to one city; swap those for the general ones
  const fresh=Object.fromEntries(defaultLines().map(l=>[l.id,l.note]));
  for(const l of out.lines)if(l.note&&/Duke|Piedmont|Greenville|ReWa|Upstate|\bSC\b/.test(l.note)&&l.id in fresh)l.note=fresh[l.id];
  out.groups=p.groups;normalizeGroups(out);
  return out;
}
async function boot(){
  applyAppearance();
  try{await Store.init();
    if(Store.mode==='native'){try{await Store.load()}catch(e){}}
    if(Store.mode==='native'){try{scanReady=!!(await Store.native.postMessage({op:'canScan'}))}catch(e){scanReady=false}}
    else{try{sampler=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampler=null}scanReady=!!sampler}const d=await Store.load();months=d.months||{};
    if(d.plan){plan=migrate(d.plan);if(colorsAdded)savePlan(0)}
    else{plan=defaultPlan();const ym=todayISO().slice(0,7);months[ym]={tx:exampleTx(ym)};savePlan(0);saveMonth(ym)}
    cleanOldPayments();
    if(Store.mode==='native'){try{Store.caps=await Store.native.postMessage({op:'capabilities'})||{}}catch(e){Store.caps={}}}
    await Cloud.init();
    if(Cloud.on){try{if(Cloud.wasLinked)await startSync(false);else{const d=await Cloud.loadAll();if(d.plan&&!sameBudget(d))Cloud.choice=d;else if(d.plan)Cloud.subscribe();else{await Cloud.uploadAll();Cloud.subscribe()}}}catch(e){showError('Couldn’t reach your shared budget, so this shows the copy saved on this device.')}}
  }catch(e){
    Store.mode='local';const d=await Store.load();months=d.months||{};plan=d.plan?migrate(d.plan):defaultPlan();
    showError('Couldn’t reach your saved budget, so this session saves in this browser only.');
  }
  curMonth=thisPeriod();lastPeriod=curMonth;
  scheduleReminders();
  dropLeftovers();
  runRecurring();
  render(true);
  maybeWelcome();
  // arriving from the confirmation email: say so plainly
  if(/type=signup|type=email/.test(location.hash)){history.replaceState(null,'',location.pathname);cloudMsg='✓ Email confirmed. You can sign in now (on the Mac app, click Sign in).';try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,600)}
  if(Cloud.choice)setTimeout(openCloud,700);
  // the first time on a device that can share, offer to sign in
  if(Cloud.ready&&!Cloud.on){let seen=false;try{seen=localStorage.getItem(LS+'-cloud-offered')}catch(e){}if(!seen){try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,900)}}
}
boot();
// the Windows app (the website): if a newer version has been published, switch to it right away instead of waiting on the browser's cache
function checkForUpdate(){const cur=document.querySelector('meta[name="wfb-build"]');if(!cur||!/^https?:/.test(location.protocol))return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/name="wfb-build" content="(\d+)"/);
    if(m&&m[1]!==cur.content&&!sessionStorage.getItem('wfb-upd-'+m[1])){sessionStorage.setItem('wfb-upd-'+m[1],'1');location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{})}
checkForUpdate();
let lastPeriod=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden||!plan)return;checkForUpdate();
  const now=thisPeriod();lastPeriod=lastPeriod||now;
  if(now!==lastPeriod){if(curMonth===lastPeriod)curMonth=now;lastPeriod=now;runRecurring();render()}});
