  const list=bills.length?bills.map(b=>{const st=billState(b,ym),c=pendingDelete==='bill:'+b.id;return `<li class="bill2"><div class="b2-top"><span class="bill-dot" style="background:${colorOf(b)}"></span>
      <input class="b2-name" aria-label="Bill name" data-k="bill:${b.id}:name" value="${esc(b.name)}"><span class="b2-st ${st.k}">${st.t}</span></div>
      <div class="b2-row"><label class="pfx"><span>Due day</span><input class="money" inputmode="numeric" aria-label="Due day" data-k="bill:${b.id}:day" value="${num(b.day)}"></label>
      <label class="pfx"><span>$</span><input class="money" inputmode="decimal" aria-label="Amount" data-k="bill:${b.id}:amount" value="${num(b.amount).toFixed(2)}"></label>
      <button class="b2-btn paid-btn ${billPaid(b,ym)?'on':''}" data-paid="${b.id}" aria-pressed="${billPaid(b,ym)}" title="${billPaid(b,ym)?'Paid · tap to undo':'Mark paid'}">✓</button>
      <button class="b2-btn b2-del ${c?'confirm':''}" data-delbill="${b.id}" aria-label="Delete ${esc(b.name)}" title="Delete">${c?'Delete?':'×'}</button></div></li>`}).join('')
    :`<li class="empty">No bills yet. Add them below, or pull them in from your budget.<div style="margin-top:10px"><button class="textbtn" id="seed-bills">Add bills from my budget</button></div></li>`;
  const reminders=Store.mode==='native'?(plan.settings.notify!==false?`Your Mac reminds you ${plan.settings.remindDays||2} day${(plan.settings.remindDays||2)==1?'':'s'} before each bill at 9 AM. Change it in Settings.`:'Reminders are off. Turn them on in Settings.'):'Reminders work in the Mac app.';
  return `<div class="col">

    <div class="stat"><span class="k">Paid</span><span class="v">${fmt.format(paid)}</span><span class="s">${bills.filter(b=>billPaid(b,ym)).length} of ${bills.length} done</span></div>

  </section>
  <div class="row">
    <section class="panel"><div class="panel-head"><h2>${monthName(ym)}</h2><span class="sub">${periodLabel(ym)||'Tap ✓ on a bill when it’s paid'}</span></div>
      <div class="cal"><div class="cal-h">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-g">${cells.join('')}</div></div></section>
    <div class="col">
      <section class="panel"><h2>Your bills</h2><ul class="bills">${list}</ul><p class="sub">${reminders}</p></section>
      <section class="panel" id="add-bill"><h2>Add a bill</h2>
        <div class="field"><label for="nb-name">Name</label><input id="nb-name" placeholder="Duke Energy" maxlength="40"></div>
        <div class="trio"><div class="field"><label for="nb-amt">Amount</label><input id="nb-amt" class="money" inputmode="decimal" placeholder="0.00"></div>
          <div class="field"><label for="nb-day">Due day</label><input id="nb-day" class="money" inputmode="numeric" placeholder="15"></div>
          <div class="field"><label for="nb-line">Budget line</label><select id="nb-line">${lineOpts('')}</select></div></div>
        <div><button class="textbtn primary" id="nb-add">Add bill</button></div><p class="formmsg" id="nb-msg" role="status"></p></section>
    </div></div></div>`;
}
// hovering (or focusing) a bill on the calendar shows its details in a small glass card
function billPop(chip){
  let pop=$('bill-pop');if(!pop){pop=document.createElement('div');pop.id='bill-pop';pop.className='bill-pop';pop.setAttribute('role','tooltip');document.body.appendChild(pop)}
  if(!chip){pop.classList.remove('show');return}
  const b=plan.bills.find(x=>x.id===chip.dataset.billpop);if(!b)return;
  const ym=curMonth,st=billState(b,ym),due=billDue(b,ym),l=plan.lines.find(x=>x.id===b.line),col=l?catColor(l.g):'var(--g2)';
  pop.innerHTML=`<div class="bp-name"><i style="background:${col}"></i>${esc(b.name)}</div><div class="bp-amt">${fmt.format(num(b.amount))}</div>
    <div class="bp-rows"><div>Due<b>${due.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</b></div>
    <div>Budget line<b>${l?esc(l.name):'None'}</b></div>${l?`<div>Category<b>${esc(l.g)}</b></div>`:''}
    <div>Every month on<b>the ${ordinal(Math.round(num(b.day))||1)}</b></div></div>
    <div class="bp-st"><span class="b2-st ${st.k}">${st.k==='paid'?'✓ Paid':st.t}</span></div>`;
  const r=chip.getBoundingClientRect(),w=250,h=pop.offsetHeight||180;
  const left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2)),below=r.top-h-10<($('globalnav').offsetHeight+8);
  pop.classList.toggle('below',below);
  pop.style.left=left+'px';pop.style.top=(below?r.bottom+10:r.top-h-10)+'px';
  pop.style.setProperty('--ox',(r.left+r.width/2-left)+'px');
  requestAnimationFrame(()=>pop.classList.add('show'));
}
document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('.cal-bill');if(c)billPop(c);else if(!e.target.closest||!e.target.closest('#bill-pop'))billPop(null)});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('cal-bill'))billPop(e.target)});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('cal-bill'))billPop(null)});
addEventListener('scroll',()=>billPop(null),{passive:true});
// a starting list of bills from the budget lines that are usually bills
function seedBills(){
  const guess={house:['Mortgage',1],electric:['Electric',15],natgas:['Natural gas',15],water:['Water and sewer',20],trash:['Trash pickup',25],internet:['Internet',10],phones:['Phones',21],autoins:['Car insurance',5],health:['Health insurance',1],life:['Life insurance',5],subs:['Subscriptions',12]};

// rebuild the Mac's bill reminders for the next two budget months
let remindTimer=null;
function scheduleReminders(){
  // no bills yet means nothing to remind about, so the Mac doesn't ask for notification permission early
  if(Store.mode!=='native'||!plan||(!plan.bills.length&&!scheduleReminders.had))return;
  scheduleReminders.had=true;
  clearTimeout(remindTimer);remindTimer=setTimeout(()=>{
    const on=plan.settings.notify!==false,days=num(plan.settings.remindDays)||2,items=[];
    if(on){const now=thisPeriod();for(let k=0;k<3;k++){const [y,m]=now.split('-').map(Number),d=new Date(y,m-1+k,1),ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      for(const b of plan.bills){if(billPaid(b,ym))continue;const due=billDue(b,ym),r=new Date(due);r.setDate(r.getDate()-days);if(daysUntil(r)<0)continue;

/* ================= Net worth and home equity ================= */
function netWorth(){
  const home=homeValue(),ef=num(plan.ef.balance),jars=(plan.jars||[]).reduce((x,j)=>x+num(j.balance),0),ret=num(plan.nw.retirement),college=num(plan.college&&plan.college.saved);
  const accts=plan.nw.accounts.reduce((x,a)=>x+num(a.amount),0),own=home+ef+jars+ret+college+accts;
  const mort=mortBalance(),debts=plan.debts.reduce((x,d)=>x+Math.max(0,num(d.balance)),0),owe=mort+debts;
  return {home,ef,jars,ret,college,accts,own,mort,debts,owe,net:own-owe,equity:home-mort};
}

/* ================= This month: spending pace ================= */
function paceHTML(tx){
  const [a,e]=periodRange(curMonth),days=Math.round((e-a)/864e5)+1,planned=totalPlanned()-lineAmt(fundLine());
  const byDay=new Array(days).fill(0);
  for(const t of tx){if(t.kind==='income')continue;const [y,m,d]=t.date.split('-').map(Number),i=Math.round((new Date(y,m-1,d)-a)/864e5);if(i>=0&&i<days)byDay[i]+=num(t.amount)}
  const cum=[];byDay.reduce((s,v,i)=>(cum[i]=s+v),0);
  const isNow=curMonth===thisPeriod(),todayIdx=isNow?Math.min(days-1,Math.max(0,daysUntil(a)*-1)):(curMonth<thisPeriod()?days-1:-1);
  if(todayIdx<0)return '';
  const spent=cum[todayIdx]||0,forecast=isNow?spent/(todayIdx+1)*days:spent,diff=forecast-planned;
  const W=600,H=170,L=8,R=8,T=12,B=22,max=Math.max(planned*1.1,forecast,spent,1);
  const x=i=>L+(W-L-R)*i/(days-1||1),y=v=>T+(H-T-B)*(1-v/max);
  const actual=cum.slice(0,todayIdx+1).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const msg=isNow?(Math.abs(diff)<planned*.02?'Right on pace for the month':`On pace to end ${MONTHS[+curMonth.slice(5)-1]} <b class="${diff>0?'bad':'good'}">${fmt0.format(Math.abs(diff))} ${diff>0?'over':'under'}</b>`):`Finished ${spent>planned?`<b class="bad">${fmt0.format(spent-planned)} over</b>`:`<b class="good">${fmt0.format(planned-spent)} under</b>`} plan`;
  const hits=cum.map((v,i)=>i<=todayIdx?`<rect x="${(x(i)-(W/days)/2).toFixed(1)}" y="0" width="${(W/days).toFixed(1)}" height="${H}" fill="transparent"><title>${shortDate(new Date(a.getFullYear(),a.getMonth(),a.getDate()+i))}: ${fmt0.format(v)} spent</title></rect>`:'').join('');
  return `<section class="panel pace"><div class="panel-head"><h2>Spending pace</h2><span class="sub">${msg}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending pace: ${fmt0.format(spent)} spent so far, plan ${fmt0.format(planned)}" style="width:100%;height:auto;display:block">
      <line x1="${x(0)}" y1="${y(0)}" x2="${x(days-1)}" y2="${y(planned)}" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="4 5"/>
      <text x="${x(days-1)}" y="${y(planned)-6}" text-anchor="end" font-size="11" fill="var(--muted)">Plan ${fmt0.format(planned)}</text>
      ${isNow&&todayIdx<days-1?`<line x1="${x(todayIdx)}" y1="${y(spent)}" x2="${x(days-1)}" y2="${y(forecast)}" stroke="${diff>0?'var(--bar-bad)':'var(--bar-good)'}" stroke-width="1.75" stroke-dasharray="2 4" stroke-linecap="round"/>`:''}
      <polyline points="${actual}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(todayIdx)}" cy="${y(spent)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(0)}" y="${H-5}" font-size="11" fill="var(--muted)">${shortDate(a)}</text><text x="${x(days-1)}" y="${H-5}" text-anchor="end" font-size="11" fill="var(--muted)">${shortDate(e)}</text>
      ${hits}</svg></section>`;
}

/* ================= This month: month in review ================= */
const prevPeriod=ym=>{const [y,m]=ym.split('-').map(Number),d=new Date(y,m-2,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
function reviewFacts(ym){
  const tx=(months[ym]?.tx)||[];let inc=0,spent=0;const by={};
  for(const t of tx){const a=num(t.amount);if(t.kind==='income')inc+=a;else{spent+=a;by[t.cat]=(by[t.cat]||0)+a}}
  const planned=totalPlanned()-lineAmt(fundLine());
  const lines=plan.lines.filter(l=>l.id!=='bsfund').map(l=>({n:l.name,d:(by[l.id]||0)-lineAmt(l)}));
  const over=lines.filter(x=>x.d>1).sort((a,b)=>b.d-a.d).slice(0,2),under=lines.filter(x=>x.d<-1&&(by[plan.lines.find(l=>l.name===x.n)?.id]||0)>0).sort((a,b)=>a.d-b.d).slice(0,2);
  return {ym,name:MONTHS[+ym.slice(5)-1],inc,spent,planned,under:planned-spent,over,under2:under,count:tx.length};
}
function reviewTemplate(f){
  const parts=[`In ${f.name} you spent ${fmt0.format(f.spent)} of the ${fmt0.format(f.planned)} you planned, ${f.under>=0?`coming in ${fmt0.format(f.under)} under`:`running ${fmt0.format(-f.under)} over`}.`];
  if(f.over.length)parts.push(`${f.over.map(o=>`${o.n} ran ${fmt0.format(o.d)} over`).join(' and ')}.`);
  if(f.under2.length)parts.push(`${f.under2.map(o=>`${o.n} came in ${fmt0.format(-o.d)} under`).join(' and ')}.`);
  return parts.join(' ');
}
let reviewAsked={};
function fetchReview(f){
  if(reviewAsked[f.ym]||months[f.ym]?.reviewText)return;reviewAsked[f.ym]=true;
  const s=stepInfo();
  const prompt=`Month: ${f.name}. Money in: ${fmt0.format(f.inc)}. Spent: ${fmt0.format(f.spent)} of ${fmt0.format(f.planned)} planned (${f.under>=0?fmt0.format(f.under)+' under':fmt0.format(-f.under)+' over'}). Over budget: ${f.over.map(o=>o.n+' by '+fmt0.format(o.d)).join(', ')||'none'}. Under budget: ${f.under2.map(o=>o.n+' by '+fmt0.format(-o.d)).join(', ')||'none'}. They are on Baby Step ${s.current+1}: ${STEP_SHORT[s.current]}. Write the summary.`;
  const done=txt=>{txt=String(txt||'').trim();if(!txt)return;months[f.ym]=months[f.ym]||{tx:[]};months[f.ym].reviewText=txt;saveMonth(f.ym);const el=$('review-text');if(el){el.textContent=txt;el.classList.add('ai')}};
  if(Store.mode==='native'&&Store.caps&&Store.caps.ai)Store.native.postMessage({op:'summarize',prompt}).then(done).catch(()=>{});
  else if(sampler)sampler.json(prompt+'\nReply with only a JSON object: {"summary": "2 or 3 warm, plain sentences using only these numbers"}').then(r=>done(r&&r.summary)).catch(()=>{});
}
function reviewHTML(){
  if(curMonth!==thisPeriod())return '';
  const ym=prevPeriod(curMonth),m=months[ym];
  if(!m||!(m.tx||[]).length||m.reviewed)return '';
  const f=reviewFacts(ym),s=stepInfo();fetchReview(f);
  // only what was actually left: never more than came in minus what went out
  const left=Math.floor(f.inc>0?Math.min(f.under,f.inc-f.spent):f.under),canSend=left>1&&!s.done[s.current]&&s.current<=2;
  return `<section class="panel review"><div class="panel-head"><h2>${f.name} in review</h2><button class="del" data-review-done aria-label="Dismiss">×</button></div>
    <p id="review-text" class="review-text ${m.reviewText?'ai':''}">${esc(m.reviewText||reviewTemplate(f))}</p>
    <div class="review-chips"><span class="chip">${fmt0.format(f.inc)} in</span><span class="chip">${fmt0.format(f.spent)} spent</span><span class="chip ${f.under>=0?'done':''}">${f.under>=0?fmt0.format(f.under)+' under':fmt0.format(-f.under)+' over'}</span></div>
    <div class="jar-actions">${canSend?`<button class="textbtn primary" data-review-send="${left}">Send ${fmt0.format(left)} to ${esc(fundName())}</button>`:''}<button class="textbtn subtle" data-review-done>Done</button></div></section>`;
}
function sendLeftover(x){
  const s=stepInfo(),ym=prevPeriod(curMonth);
  if(s.current===1){const d=plan.debts.filter(d=>num(d.balance)>0).sort((a,b)=>num(a.balance)-num(b.balance))[0];
    if(d){const before=num(d.balance);d.balance=r2(Math.max(0,before-x));if(before>0&&d.balance<=0)debtCelebration(d)}}

// finishing, opening or reopening a step: each card glides to its new size and place instead of snapping
function stepMorph(change,after){

  const root=document.documentElement;root.classList.add('vt-steps');
  const vt=document.startViewTransition(change);vt.ready.catch(()=>{});vt.updateCallbackDone.catch(()=>{});
  vt.finished.catch(()=>{}).finally(()=>{root.classList.remove('vt-steps');after&&after()});
}
// a paid-off debt, a full jar or a paid-off house: a quiet note in the toast under the bar

const ordinal=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function openSettings(){const w=$('settings-sheet');w.querySelector('.sheet').innerHTML=settingsHTML();w.classList.add('open');document.body.classList.add('sheet-lock')}

function exportCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`,rows=[['Date','Description','Budget line','Type','Amount','Who'].map(q).join(',')];
  for(const [,m] of Object.entries(months).sort())for(const t of (m.tx||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)))rows.push([t.date,t.desc||'',lineName(t.cat),t.kind==='income'?'Income':'Expense',num(t.amount).toFixed(2),t.who?personName(t.who):'Shared'].map(q).join(','));
  return rows.join('\n');
}

function applyInput(el){
  const k=el.dataset.k,v=el.tagName==='SELECT'?el.value:el.value;
  if(k.startsWith('line:')){const l=plan.lines.find(x=>x.id===k.slice(5));if(l)l.amt=Math.max(0,r2(num(v)))}
  else if(k.startsWith('debt:')){const [,id,f]=k.split(':');const d=plan.debts.find(x=>x.id===id);if(d){const before=num(d.balance);d[f]=f==='name'?v.slice(0,50):Math.max(0,num(v));delete d.example;if(f==='balance'&&(d.start==null||d.balance>d.start))d.start=d.balance;
    if(f==='balance'&&before>0&&num(d.balance)<=0)setTimeout(()=>debtCelebration(d),200)}}
  else if(k.startsWith('bill:')){const [,id,f]=k.split(':');const b=plan.bills.find(x=>x.id===id);if(b){b[f]=f==='name'?v.slice(0,40):f==='day'?Math.min(31,Math.max(1,Math.round(num(v))||1)):Math.max(0,r2(num(v)))}scheduleReminders()}
  else if(k.startsWith('nw:')){plan.nw[k.slice(3)]=Math.max(0,r2(num(v)))}
  else if(k.startsWith('inc:')){const [,id,f]=k.split(':');const s=(plan.incomes||[]).find(x=>x.id===id);if(s){s[f]=f==='name'?v.slice(0,40):Math.max(0,r2(num(v)))}syncIncome()}
  else if(k.startsWith('acct:')){const [,id,f]=k.split(':');const a=plan.nw.accounts.find(x=>x.id===id);if(a)a[f]=f==='name'?v.slice(0,40):r2(num(v))}
  else if(k.startsWith('jar:')){const [,id,f]=k.split(':');const j=plan.jars.find(x=>x.id===id);if(j){
    if(f==='line'){
      if(v==='__new'){const left=Math.max(0,num(j.target)-num(j.balance)),need=j.due?Math.ceil(left/monthsUntil(j.due)):0;j.line=addJarLine(j.name,num(j.monthly)||need)}
      else{if(!v&&j.line){const l=jarLine(j);if(l)j.monthly=num(l.amt)}j.line=v}
    }else{const wasFull=num(j.target)>0&&num(j.balance)>=num(j.target);j[f]=f==='name'?v.slice(0,50):f==='due'?v:Math.max(0,r2(num(v)));
      if(!wasFull&&num(j.target)>0&&num(j.balance)>=num(j.target))setTimeout(()=>celebrate(`${j.name} is full`,`${fmt0.format(num(j.target))} saved. When the bill comes, the money’s already there.`),200)}
    delete j.example}}
  else if(k==='college.status')plan.college.status=v;
  else if(k==='mortgageBalance'||k==='mortbal'){plan.mortgageBalance=Math.max(0,r2(num(v)));plan.mortgageAsOf=thisPeriod()}
  else if(k==='mortgage.start'){if(/^\d{4}-\d{2}$/.test(v))plan.mortgage.start=v}
  else if(k==='mortgage.origLoan'){const price=num(plan.mortgage.price);if(price>0)plan.mortgage.downPct=Math.max(0,Math.min(100,r2((1-Math.max(0,num(v))/price)*100)))}
  else{const path=k.split('.');let o=plan;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path.at(-1)]=Math.max(0,num(v))}
}

document.addEventListener('focusout',e=>{

// buttons that change something: a note that says what happened (unless the action already said so itself)
function actionNote(t){
  const d=t.dataset,c=t.classList.contains('confirm');
  if(d.del&&c)return 'Transaction deleted';
  if(d.delline)return 'Line removed';
  if(d.delgroup&&c)return 'Category removed';
  if(d.delbill&&c)return 'Bill removed';
  if(d.delacct&&c)return 'Account removed';
  if(d.deljar&&c)return 'Jar removed';
  if(d.delinc&&c)return 'Income removed';
  if(d.deldebt)return 'Debt removed';
  if(d.paid)return t.getAttribute('aria-pressed')==='true'?'Marked not paid':'Marked paid';
  if(d.stepdone)return `Step ${+d.stepdone+1} marked done`;
  if(d.stepundo)return `Step ${+d.stepundo+1} reopened`;
  if(d.jaradd)return 'Added this month’s amount to the jar';
  if(d.jarundo)return 'Took this month’s amount back out';
  if(d.assignrest!=null||t.id==='assign-rest')return 'Assigned to your Baby Step';
  if(d.addinc!=null)return 'Income added';
  if(d.set||d.pref)return 'Setting saved';
  if(t.id==='add-debt')return 'Debt added';
  if(t.id==='gi-add'&&($('gi-name')||{}).value)return `Added ${($('gi-name')||{}).value.trim()}`;
  if(t.id==='ng-add'&&($('ng-name')||{}).value)return `Added the ${($('ng-name')||{}).value.trim()} category`;
  if(t.id==='clear-examples')return 'Examples cleared';
  if(d.showempty!=null||t.classList.contains('showempty'))return '';
  return '';
}
document.addEventListener('click',e=>{

},true);

function sendBarRects(late){

  const nav=$('globalnav'),rects=[...nav.querySelectorAll('button,a,.gw,input,select,[role="tab"]')].map(el=>el.getBoundingClientRect()).filter(r=>r.width&&r.height).map(r=>[r.left,r.top,r.width,r.height]);
  Store.native.postMessage({op:'barRects',h:nav.getBoundingClientRect().bottom,rects}).catch(()=>{});
  // again once the bar's animations have settled
  if(!late){clearTimeout(sendBarRects.t);sendBarRects.t=setTimeout(()=>sendBarRects(true),650)}

function migrate(p){
  const d=defaultPlan();
  const out={...d,...p,mortgage:{...d.mortgage,...(p.mortgage||{})},ef:{...d.ef,...(p.ef||{})},retire:{...d.retire,...(p.retire||{})},college:{...d.college,...(p.college||{})}};
  if(!Array.isArray(p.lines))out.lines=d.lines;
  if(!Array.isArray(p.debts))out.debts=d.debts;
  if(!Array.isArray(p.jars))out.jars=defaultJars();
  if(!out.lines.some(l=>l.id==='jars')){const i=out.lines.findIndex(l=>l.id==='bsfund');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='jars'))}
  for(const db of out.debts)if(db.start==null||num(db.balance)>num(db.start))db.start=num(db.balance);
  if(!Array.isArray(p.stepsDone))out.stepsDone=[num(out.ef.balance)>=1000];
  if(!p.mortV2){
    out.mortV2=true;
    if(out.mortgage.home==null)out.mortgage.home=(out.nw&&out.nw.homeValue!=null)?out.nw.homeValue:out.mortgage.price;
    if(out.mortgageBalance!=null&&num(out.mortgageBalance)<=0)out.mortgageBalance=null;
    if(out.mortgageBalance!=null&&!out.mortgageAsOf)out.mortgageAsOf=todayISO().slice(0,7);
  }
  if(!Array.isArray(out.mortgagePayments))out.mortgagePayments=[];
  if(!out.mortgage.start)out.mortgage.start=out.mortgageAsOf||todayISO().slice(0,7);
  if(!out.lines.some(l=>l.id==='mortextra')){const i=out.lines.findIndex(l=>l.id==='house');out.lines.splice(i+1,0,defaultLines().find(l=>l.id==='mortextra'))}
  out.settings={...d.settings,...(p.settings||{})};out.people={...d.people,...(p.people||{})};
  out.nw={...d.nw,...(p.nw||{})};if(!Array.isArray(out.nw.accounts))out.nw.accounts=[];
  if(!Array.isArray(out.bills))out.bills=[];if(!out.nwHistory||typeof out.nwHistory!=='object')out.nwHistory={};
  // older plans carried notes tied to one city; swap those for the general ones
  const fresh=Object.fromEntries(defaultLines().map(l=>[l.id,l.note]));
  for(const l of out.lines)if(l.note&&/Duke|Piedmont|Greenville|ReWa|Upstate|\bSC\b/.test(l.note)&&l.id in fresh)l.note=fresh[l.id];
  out.groups=p.groups;normalizeGroups(out);
  return out;
}
async function boot(){
  applyAppearance();
  try{await Store.init();
    if(Store.mode==='native'){try{await Store.load()}catch(e){}}
    if(Store.mode==='native'){try{scanReady=!!(await Store.native.postMessage({op:'canScan'}))}catch(e){scanReady=false}}
    else{try{sampler=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampler=null}scanReady=!!sampler}const d=await Store.load();months=d.months||{};
    if(d.plan){plan=migrate(d.plan);if(colorsAdded)savePlan(0)}
    else{plan=defaultPlan();const ym=todayISO().slice(0,7);months[ym]={tx:exampleTx(ym)};savePlan(0);saveMonth(ym)}
    cleanOldPayments();
    if(Store.mode==='native'){try{Store.caps=await Store.native.postMessage({op:'capabilities'})||{}}catch(e){Store.caps={}}}
    await Cloud.init();
    if(Cloud.on){try{if(Cloud.wasLinked)await startSync(false);else{const d=await Cloud.loadAll();if(d.plan&&!sameBudget(d))Cloud.choice=d;else if(d.plan)Cloud.subscribe();else{await Cloud.uploadAll();Cloud.subscribe()}}}catch(e){showError('Couldn’t reach your shared budget, so this shows the copy saved on this device.')}}
  }catch(e){
    Store.mode='local';const d=await Store.load();months=d.months||{};plan=d.plan?migrate(d.plan):defaultPlan();
    showError('Couldn’t reach your saved budget, so this session saves in this browser only.');
  }
  curMonth=thisPeriod();
  scheduleReminders();
  render(true);
  // arriving from the confirmation email: say so plainly
  if(/type=signup|type=email/.test(location.hash)){history.replaceState(null,'',location.pathname);cloudMsg='✓ Email confirmed. You can sign in now (on the Mac app, click Sign in).';try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,600)}
  if(Cloud.choice)setTimeout(openCloud,700);
  // the first time on a device that can share, offer to sign in
  if(Cloud.ready&&!Cloud.on){let seen=false;try{seen=localStorage.getItem(LS+'-cloud-offered')}catch(e){}if(!seen){try{localStorage.setItem(LS+'-cloud-offered','1')}catch(e){}setTimeout(openCloud,900)}}
}
